/* ── Modo execucao: um pacote de cada vez, sem chance de trocar ── */
let exec=null;
function abrirExec(id){exec={id:String(id)};desenharExec();}
function fecharExec(){exec=null;$('exec').classList.add('oculto');$('exec').innerHTML='';}
function desenharExec(){
  if(!exec)return;
  const p=pedidos.find(x=>String(x.shipmentId)===exec.id);
  if(!p||['pronto','despachado','problema'].includes(p.momento)){fecharExec();return;}
  const m=modDe(p.modalidade), passo={imprimir:1,bipar:2,foto:3}[p.momento]||1;
  const instr={
    imprimir:'Imprima a etiqueta deste pedido.',
    bipar:'Separe o produto acima, cole a etiqueta na caixa e <b>bipe a etiqueta colada</b>.',
    foto:'Etiqueta conferida. Tire a foto da caixa <b>aberta</b>, com o produto e a etiqueta aparecendo.',
    nf:'Este pedido está esperando a NF do cliente. A etiqueta ainda não pode ser impressa.'}[p.momento]||'';
  let principal='';
  if(p.momento==='imprimir')principal=`<button class="btn pri full ex-main" type="button" id="ex-imprimir">Imprimir etiqueta</button>`;
  if(p.momento==='bipar')principal=`<form id="ex-form" autocomplete="off"><input id="ex-bip" inputmode="numeric" placeholder="Leitor: bipe aqui" aria-label="Bipar etiqueta colada"><button class="btn pri" type="button" id="ex-cam">Câmera</button></form>
    <button class="btn full" type="button" id="ex-reimp" style="min-height:44px">Reimprimir etiqueta</button>`;
  if(p.momento==='foto')principal=`<button class="btn pri full ex-main" type="button" id="ex-foto">Tirar foto da caixa</button>
    <button class="btn full" type="button" id="ex-reimp" style="min-height:44px">Reimprimir etiqueta</button>`;
  $('exec').innerHTML=`<div class="ex-cab" style="background:${m.cor}"><small>Fazendo agora · ${m.nome}${p.atrasado?' · ATRASADO':''}</small><b id="exec-cli">${esc(p.clienteNome||p.contaId)}</b><span style="font-size:13px;opacity:.9" class="mono">envio ${esc(p.shipmentId)}</span></div>
    <div class="ex-corpo">
      ${(p.itens||[]).map(i=>`<div class="ex-item"><span class="q tab">${esc(i.qtd)}×</span><div style="display:flex;flex-direction:column;gap:4px"><b>${esc(i.titulo)}</b><span style="font-size:13px;color:var(--subtle)">${i.atributos?esc(i.atributos):''}</span>
        ${i.receita?`<span style="display:flex;flex-wrap:wrap;gap:4px">${i.receita.map(r=>`<span class="chip-sku">Pegar ${r.qtd*(Number(i.qtd)||1)}× <span class="mono">${esc(r.sku)}</span></span>`).join('')}</span>`:'<span class="tag warn" style="align-self:flex-start">Anúncio sem vínculo com produto · vincule em Produtos</span>'}</div></div>`).join('')}
      <div class="ex-passos">${['Imprimir','Bipar etiqueta','Foto'].map((t,k)=>`<div class="ex-passo ${k+1<passo?'feito':k+1===passo?'agora':''}">${k+1<passo?'✓ ':''}${t}</div>`).join('')}</div>
      <div class="ex-instr">${instr}</div>
      ${principal}
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px">
        <button class="btn" type="button" id="ex-pausar">Pausar e voltar</button>
        <button class="btn" type="button" id="ex-prob" style="color:var(--bad-fg)">Reportar problema</button>
      </div>
    </div>`;
  $('exec').classList.remove('oculto');
  const q=id=>document.getElementById(id);
  q('ex-pausar').onclick=fecharExec;
  q('ex-prob').onclick=async()=>{const motivo=prompt('Qual o problema? (ex.: produto faltando, avariado)');if(!motivo)return;
    try{await chamar('prepMudarEtapa',{shipmentId:exec.id,etapa:'problema',motivo});fecharExec();carregar();}catch(e){erro('Não deu certo',esc(e.message));}};
  if(q('ex-imprimir'))q('ex-imprimir').onclick=e=>acao('etiqueta',exec.id,e.currentTarget);
  if(q('ex-reimp'))q('ex-reimp').onclick=e=>acao('etiqueta',exec.id,e.currentTarget);
  if(q('ex-foto'))q('ex-foto').onclick=()=>pedirFoto(exec.id);
  if(q('ex-form')){
    q('ex-form').onsubmit=e=>{e.preventDefault();const lido=idDaEtiqueta(q('ex-bip').value);q('ex-bip').value='';conferirEtiqueta(lido);};
    q('ex-cam').onclick=()=>abrirCamera('Bipe a etiqueta colada nesta caixa',conferirEtiqueta);
    setTimeout(()=>q('ex-bip')&&q('ex-bip').focus(),50);
  }
}
// A etiqueta bipada tem que ser exatamente a do pedido em execucao
async function conferirEtiqueta(lido){
  if(!exec)return;
  if(!lido){som(false);erro('Código não reconhecido','Bipe o código de barras ou o QR da etiqueta do Mercado Livre.');return;}
  if(lido.startsWith('R:')){
    // Etiqueta dos Correios: compara pelo rastreio (busca no ML se ainda nao temos)
    const pe=pedidos.find(x=>String(x.shipmentId)===exec.id);
    if(pe&&!pe.rastreio){try{const r=await chamar('prepRastreio',{shipmentId:exec.id});pe.rastreio=r.rastreio;}catch{}}
    const outro=acharPedido(lido);
    lido=pe&&String(pe.rastreio||'').toUpperCase()===lido.slice(2)?exec.id:(outro?String(outro.shipmentId):lido.slice(2));
  }
  if(lido!==exec.id){
    const outro=pedidos.find(x=>String(x.shipmentId)===lido);
    som(false);
    erro('ETIQUETA ERRADA',`Essa etiqueta é do envio ${esc(lido)}${outro?` (${esc(outro.clienteNome||'')} · ${esc((outro.itens||[]).map(i=>i.titulo).join(', '))})`:''}.<br><br>Esta caixa é de <b>${esc((pedidos.find(x=>String(x.shipmentId)===exec.id)||{}).clienteNome||'')}</b>. Tire a etiqueta errada e cole a certa.`);
    return;
  }
  registrar(lido);
}

// Tira uma foto (camera ao vivo; sem camera, escolhe arquivo) e devolve o JPEG em base64
function capturarFoto(instrucao){
  return new Promise(async resolve=>{
    const reduzir=c=>{let b=c.toDataURL('image/jpeg',0.7).split(',')[1];if(b.length>850000)b=c.toDataURL('image/jpeg',0.5).split(',')[1];return b;};
    const canvasDe=(src,w,h)=>{const k=Math.min(1,1280/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c;};
    const porArquivo=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
      inp.onchange=async()=>{const f=inp.files?.[0];if(!f)return resolve(null);
        const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=URL.createObjectURL(f);});
        resolve(reduzir(canvasDe(img,img.width,img.height)));};
      inp.click();};
    if(!navigator.mediaDevices?.getUserMedia)return porArquivo();
    const o=$('overlay');o.style.background='#100D14';o.classList.remove('oculto');
    o.innerHTML=`<div class="m">${esc(instrucao)}</div><video id="cap-v" autoplay playsinline muted style="width:100%;max-width:640px;max-height:58vh;border-radius:8px;background:#000"></video>
      <div id="cap-zoom" class="zoom-foto" style="display:none;gap:8px" role="group" aria-label="Aproximar"></div>
      <button class="btn pri" type="button" id="cap-ok" style="min-width:240px">Tirar foto</button>
      <button class="btn" type="button" id="cap-x" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Cancelar</button>`;
    let st=null;const parar=()=>{try{st?.getTracks().forEach(t=>t.stop());}catch{}};
    $('cap-x').onclick=()=>{parar();o.classList.add('oculto');o.innerHTML='';resolve(null);};
    try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('cap-v').srcObject=st;zoomNaCamera(st,'cap-zoom');}
    catch{parar();o.classList.add('oculto');o.innerHTML='';return porArquivo();}
    $('cap-ok').onclick=()=>{const v=$('cap-v');if(!v.videoWidth)return;const c=canvasDe(v,v.videoWidth,v.videoHeight);parar();o.classList.add('oculto');o.innerHTML='';resolve(reduzir(c));};
  });
}

// Foto pela camera ao vivo (celular e computador). Sem camera: escolhe arquivo.
let camStream=null;
// Zoom da camera da foto (comeca em 2x quando o aparelho deixa): imagem mais fechada e legivel
function zoomNaCamera(stream,alvoId){
  try{
    const tr=stream.getVideoTracks()[0];const cap=tr.getCapabilities?.()||{};
    try{tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch{}
    if(!cap.zoom||cap.zoom.max<=1)return;
    const max=Math.min(cap.zoom.max,4),niveis=[1,2,3,4].filter(z=>z<=max),alvo=$(alvoId);
    const aplicar=async z=>{try{await tr.applyConstraints({advanced:[{zoom:z}]});}catch{}alvo.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.z)===z));};
    alvo.innerHTML=niveis.map(z=>`<button class="btn" type="button" data-z="${z}" style="min-width:60px;min-height:44px">${z}×</button>`).join('');
    alvo.querySelectorAll('button').forEach(x=>x.onclick=()=>aplicar(Number(x.dataset.z)));
    alvo.style.display='flex';aplicar(Math.min(2,max));
  }catch{}
}

async function pedirFoto(id){
  fotoPara=id;
  if(!navigator.mediaDevices?.getUserMedia){$('foto-input').value='';$('foto-input').click();return;}
  const o=$('overlay');o.style.background='#100D14';o.classList.remove('oculto');
  o.innerHTML=`<div class="m">Caixa aberta, com o produto e a etiqueta aparecendo</div>
    <video id="cam-v" autoplay playsinline muted style="width:100%;max-width:640px;max-height:58vh;border-radius:8px;background:#000"></video>
    <div id="cam-zoom" class="zoom-foto" style="display:none;gap:8px" role="group" aria-label="Aproximar"></div>
    <button class="btn pri" type="button" id="cam-tirar" style="min-width:240px">Tirar foto</button>
    <button class="btn" type="button" id="cam-fechar" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Cancelar</button>`;
  const parar=()=>{try{camStream?.getTracks().forEach(t=>t.stop());}catch{}camStream=null;};
  $('cam-fechar').onclick=()=>{parar();o.classList.add('oculto');o.innerHTML='';fotoPara=null;};
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    $('cam-v').srcObject=camStream;zoomNaCamera(camStream,'cam-zoom');
  }catch(e){
    parar();o.classList.add('oculto');o.innerHTML='';
    // Sem permissao ou sem camera: cai para escolher/tirar foto pelo sistema
    $('foto-input').value='';$('foto-input').click();return;
  }
  $('cam-tirar').onclick=()=>{
    const v=$('cam-v');if(!v.videoWidth)return;
    const k=Math.min(1,1400/Math.max(v.videoWidth,v.videoHeight));
    const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    parar();
    enviarFoto(c);
  };
}
$('foto-input').addEventListener('change',async e=>{
  const f=e.target.files?.[0];if(!f||!fotoPara)return;
  telaCheia('#100D14','<div class="g">Enviando foto…</div>');
  try{
    const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=URL.createObjectURL(f);});
    const k=Math.min(1,1024/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    await enviarFoto(c,true);
  }catch(err){som(false);erro('Foto não salvou',esc(err.message||'Erro ao ler a foto'));}
});
async function enviarFoto(c,_){
  if(!fotoPara)return;
  telaCheia('#100D14','<div class="g">Enviando foto…</div>');
  try{
    let b64=c.toDataURL('image/jpeg',0.75).split(',')[1];
    if(b64.length>850000)b64=c.toDataURL('image/jpeg',0.55).split(',')[1];
    const r=await chamar('prepMudarEtapa',{shipmentId:fotoPara,etapa:'pronto',fotoBase64:b64},60);
    som(true);
    const m=modDe(r.modalidade);
    telaCheia(m.cor,`<div class="m">PRONTO</div><div class="g">${esc(r.clienteNome||'').toUpperCase()}<br>${m.nome}</div><div class="m">Coloque no cesto ${m.nome}</div><button class="btn" type="button" id="ov-ok">OK</button>`);
    carregar();
  }catch(err){som(false);erro('Foto não salvou',esc(err.message||'Erro ao enviar a foto'));}
  finally{fotoPara=null;}
}

/* ── Camera ────────────────────────────────────────────── */
let leitor=null;
async function abrirCamera(titulo,aoLer,cru){
  if(!window.Html5Qrcode){erro('Câmera indisponível','O leitor da câmera não carregou. Atualize a página.');return;}
  $('scanner-titulo').textContent=titulo;
  $('scanner').classList.remove('oculto');$('scanner-msg').textContent='Abrindo a câmera…';
  $('zoom-bts').classList.add('oculto');$('zoom-bts').innerHTML='';
  try{
    const F=window.Html5QrcodeSupportedFormats;
    // So os formatos que importam: menos formatos = leitura mais rapida
    const formatos=cru?[F.EAN_13,F.EAN_8,F.UPC_A,F.CODE_128]:[F.CODE_128,F.QR_CODE,F.DATA_MATRIX];
    leitor=new Html5Qrcode('leitor',{verbose:false,formatsToSupport:formatos,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    let lido=false;
    await leitor.start({facingMode:'environment'},{
        fps:20,
        // Faixa larga e baixa: o codigo de barras da etiqueta e comprido
        qrbox:(w,h)=>({width:Math.floor(w*0.92),height:Math.floor(Math.min(h*0.45,260))}),
        disableFlip:true,
        videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]}
      },
      async texto=>{
        if(lido)return;
        const id=cru?String(texto).trim():idDaEtiqueta(texto);
        if(!id){$('scanner-msg').textContent='Esse código não é de etiqueta do ML. Tente o outro código da etiqueta.';return;}
        lido=true;await fecharCamera();aoLer(id);
      });
    $('scanner-msg').textContent='Aproxime até o código ocupar a faixa.';
    // Zoom: angulo mais fechado, le de mais longe e mais rapido
    try{
      const cap=leitor.getRunningTrackCapabilities?.()||{};
      if(cap.zoom&&cap.zoom.max>1){
        const max=Math.min(cap.zoom.max,4), niveis=[1,2,3,4].filter(z=>z<=max);
        const aplicar=async z=>{try{await leitor.applyVideoConstraints({advanced:[{zoom:z}]});}catch{}
          $('zoom-bts').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.z)===z));};
        $('zoom-bts').innerHTML=niveis.map(z=>`<button class="btn" type="button" data-z="${z}" style="min-width:64px;min-height:44px">${z}×</button>`).join('');
        $('zoom-bts').querySelectorAll('button').forEach(x=>x.onclick=()=>aplicar(Number(x.dataset.z)));
        $('zoom-bts').classList.remove('oculto');
        aplicar(Math.min(2,max)); // comeca em 2x
      }
    }catch{}
  }catch(e){
    $('scanner-msg').textContent=/Permission|NotAllowed/i.test(String(e))?'Libere o acesso à câmera no navegador e tente de novo.':'Não consegui abrir a câmera: '+e;
  }
}
async function fecharCamera(){
  try{if(leitor){await leitor.stop();leitor.clear();}}catch{}
  leitor=null;$('scanner').classList.add('oculto');
}
$('b-scanner-fechar').onclick=fecharCamera;

/* ── Telas cheias e som ────────────────────────────────── */
function telaCheia(cor,html,fechaSozinho){
  const o=$('overlay');o.style.background=cor;o.innerHTML=html;o.classList.remove('oculto');
  const fechar=()=>{o.classList.add('oculto');o.innerHTML='';};
  const b=$('ov-ok');if(b){b.onclick=fechar;b.focus();}
  if(fechaSozinho)setTimeout(fechar,fechaSozinho);
}
function erro(titulo,msg){telaCheia('#D32137',`<div class="g">${esc(titulo)}</div><div class="m">${msg}</div><button class="btn" type="button" id="ov-ok">Fechar</button>`);}
// Som curto: agudo = certo, grave = errado (ninguem fica olhando a tela o tempo todo)
let ac=null;
function som(ok){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    o.frequency.value=ok?1200:220;g.gain.value=0.15;o.start();o.stop(ac.currentTime+(ok?0.12:0.45));}catch{}
}
</script>
