<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100D14">
<title>Prep Center · Fila do dia</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --page:#F6F7F9;--card:#FFFFFF;--sunken:#F4F5F7;--nav:#100D14;
  --ink:#111111;--body:#2A2733;--muted:#625D6E;--subtle:#6E687B;
  --line:#E2E0E8;--line-soft:#EDECF1;
  --orange:#FF590E;--orange-d:#E04700;
  --ok-bg:#E6F7F0;--ok-fg:#075F41;--ok:#0E9F6E;
  --warn-bg:#FFF6E5;--warn-fg:#8F6000;
  --bad-bg:#FDECEE;--bad-fg:#84131F;--bad:#D32137;
  --neu-bg:#EDECF1;--neu-fg:#5C5769;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--body);font-family:Manrope,'Segoe UI',system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.tab{font-variant-numeric:tabular-nums}
.mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace}
.oculto{display:none!important}

.top{position:sticky;top:0;z-index:30;background:var(--nav);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.top b{font-size:17px;font-weight:800}
.top .agora{margin-left:auto;font-size:12px;color:rgba(255,255,255,.7);text-align:right;line-height:1.3}
.icone{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff}

main{max-width:1240px;margin:0 auto;padding:12px 12px 40px;display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)}

.alerta{padding:12px 14px;border-radius:8px;font-size:14px;font-weight:600;line-height:1.45}
.alerta.bad{background:var(--bad-bg);color:var(--bad-fg)}

/* Bipar: uma barra so. O sistema decide se e conferencia ou despacho. */
.leitura{position:sticky;top:64px;z-index:20;background:#fff;border:2px solid var(--orange);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 16px -10px rgba(17,17,17,.35)}
.leitura input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--body);font-size:15px;font-weight:800}
.btn.pri{background:var(--orange-d);border-color:transparent;color:#fff}
.btn.full{width:100%}
.btn:disabled{background:var(--line-soft);color:#8A8597;border-color:transparent;cursor:not-allowed}
.link{border:0;background:none;color:var(--bad-fg);font-weight:700;font-size:13px;padding:8px 2px;text-decoration:underline}

/* Quadro: logistica x momento do pacote */
.quadro-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.quadro{border-collapse:collapse;width:100%;min-width:640px}
.quadro th,.quadro td{padding:0;border-bottom:1px solid var(--line-soft);text-align:center}
.quadro thead th{background:var(--sunken);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 6px;line-height:1.25}
.quadro tbody th{text-align:left;padding:10px 12px;white-space:nowrap}
.quadro tbody th span{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--ink)}
.quadro tbody th i{width:12px;height:12px;border-radius:50%;display:inline-block}
.quadro td button{width:100%;min-height:48px;border:0;background:transparent;font-size:20px;font-weight:800;color:var(--ink)}
.quadro td button.zero{color:#C9C5D2;font-weight:600;font-size:16px}
.quadro td button.sel,.quadro tbody th button.sel{background:#FFF3EC;box-shadow:inset 0 0 0 2px var(--orange)}
.quadro tbody th button{border:0;background:transparent;padding:0;width:100%;text-align:left;min-height:28px}
.quadro tfoot td{font-size:12px;font-weight:800;color:var(--muted);padding:8px 4px;background:var(--sunken)}
.quadro .col-bad{color:var(--bad-fg)}
.filtro{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.filtro b{color:var(--ink)}

/* Colunas por momento (no celular viram secoes empilhadas) */
.etapas{display:flex;flex-direction:column;gap:16px}
.etapa{display:flex;flex-direction:column;gap:8px}
.etapa-cab{display:flex;align-items:center;gap:8px;padding:0 2px}
.etapa-cab .num{min-width:28px;height:28px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--neu-bg);color:var(--neu-fg)}
.etapa-cab .dica{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}

.ped{background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ped.atrasado{border-color:var(--bad);border-left-color:var(--bad);border-width:2px 2px 2px 6px}
.ped .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#fff}
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800}
.tag.bad{background:var(--bad-bg);color:var(--bad-fg)}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.ped .cli{font-size:15px;font-weight:800;color:var(--ink)}
.ped .prazo{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.ped .prazo.bad{color:var(--bad-fg)}
.item{display:flex;align-items:flex-start;gap:10px}
.item .q{flex:none;min-width:36px;font-size:20px;font-weight:800;color:var(--ink);line-height:1.15}
.item .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.item .t b{font-size:15px;color:var(--ink);line-height:1.3}
.item .t span{font-size:12px;color:var(--subtle)}
.ped .rodape{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ped .id{font-size:11px;color:var(--subtle)}
.vazio{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--subtle);font-size:13px}

@media (min-width:1000px){
  .etapas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
  .etapa{background:var(--line-soft);border-radius:10px;padding:8px;min-height:120px}
  .etapa-cab{flex-wrap:wrap}
  .etapa-cab .dica{margin-left:0;text-align:left;width:100%}
}

.menu{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--line-soft);padding:4px;border-radius:10px}
.menu button{min-height:46px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:800;font-size:15px}
.menu button[aria-current="page"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,17,17,.12)}
.hist-filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hist-filtros select,.hist-filtros input{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:15px;background:#fff;min-width:0}
.hist-filtros input[type=search]{flex:1 1 200px}
.periodos{display:flex;gap:6px;overflow-x:auto}
.periodos button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--body)}
.periodos button[aria-pressed="true"]{background:#2A2733;border-color:#2A2733;color:#fff}
.resumo{display:flex;flex-wrap:wrap;gap:8px}
.resumo span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:800}
.resumo i{width:10px;height:10px;border-radius:50%;display:inline-block}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hrow .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hrow .quando{margin-left:auto;font-size:13px;font-weight:800;color:var(--ink)}
.hrow .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.st{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800}
.st.ok{background:var(--ok-bg);color:var(--ok-fg)}
.st.warn{background:var(--warn-bg);color:var(--warn-fg)}
.st.bad{background:var(--bad-bg);color:var(--bad-fg)}
.st.neu{background:var(--neu-bg);color:var(--neu-fg)}
.secoes{display:flex;flex-direction:column;gap:10px}
.secao{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.secao>button{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:0;background:#fff;text-align:left}
.secao .barra-cor{width:10px;align-self:stretch;min-height:40px;border-radius:4px;flex:none}
.secao .nome{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.secao .nome b{font-size:17px;font-weight:800;color:var(--ink)}
.secao .nome span{font-size:12px;color:var(--muted)}
.secao .cont{font-size:16px;font-weight:800;color:var(--ink);white-space:nowrap}
.secao .seta{font-size:18px;color:var(--muted);width:18px;text-align:center}
.secao .corpo-sec{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.lote{border-radius:10px;background:var(--sunken);overflow:hidden}
.lote.atr{box-shadow:inset 0 0 0 2px var(--bad);background:#FFF7F8}
.lote.grupo{background:#FFF3EC}
.lote-l{display:flex;align-items:center;gap:10px;padding:10px}
.lote-l .qtd{flex:none;min-width:40px;font-size:20px;font-weight:800;color:var(--ink);line-height:1}
.lote-l .info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;border:0;background:none;text-align:left;padding:0}
.lote-l .info b{font-size:14px;font-weight:800;color:var(--ink);line-height:1.3}
.lote-l .info span{font-size:12px;font-weight:700;color:var(--muted)}
.lote-l .acao{flex:none;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:var(--orange-d);color:#fff;font-size:13px;font-weight:800;max-width:150px;line-height:1.2}
.lote-l .acao:disabled{background:var(--line-soft);color:#8A8597}
.det{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:#fff}
.det-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.det-l .mono{color:var(--subtle)}
.det-l button{min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:800}
.dias{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line-soft);padding:4px;border-radius:10px}
.dias button{min-height:42px;border:0;border-radius:8px;background:transparent;font-weight:800;font-size:14px;color:var(--muted)}
.dias button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,17,17,.12)}
@media (min-width:1000px){.secoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.tela-cheia{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#fff}
.tela-cheia .g{font-size:clamp(32px,9vw,60px);font-weight:800;line-height:1.05}
.tela-cheia .m{font-size:clamp(17px,4.5vw,24px);font-weight:700;max-width:640px}
.tela-cheia .btn{margin-top:8px;min-height:56px;font-size:18px;min-width:220px}
.foto-grande{max-width:100%;max-height:70vh;border-radius:8px}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--nav)}
.login form{width:100%;max-width:360px;background:#1A1820;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px;color:#fff}
.login h1{margin:0;font-size:24px}
.login label{font-size:14px;font-weight:700;color:rgba(255,255,255,.85);display:flex;flex-direction:column;gap:6px}
.login input{height:50px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:#100D14;color:#fff;padding:0 12px;font:inherit}
.login .erro{background:rgba(211,33,55,.18);color:#FF8A98;padding:10px 12px;border-radius:8px;font-size:14px}
</style>
</head>
<body>

<div id="tela-login" class="login oculto">
  <form id="form-login">
    <span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7)">RealEcom</span>
    <h1>Prep Center</h1>
    <label>E-mail<input id="l-email" type="email" autocomplete="username" required></label>
    <label>Senha<input id="l-senha" type="password" autocomplete="current-password" required></label>
    <div id="l-erro" class="erro oculto"></div>
    <button class="btn pri" type="submit" id="l-btn">Entrar</button>
  </form>
</div>

<div id="tela-senha" class="login oculto">
  <form id="form-senha">
    <span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7)">Primeiro acesso</span>
    <h1>Crie a sua senha</h1>
    <label>Nova senha<input id="s-1" type="password" autocomplete="new-password" required></label>
    <label>Repita a nova senha<input id="s-2" type="password" autocomplete="new-password" required></label>
    <div id="s-erro" class="erro oculto"></div>
    <button class="btn pri" type="submit" id="s-btn">Salvar e entrar</button>
    <button class="btn" type="button" id="s-sair" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">Sair</button>
  </form>
</div>

<div id="tela-app" class="oculto">
  <header class="top">
    <b>Prep Center</b>
    <span class="agora" id="agora"></span>
    <button class="icone" id="b-atualizar" type="button" aria-label="Buscar vendas novas">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg></button>
    <button class="icone" id="b-sair" type="button" aria-label="Sair">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"></path></svg></button>
  </header>
  <main>
    <nav class="menu" aria-label="Seções">
      <button type="button" id="m-fila" aria-current="page">Fila do dia</button>
      <button type="button" id="m-hist">Histórico</button>
      <button type="button" id="m-equipe" class="oculto">Equipe</button>
    </nav>

    <section id="v-equipe" class="oculto" style="display:flex;flex-direction:column;gap:12px">
      <form id="form-func" style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px" autocomplete="off">
        <h2>Criar login de funcionário</h2>
        <span style="font-size:13px;color:var(--muted)">O funcionário só entra no Prep Center. Não vê o ML Analyzer nem números de venda.</span>
        <div class="hist-filtros">
          <input id="f-nome" placeholder="Nome" aria-label="Nome" style="flex:1 1 160px">
          <input id="f-email" type="email" placeholder="E-mail" aria-label="E-mail" style="flex:1 1 220px">
          <button class="btn pri" type="submit" id="f-btn">Criar login</button>
        </div>
        <div id="f-resultado"></div>
      </form>
      <div class="hist" id="equipe-lista"></div>
    </section>

    <section id="v-hist" class="oculto" style="display:flex;flex-direction:column;gap:12px">
      <div class="periodos" id="periodos" role="group" aria-label="Período"></div>
      <div class="hist-filtros">
        <select id="h-cliente" aria-label="Cliente"><option value="">Todos os clientes</option></select>
        <select id="h-mod" aria-label="Logística"><option value="">Todas as logísticas</option></select>
        <input type="search" id="h-busca" placeholder="Buscar nº do envio, pedido ou produto" aria-label="Buscar">
      </div>
      <div class="resumo" id="h-resumo"></div>
      <div class="hist" id="h-lista"></div>
    </section>

    <div id="v-fila" style="display:flex;flex-direction:column;gap:12px">
    <form class="leitura" id="form-leitura" autocomplete="off">
      <input id="bip" inputmode="numeric" aria-label="Bipar etiqueta" placeholder="Bipar etiqueta (leitor ou nº do envio)">
      <button class="btn pri" type="button" id="b-camera">Câmera</button>
    </form>

    <div id="alertas" style="display:flex;flex-direction:column;gap:8px"></div>

    <div class="dias" role="group" aria-label="Dia">
      <button type="button" id="d-hoje" aria-pressed="true">Hoje</button>
      <button type="button" id="d-amanha" aria-pressed="false">Amanhã</button>
    </div>
    <div class="secoes" id="secoes"></div>
    </div>
  </main>
</div>

<div id="overlay" class="tela-cheia oculto" role="alertdialog" aria-live="assertive"></div>
<div id="scanner" class="tela-cheia oculto" style="background:#100D14;justify-content:flex-start;padding-top:28px">
  <div class="m" id="scanner-titulo">Aponte para o código da etiqueta</div>
  <div id="leitor" style="width:100%;max-width:520px;border-radius:8px;overflow:hidden;background:#000"></div>
  <div class="m" id="scanner-msg" style="font-size:15px;color:rgba(255,255,255,.75)"></div>
  <button class="btn" type="button" id="b-scanner-fechar">Fechar câmera</button>
</div>
<input type="file" id="foto-input" accept="image/*" capture="environment" class="oculto">

<script>
firebase.initializeApp({apiKey:"AIzaSyAv4knEI4IgKH6fRpr_3BuiuijvP2Ul2ms",authDomain:"calculadora-real-ecom.firebaseapp.com",projectId:"calculadora-real-ecom",storageBucket:"calculadora-real-ecom.firebasestorage.app",messagingSenderId:"845239286688",appId:"1:845239286688:web:71018a44cabee0025842c5"});
const auth=firebase.auth();
const fns=firebase.app().functions('southamerica-east1');
const chamar=(fn,args={},seg=70)=>fns.httpsCallable(fn,{timeout:seg*1000})(args).then(r=>r.data);

// Logisticas na ordem de urgencia. Flex sai no dia; a Coleta passa entre 13h e 14h.
const MODS=[
  {id:'flex',    nome:'FLEX',     cor:'#D32137'},
  {id:'coleta',  nome:'COLETA',   cor:'#0E9F6E'},
  {id:'agencia', nome:'AGÊNCIA',  cor:'#C98A00'},
  {id:'correios',nome:'CORREIOS', cor:'#3B5BF5'},
];
const modDe=id=>MODS.find(m=>m.id===id)||{id,nome:'VERIFICAR',cor:'#5C5769'};

// Momento do pacote, na ordem do galpao
const MOMENTOS=[
  {id:'nf',       nome:'Aguardando NF',     dica:'Cliente precisa emitir a nota'},
  {id:'imprimir', nome:'Imprimir etiqueta', dica:'NF ok, etiqueta liberada'},
  {id:'bipar',    nome:'Separar e etiquetar', dica:'Etiqueta impressa: separe, cole e bipe'},
  {id:'foto',     nome:'Foto da caixa',     dica:'Etiqueta conferida: falta a foto'},
  {id:'pronto',   nome:'Pronto para sair',  dica:'Bipe de novo na hora de entregar'},
];
function momentoDe(p){
  if(p.etapa==='problema')return 'problema';
  if(p.etapa==='despachado')return 'despachado';
  if(p.etapa==='pronto')return 'pronto';
  if(p.etapa==='etiquetado')return 'foto';
  if(p.aguardandoNF||!p.etiquetaLiberada)return 'nf';
  if(p.etiquetaImpressaEm)return 'bipar';
  return 'imprimir';
}

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora=d=>d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
const diaMes=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'});

let pedidos=[], filtro={mod:null,mom:null}, timer=null;

/* ── Login ─────────────────────────────────────────────── */
function mostrar(t){$('tela-login').classList.toggle('oculto',t!=='login');$('tela-senha').classList.toggle('oculto',t!=='senha');$('tela-app').classList.toggle('oculto',t!=='app');}
$('form-login').addEventListener('submit',async e=>{
  e.preventDefault();$('l-erro').classList.add('oculto');$('l-btn').disabled=true;
  try{await auth.signInWithEmailAndPassword($('l-email').value.trim(),$('l-senha').value);}
  catch(err){$('l-erro').textContent=err.code==='auth/invalid-credential'?'E-mail ou senha incorretos':(err.message||'Não foi possível entrar');$('l-erro').classList.remove('oculto');}
  finally{$('l-btn').disabled=false;}
});
$('b-sair').onclick=()=>auth.signOut();
let souAdmin=false;
auth.onAuthStateChanged(async u=>{
  clearInterval(timer);
  if(!u){mostrar('login');return;}
  // Primeiro acesso com senha provisoria: pede a senha nova antes de tudo
  let perfil={};
  try{perfil=await chamar('mlMeuPerfil');}catch{}
  souAdmin=Boolean(perfil.admin);
  $('m-equipe').classList.toggle('oculto',!souAdmin);
  if(perfil.trocarSenha){mostrar('senha');return;}
  mostrar('app');carregar();
  timer=setInterval(carregar,60000);
});
$('form-senha').addEventListener('submit',async e=>{
  e.preventDefault();
  const a=$('s-1').value,b=$('s-2').value;$('s-erro').classList.add('oculto');
  const falha=t=>{$('s-erro').textContent=t;$('s-erro').classList.remove('oculto');};
  if(a.length<8)return falha('A senha precisa ter pelo menos 8 caracteres');
  if(a!==b)return falha('As duas senhas não são iguais');
  $('s-btn').disabled=true;
  try{
    await auth.currentUser.updatePassword(a);
    await chamar('mlSenhaTrocada');
    mostrar('app');carregar();timer=setInterval(carregar,60000);
  }catch(err){falha(err.code==='auth/requires-recent-login'?'Saia e entre de novo com a senha provisória para trocar.':(err.message||'Não foi possível trocar a senha'));}
  finally{$('s-btn').disabled=false;}
});
$('s-sair').onclick=()=>auth.signOut();

/* ── Dados ─────────────────────────────────────────────── */
async function carregar(){
  try{
    const r=await chamar('prepFila');
    pedidos=(r.pedidos||[]).filter(p=>p.etapa!=='cancelado').map(p=>({...p,momento:momentoDe(p)}));
    desenhar();
  }catch(e){
    $('secoes').innerHTML='';
    $('alertas').innerHTML=`<div class="alerta bad">${e.code==='functions/permission-denied'?'Este login não tem acesso ao prep. Fale com o Filipe.':'Não consegui carregar a fila: '+esc(e.message)}</div>`;
  }
}
$('b-atualizar').onclick=async()=>{
  $('b-atualizar').disabled=true;$('agora').textContent='Buscando vendas…';
  try{await chamar('prepVarrerAgora',{},300);}catch(e){console.warn(e);}
  $('b-atualizar').disabled=false;carregar();
};

/* ── Tela ──────────────────────────────────────────────── */
const prazoDe=p=>p.limiteDespacho?new Date(p.limiteDespacho):null;
function urgencia(a,b){
  return (b.atrasado-a.atrasado)
    || (Boolean(a.paraAmanha)-Boolean(b.paraAmanha))
    || (MODS.findIndex(m=>m.id===a.modalidade)-MODS.findIndex(m=>m.id===b.modalidade))
    || ((prazoDe(a)||0)-(prazoDe(b)||0));
}

let dia='hoje';
const abertas={}; // secoes abertas/fechadas pelo usuario
$('d-hoje').onclick=()=>{dia='hoje';desenhar();};
$('d-amanha').onclick=()=>{dia='amanha';desenhar();};

// Ordem de trabalho dentro da secao
const ORDEM_MOM=['problema','imprimir','bipar','foto','pronto','nf'];
const ROTULO={problema:'Problema',imprimir:'Imprimir etiqueta',bipar:'Etiqueta impressa · bipar',foto:'Etiqueta conferida · foto',pronto:'Pronto · despachar',nf:'Aguardando NF do cliente'};

function chaveItens(p){return (p.itens||[]).map(i=>`${i.qtd}x${i.itemId||i.titulo}:${i.variacao||''}`).sort().join('|');}

function desenhar(){
  const agora=new Date();
  $('agora').innerHTML=`${agora.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'})}<br>atualizado ${hora(agora)}`;

  const naMesa=pedidos.filter(p=>p.momento!=='despachado');
  const despHoje=pedidos.filter(p=>p.momento==='despachado');
  const deHoje=naMesa.filter(p=>!p.paraAmanha), deAmanha=naMesa.filter(p=>p.paraAmanha);
  $('d-hoje').textContent=`Hoje · ${deHoje.length}`;
  $('d-amanha').textContent=deAmanha.length?`Amanhã · ${deAmanha.length}`:'Amanhã (a partir das 15h)';
  $('d-hoje').setAttribute('aria-pressed',dia==='hoje');$('d-amanha').setAttribute('aria-pressed',dia==='amanha');
  const base=dia==='hoje'?deHoje:deAmanha;

  // Alertas (so do dia de hoje)
  const al=[];
  if(dia==='hoje'){
    const atrasados=deHoje.filter(p=>p.atrasado);
    if(atrasados.length)al.push(`<div class="alerta bad"><b>${atrasados.length} atrasado(s)</b> · o prazo do Mercado Livre já passou. Fazer primeiro.</div>`);
    const h=Number(agora.toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:'America/Sao_Paulo'}));
    const coleta=deHoje.filter(p=>p.modalidade==='coleta'&&p.momento!=='pronto').length;
    if(coleta&&h<14)al.push(`<div class="alerta bad"><b>COLETA passa entre 13h e 14h</b> · ${coleta} pacote(s) ainda não estão prontos.</div>`);
  }
  $('alertas').innerHTML=al.join('');

  const mods=MODS.slice();
  if(base.some(p=>!MODS.some(m=>m.id===p.modalidade)))mods.push(modDe('verificar'));
  const secoes=mods.map(m=>{
    const ps=base.filter(p=>m.id==='verificar'?!MODS.some(x=>x.id===p.modalidade):p.modalidade===m.id);
    const desp=dia==='hoje'?despHoje.filter(p=>p.modalidade===m.id).length:0;
    if(!ps.length&&!desp)return '';
    const prontos=ps.filter(p=>p.momento==='pronto').length+desp, total=ps.length+desp;
    const pendente=ps.some(p=>p.momento!=='pronto');
    const aberta=abertas[m.id]??pendente;
    const dica={flex:'Sai no dia',coleta:'Passa entre 13h e 14h',agencia:'Horário de cada conta',correios:'Horário de cada conta'}[m.id]||'Envio fora do padrão';
    const atr=ps.filter(p=>p.atrasado).length;
    return `<section class="secao">
      <button type="button" data-sec="${m.id}" aria-expanded="${aberta}">
        <span class="barra-cor" style="background:${m.cor}"></span>
        <span class="nome"><b>${m.nome}</b><span>${dica}${atr?` · <span style="color:var(--bad-fg)">${atr} atrasado(s)</span>`:''}${!pendente&&ps.length?' · tudo pronto':''}</span></span>
        <span class="cont tab" style="${prontos===total?'color:var(--ok-fg)':''}">${prontos}/${total}${prontos===total?' ✓':''}</span>
        <span class="seta" aria-hidden="true">${aberta?'▾':'▸'}</span>
      </button>
      ${aberta?`<div class="corpo-sec">${lotesDe(ps).map(loteHtml).join('')||'<div class="vazio">Tudo despachado</div>'}</div>`:''}
    </section>`;
  }).join('');
  $('secoes').innerHTML=secoes||`<div class="vazio"><b>${dia==='hoje'?'Nada para sair hoje':'Nada para amanhã ainda'}</b>${dia==='hoje'?'Quando entrar venda de um cliente do prep, ela aparece aqui sozinha.':'As vendas de amanhã aparecem aqui a partir das 15h.'}</div>`;
  $('secoes').querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{const id=b.dataset.sec;abertas[id]=b.getAttribute('aria-expanded')!=='true';desenhar();});
  $('secoes').querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>{detAberto[b.dataset.det]=!detAberto[b.dataset.det];desenhar();});
  $('secoes').querySelectorAll('[data-acao]').forEach(b=>b.onclick=()=>acao(b.dataset.acao,b.dataset.id,b));
}

// Lote = mesmo cliente + mesmos itens + mesmo momento (dentro da mesma logistica)
function lotesDe(ps){
  const g={};
  ps.forEach(p=>{const k=[p.contaId,chaveItens(p),p.momento,p.momento==='problema'?p.shipmentId:''].join('#');(g[k]=g[k]||[]).push(p);});
  return Object.entries(g).map(([k,lista])=>({k,ps:lista.sort(urgencia),momento:lista[0].momento,atr:lista.some(p=>p.atrasado)}))
    .sort((a,b)=>(b.atr-a.atr)||(ORDEM_MOM.indexOf(a.momento)-ORDEM_MOM.indexOf(b.momento)));
}
const detAberto={};
function loteHtml(L){
  const p=L.ps[0], n=L.ps.length, ids=L.ps.map(x=>x.shipmentId).join(',');
  const titulo=(p.itens||[]).map(i=>`${i.qtd>1?i.qtd+'× ':''}${esc(i.titulo)}`).join(' + ');
  const pr=prazoDe(p);
  let bt='';
  switch(L.momento){
    case 'imprimir':bt=n>1?`<button class="acao" type="button" data-acao="lote" data-id="${ids}">Imprimir ${n} + folha</button>`:`<button class="acao" type="button" data-acao="etiqueta" data-id="${ids}">Imprimir</button>`;break;
    case 'bipar':   bt=`<button class="acao" type="button" data-acao="bipar-lote" data-id="${ids}">Bipar${n>1?` (${n})`:''}</button>`;break;
    case 'foto':    bt=`<button class="acao" type="button" data-acao="foto" data-id="${esc(p.shipmentId)}">Foto${n>1?` (1 de ${n})`:''}</button>`;break;
    case 'pronto':  bt=`<button class="acao" type="button" data-acao="despachar" data-id="${ids}">Despachar</button>`;break;
    case 'nf':      bt=`<button class="acao" type="button" disabled>Sem NF</button>`;break;
    case 'problema':bt=`<button class="acao" type="button" data-acao="reabrir" data-id="${esc(p.shipmentId)}" style="background:#fff;color:var(--body);border:1px solid var(--line)">Resolvido</button>`;break;
  }
  const sub=[ROTULO[L.momento]];
  if(n>1)sub.push(`lote de ${n}`);
  if(L.momento==='problema'&&p.problema)sub.push(esc(p.problema));
  const aberto=detAberto[L.k];
  return `<div class="lote${L.atr?' atr':''}${n>1?' grupo':''}">
    <div class="lote-l">
      <span class="qtd tab" style="text-align:center">${n}<small style="display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:2px">${n>1?'pacotes':'pacote'}</small></span>
      <button class="info" type="button" data-det="${esc(L.k)}" aria-expanded="${!!aberto}">
        <b>${esc(p.clienteNome||p.contaId)} · ${titulo}</b>
        <span>${sub.join(' · ')}${L.atr?' · <span style="color:var(--bad-fg)">ATRASADO</span>':pr?` · até ${hora(pr)}`:''} ${aberto?'▴':'▾'}</span>
      </button>
      ${bt}
    </div>
    ${aberto?`<div class="det">${L.ps.map(x=>{const id=esc(x.shipmentId);return `<div class="det-l"><span class="mono">envio ${id}</span>
      ${x.momento==='bipar'?`<button type="button" data-acao="etiqueta" data-id="${id}">Reimprimir</button>`:''}
      ${x.momento==='pronto'?`<button type="button" data-acao="verfoto" data-id="${id}">Ver foto</button>`:''}
      ${x.momento==='foto'?`<button type="button" data-acao="foto" data-id="${id}">Foto</button>`:''}
      ${x.momento!=='problema'?`<button type="button" data-acao="problema" data-id="${id}" style="color:var(--bad-fg)">Problema</button>`:''}
      </div>`;}).join('')}
      ${n>1&&L.momento!=='imprimir'?`<button type="button" class="btn" data-acao="folha" data-id="${ids}" style="min-height:40px">Folha de controle</button>`:''}
    </div>`:''}
  </div>`;
}

// Folha de controle do lote: o que separar e a lista dos envios para marcar
function folhaControle(ids){
  const ps=ids.map(id=>pedidos.find(p=>String(p.shipmentId)===String(id))).filter(Boolean);
  if(!ps.length)return;
  const m=modDe(ps[0].modalidade);
  const soma={};
  ps.forEach(p=>(p.itens||[]).forEach(i=>{const k=(i.titulo||'')+'|'+(i.atributos||'');soma[k]=soma[k]||{t:i.titulo,a:i.atributos,sku:i.sku,q:0};soma[k].q+=Number(i.qtd)||1;}));
  const w=window.open('','_blank');if(!w){erro('Bloqueado','Libere as janelas (pop-ups) para imprimir a folha.');return;}
  const agora=new Date();
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Folha de controle</title>
  <style>body{font-family:Arial,sans-serif;margin:24px;color:#111}h1{margin:0 0 4px;font-size:22px}.f{display:inline-block;padding:4px 10px;border-radius:6px;color:#fff;font-weight:700;background:${m.cor};-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #999;padding:8px;text-align:left;font-size:14px}th{background:#eee}.box{width:22px;height:22px;border:2px solid #111;display:inline-block}.sep{font-size:18px}</style></head><body>
  <h1>${esc(ps[0].clienteNome||ps[0].contaId)} · <span class="f">${m.nome}</span></h1>
  <div>Folha de controle · ${agora.toLocaleDateString('pt-BR')} ${hora(agora)} · ${ps.length} pacote(s)</div>
  <h2 style="font-size:16px;margin:18px 0 0">Separar</h2>
  <table><tr><th>Qtd</th><th>Produto</th><th>SKU</th><th>OK</th></tr>${Object.values(soma).map(x=>`<tr class="sep"><td><b>${x.q}</b></td><td>${esc(x.t)}${x.a?' · '+esc(x.a):''}</td><td>${esc(x.sku||'—')}</td><td><span class="box"></span></td></tr>`).join('')}</table>
  <h2 style="font-size:16px;margin:18px 0 0">Pacotes</h2>
  <table><tr><th>#</th><th>Envio</th><th>Itens</th><th>Etiqueta colada</th><th>Foto</th></tr>${ps.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.shipmentId)}</td><td>${(p.itens||[]).map(x=>esc(x.qtd)+'× '+esc(x.titulo)).join('<br>')}</td><td><span class="box"></span></td><td><span class="box"></span></td></tr>`).join('')}</table>
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

/* ── Historico de envios ───────────────────────────────── */
const PERIODOS=[['hoje','Hoje',0,0],['ontem','Ontem',1,1],['7d','7 dias',6,0],['30d','30 dias',29,0]];
let hist={periodo:'hoje',envios:[],carregando:false};
const diaISO=off=>{const d=new Date(Date.now()-off*864e5);return d.toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});};

$('m-fila').onclick=()=>trocarVista('fila');
$('m-hist').onclick=()=>trocarVista('hist');
$('m-equipe').onclick=()=>trocarVista('equipe');
function trocarVista(v){
  [['fila','v-fila','m-fila'],['hist','v-hist','m-hist'],['equipe','v-equipe','m-equipe']].forEach(([id,vis,men])=>{
    $(vis).classList.toggle('oculto',v!==id);
    if(v===id)$(men).setAttribute('aria-current','page');else $(men).removeAttribute('aria-current');
  });
  if(v==='hist')carregarHistorico();
  if(v==='equipe')carregarEquipe();
}

/* ── Equipe do galpao (so admin) ───────────────────────── */
const LINK_PREP='https://ollmestorerj.github.io/ml-analyzer/prep.html';
const msgFunc=c=>`Oi${c.nome?' '+c.nome.split(' ')[0]:''}! Seu acesso ao Prep Center da RealEcom está pronto.\n\nLink: ${LINK_PREP}\nE-mail: ${c.email}\nSenha provisória: ${c.senha}\n\nNo primeiro acesso você cria a sua senha. Dica: salve o link na tela inicial do celular.`;
async function carregarEquipe(){
  $('equipe-lista').innerHTML='<div class="vazio">Carregando…</div>';
  try{
    const lista=await chamar('adminListarEquipe');
    if(!lista.length){$('equipe-lista').innerHTML='<div class="vazio">Nenhum funcionário ainda. Crie o primeiro login acima.</div>';return;}
    $('equipe-lista').innerHTML=lista.map(f=>`<article class="hrow" style="border-left-color:${f.ativo?'var(--ok)':'var(--line)'}">
      <div class="l1"><b style="font-size:15px;color:var(--ink)">${esc(f.nome)}</b>${f.ativo?'':'<span class="st bad">Bloqueado</span>'}${f.trocarSenha?'<span class="st warn">Ainda não criou a senha</span>':''}</div>
      <div class="meta"><span>${esc(f.email)}</span></div>
      <div class="l1">
        <button class="btn" type="button" style="min-height:40px" data-f="senha" data-uid="${esc(f.uid)}" data-nome="${esc(f.nome)}" data-email="${esc(f.email)}">Nova senha provisória</button>
        <button class="btn" type="button" style="min-height:40px" data-f="${f.ativo?'bloquear':'liberar'}" data-email="${esc(f.email)}">${f.ativo?'Bloquear':'Liberar'}</button>
      </div></article>`).join('');
    $('equipe-lista').querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{
      b.disabled=true;
      try{
        if(b.dataset.f==='senha'){
          if(!confirm(`Gerar nova senha provisória para ${b.dataset.email}?`)){b.disabled=false;return;}
          const r=await chamar('adminNovaSenha',{uid:b.dataset.uid});
          mostrarCredencial({nome:b.dataset.nome,email:r.email,senha:r.senha});
        }else{await chamar('adminEquipeAtivo',{email:b.dataset.email,ativo:b.dataset.f==='liberar'});}
        carregarEquipe();
      }catch(e){b.disabled=false;erro('Não deu certo',esc(e.message));}
    });
  }catch(e){$('equipe-lista').innerHTML=`<div class="alerta bad">${esc(e.message)}</div>`;}
}
function mostrarCredencial(c){
  const txt=msgFunc(c);
  $('f-resultado').innerHTML=`<div class="alerta" style="background:var(--ok-bg);color:var(--ok-fg)">Login pronto. Copie a mensagem e mande para o funcionário. A senha não aparece de novo.</div>
    <pre style="margin:0;white-space:pre-wrap;font-family:inherit;font-size:14px;background:var(--sunken);padding:12px;border-radius:8px">${esc(txt)}</pre>
    <button class="btn pri" type="button" id="f-copiar">Copiar mensagem</button>`;
  $('f-copiar').onclick=()=>{navigator.clipboard?.writeText(txt);$('f-copiar').textContent='Copiado';};
  $('f-resultado').scrollIntoView({behavior:'smooth',block:'center'});
}
$('form-func').addEventListener('submit',async e=>{
  e.preventDefault();
  const nome=$('f-nome').value.trim(),email=$('f-email').value.trim();
  if(!email){erro('Falta o e-mail','Informe o e-mail do funcionário.');return;}
  $('f-btn').disabled=true;$('f-resultado').innerHTML='';
  try{
    const r=await chamar('adminCriarFuncionario',{nome,email});
    if(r.jaTinhaLogin)$('f-resultado').innerHTML=`<div class="alerta" style="background:var(--ok-bg);color:var(--ok-fg)">${esc(email)} já tinha login e agora tem acesso ao Prep. Ele entra com a senha que já usa.</div>`;
    else mostrarCredencial({nome,email:r.email,senha:r.senha});
    $('f-nome').value='';$('f-email').value='';
    carregarEquipe();
  }catch(err){erro('Não criou',esc(err.message));}
  finally{$('f-btn').disabled=false;}
});
$('periodos').innerHTML=PERIODOS.map(([id,nome])=>`<button type="button" data-p="${id}">${nome}</button>`).join('');
$('periodos').querySelectorAll('button').forEach(b=>b.onclick=()=>{hist.periodo=b.dataset.p;carregarHistorico();});
['h-cliente','h-mod'].forEach(i=>$(i).onchange=desenharHistorico);
$('h-busca').oninput=desenharHistorico;

async function carregarHistorico(){
  const [,,de,ate]=PERIODOS.find(x=>x[0]===hist.periodo);
  $('periodos').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===hist.periodo));
  $('h-lista').innerHTML='<div class="vazio">Carregando…</div>';
  try{
    const r=await chamar('prepHistorico',{de:diaISO(de),ate:diaISO(ate)});
    hist.envios=r.envios||[];
    // Opcoes de filtro a partir do que veio
    const clis=[...new Set(hist.envios.map(e=>e.clienteNome||e.contaId))].sort();
    const selC=$('h-cliente').value;
    $('h-cliente').innerHTML='<option value="">Todos os clientes</option>'+clis.map(c=>`<option ${c===selC?'selected':''}>${esc(c)}</option>`).join('');
    const selM=$('h-mod').value;
    $('h-mod').innerHTML='<option value="">Todas as logísticas</option>'+MODS.map(m=>`<option value="${m.id}" ${m.id===selM?'selected':''}>${m.nome}</option>`).join('');
    desenharHistorico();
  }catch(e){$('h-lista').innerHTML=`<div class="alerta bad">Não consegui carregar o histórico: ${esc(e.message)}</div>`;}
}

function situacao(e){
  if(e.statusML==='delivered')return ['ok','Entregue'];
  if(e.statusML==='not_delivered')return ['bad','Não entregue'];
  if(e.statusML==='cancelled'||e.etapa==='cancelado')return ['bad','Cancelado'];
  if(e.etapa==='enviado'||e.statusML==='shipped')return ['ok','Em trânsito'];
  const horas=(Date.now()-new Date(e.despachadoEm))/36e5;
  return horas>24?['warn','Sem confirmação do ML há '+Math.floor(horas)+'h']:['neu','Despachado · aguardando o ML'];
}

function desenharHistorico(){
  const c=$('h-cliente').value,m=$('h-mod').value,q=$('h-busca').value.trim().toLowerCase();
  const lista=hist.envios.filter(e=>(!c||(e.clienteNome||e.contaId)===c)&&(!m||e.modalidade===m)&&
    (!q||[e.shipmentId,...(e.pedidos||[]),...(e.itens||[]).map(i=>i.titulo+' '+(i.sku||''))].join(' ').toLowerCase().includes(q)));
  $('h-resumo').innerHTML=`<span class="tab">${lista.length} envio(s)</span>`+
    MODS.map(x=>{const n=lista.filter(e=>e.modalidade===x.id).length;return n?`<span class="tab"><i style="background:${x.cor}"></i>${x.nome} ${n}</span>`:'';}).join('');
  if(!lista.length){$('h-lista').innerHTML='<div class="vazio">Nenhum envio nesse período.</div>';return;}
  $('h-lista').innerHTML=lista.map(e=>{
    const md=modDe(e.modalidade),[cls,txt]=situacao(e),d=new Date(e.despachadoEm),id=esc(e.shipmentId);
    return `<article class="hrow" style="border-left-color:${md.cor}">
      <div class="l1"><span class="pill" style="background:${md.cor}">${md.nome}</span><b style="font-size:15px;color:var(--ink)">${esc(e.clienteNome||e.contaId)}</b>
        <span class="quando tab">${diaMes(d)} ${hora(d)}</span></div>
      ${(e.itens||[]).map(i=>`<div class="item"><span class="q tab" style="font-size:17px;min-width:30px">${esc(i.qtd)}×</span><div class="t"><b style="font-size:14px">${esc(i.titulo)}</b></div></div>`).join('')}
      <div class="l1"><span class="st ${cls}">${txt}</span>${e.atrasado?'<span class="st bad">Saiu atrasado</span>':''}${e.temFoto?'':'<span class="st warn">Sem foto</span>'}</div>
      <div class="meta"><span class="mono">envio ${id}</span>${e.despachadoPor?`<span>por ${esc(String(e.despachadoPor).split('@')[0])}</span>`:''}</div>
      ${e.temFoto?`<button class="btn" type="button" data-acao="verfoto" data-id="${id}" style="min-height:40px;align-self:flex-start">Ver foto</button>`:''}
    </article>`;}).join('');
  $('h-lista').querySelectorAll('[data-acao]').forEach(b=>b.onclick=()=>acao(b.dataset.acao,b.dataset.id,b));
}

/* ── Acoes ─────────────────────────────────────────────── */
let fotoPara=null;
async function acao(tipo,id,btn){
  try{
    if(tipo==='etiqueta'){
      const janela=window.open('','_blank'); // abre antes, senao o navegador bloqueia
      btn.disabled=true;
      const r=await chamar('prepEtiqueta',{shipmentId:id},60);
      const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      if(janela)janela.location=url;else location.href=url;
      btn.disabled=false;carregar();return;
    }
    if(tipo==='lote'){
      const lista=id.split(',');
      const janela=window.open('','_blank');
      btn.disabled=true;btn.textContent='Gerando…';
      const r=await chamar('prepEtiquetasLote',{shipmentIds:lista},120);
      const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      if(janela)janela.location=url;else location.href=url;
      folhaControle(lista);
      carregar();return;
    }
    if(tipo==='folha'){folhaControle(id.split(','));return;}
    if(tipo==='bipar-lote'){const lista=id.split(',');abrirCamera(lista.length>1?`Bipe uma das ${lista.length} etiquetas deste lote`:'Bipe a etiqueta colada nesta caixa',lido=>{
      if(!lista.includes(lido)){som(false);erro('Etiqueta de outro pedido',`O envio ${esc(lido)} não é deste lote. Confira se colou a etiqueta certa.`);return;}
      registrar(lido);});return;}
    if(tipo==='bipar'){abrirCamera('Bipe a etiqueta colada nesta caixa',lido=>{
      if(lido!==String(id)){som(false);erro('Etiqueta de outro pedido',`Você bipou o envio ${esc(lido)}, mas esta caixa é do envio ${esc(id)}. Confira se colou a etiqueta certa.`);return;}
      registrar(lido);});return;}
    if(tipo==='despachar'){abrirCamera('Bipe a etiqueta do pacote para despachar',lido=>registrar(lido));return;}
    if(tipo==='foto'){pedirFoto(id);return;}
    if(tipo==='verfoto'){
      btn.disabled=true;const r=await chamar('prepFoto',{shipmentId:id});btn.disabled=false;
      if(!r.base64){erro('Sem foto','Esse pedido não tem foto.');return;}
      telaCheia('#100D14',`<img class="foto-grande" alt="Foto da caixa do envio ${esc(id)}" src="data:image/jpeg;base64,${r.base64}"><button class="btn" type="button" id="ov-ok">Fechar</button>`);
      return;
    }
    if(tipo==='problema'){
      const motivo=prompt('Qual o problema? (ex.: produto faltando, avariado, etiqueta ilegível)');
      if(!motivo)return;
      await chamar('prepMudarEtapa',{shipmentId:id,etapa:'problema',motivo});carregar();return;
    }
    if(tipo==='reabrir'){await chamar('prepMudarEtapa',{shipmentId:id,etapa:'aberto'});carregar();return;}
  }catch(e){btn.disabled=false;som(false);erro('Não deu certo',esc(e.message));}
}

// Uma leitura de etiqueta. O sistema sabe o momento do pacote:
// etiqueta recem-impressa -> confere; pacote pronto -> despacha.
async function registrar(id){
  const p=pedidos.find(x=>String(x.shipmentId)===String(id));
  let etapa;
  if(!p){som(false);erro('Pacote não está na fila',`O envio ${esc(id)} não é de um cliente do prep, ou já saiu da fila.`);return;}
  if(p.momento==='pronto')etapa='despachado';
  else if(p.momento==='bipar')etapa='etiquetado';
  else{
    const msg={nf:'A NF ainda não foi emitida.',imprimir:'Imprima a etiqueta primeiro.',foto:'Etiqueta já conferida. Falta a foto da caixa.',despachado:'Esse pacote JÁ foi despachado.',problema:'Esse pacote está com problema reportado.'}[p.momento];
    som(false);erro('Nada a fazer com essa etiqueta',msg||'');return;
  }
  try{
    const r=await chamar('prepMudarEtapa',{shipmentId:id,etapa});
    if(r.cancelado){
      som(false);
      telaCheia('#D32137',`<div class="g">CANCELADO</div><div class="g" style="font-size:30px">NÃO ENVIAR</div><div class="m">${esc(r.pedido?.clienteNome||'')} · tire o produto da caixa e devolva ao estoque</div><button class="btn" type="button" id="ov-ok">Devolvi ao estoque</button>`);
      return;
    }
    som(true);
    const m=modDe(r.modalidade);
    if(etapa==='etiquetado'){
      telaCheia(m.cor,`<div class="m">ETIQUETA CONFERIDA</div><div class="g">${esc(r.clienteNome||'').toUpperCase()}<br>${m.nome}</div><div class="m">Agora a foto da caixa aberta, com produto e etiqueta</div><button class="btn" type="button" id="ov-foto">Tirar foto</button><button class="btn" type="button" id="ov-ok" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">Depois</button>`);
      const b=$('ov-foto');if(b)b.onclick=()=>{$('overlay').classList.add('oculto');pedirFoto(id);};
    }else{
      telaCheia(m.cor,`<div class="m">DESPACHADO</div><div class="g">${esc(r.clienteNome||'').toUpperCase()}<br>${m.nome}</div><button class="btn" type="button" id="ov-ok">OK</button>`,1500);
    }
    carregar();
  }catch(e){som(false);erro(etapa==='despachado'?'Não despachou':'Não registrou',`${esc(e.message||'Erro')}<br><span class="mono" style="font-size:14px">envio ${esc(id)}</span>`);}
}

// Leitor fisico: "digita" o codigo e aperta Enter na barra
$('form-leitura').addEventListener('submit',e=>{
  e.preventDefault();
  const id=idDaEtiqueta($('bip').value);$('bip').value='';
  if(!id){som(false);erro('Código não reconhecido','Bipe o código de barras ou o QR da etiqueta do Mercado Livre.');return;}
  registrar(id);
});
$('b-camera').onclick=()=>abrirCamera('Bipe a etiqueta',lido=>registrar(lido));

// Aceita o numero do envio puro ou o QR da etiqueta (que traz {"id":"..."})
function idDaEtiqueta(t){
  t=String(t||'').trim();
  try{const j=JSON.parse(t);if(j&&j.id)return String(j.id);}catch{}
  const m=t.match(/\d{10,}/g);return m?m.sort((a,b)=>b.length-a.length)[0]:'';
}

/* ── Foto (reduzida no celular antes de enviar) ────────── */
function pedirFoto(id){fotoPara=id;$('foto-input').value='';$('foto-input').click();}
$('foto-input').addEventListener('change',async e=>{
  const f=e.target.files?.[0];if(!f||!fotoPara)return;
  telaCheia('#100D14','<div class="g">Enviando foto…</div>');
  try{
    const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=URL.createObjectURL(f);});
    const k=Math.min(1,1024/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let b64=c.toDataURL('image/jpeg',0.7).split(',')[1];
    if(b64.length>850000)b64=c.toDataURL('image/jpeg',0.5).split(',')[1];
    const r=await chamar('prepMudarEtapa',{shipmentId:fotoPara,etapa:'pronto',fotoBase64:b64},60);
    som(true);
    const m=modDe(r.modalidade);
    telaCheia(m.cor,`<div class="m">PRONTO</div><div class="g">${esc(r.clienteNome||'').toUpperCase()}<br>${m.nome}</div><div class="m">Coloque no cesto ${m.nome}</div><button class="btn" type="button" id="ov-ok">OK</button>`);
    carregar();
  }catch(err){som(false);erro('Foto não salvou',esc(err.message||'Erro ao enviar a foto'));}
  finally{fotoPara=null;}
});

/* ── Camera ────────────────────────────────────────────── */
let leitor=null;
async function abrirCamera(titulo,aoLer){
  if(!window.Html5Qrcode){erro('Câmera indisponível','O leitor da câmera não carregou. Atualize a página.');return;}
  $('scanner-titulo').textContent=titulo;
  $('scanner').classList.remove('oculto');$('scanner-msg').textContent='Abrindo a câmera…';
  try{
    const F=window.Html5QrcodeSupportedFormats;
    leitor=new Html5Qrcode('leitor',{verbose:false,formatsToSupport:[F.QR_CODE,F.CODE_128,F.CODE_39,F.EAN_13,F.ITF],experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    let lido=false;
    await leitor.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.min(w*0.9,420),height:Math.min(h*0.5,220)})},
      async texto=>{
        if(lido)return;
        const id=idDaEtiqueta(texto);
        if(!id){$('scanner-msg').textContent='Esse código não é de etiqueta do ML. Tente o outro código da etiqueta.';return;}
        lido=true;await fecharCamera();aoLer(id);
      });
    $('scanner-msg').textContent='';
  }catch(e){
    $('scanner-msg').textContent=/Permission|NotAllowed/i.test(String(e))?'Libere o acesso à câmera no navegador e tente de novo.':'Não consegui abrir a câmera: '+e;
  }
}
async function fecharCamera(){
  try{if(leitor){await leitor.stop();leitor.clear();}}catch{}
  leitor=null;$('scanner').classList.add('oculto');
}
$('b-scanner-fechar').onclick=fecharCamera;

/* ── Telas cheias e som ────────────────────────────────── */
function telaCheia(cor,html,fechaSozinho){
  const o=$('overlay');o.style.background=cor;o.innerHTML=html;o.classList.remove('oculto');
  const fechar=()=>{o.classList.add('oculto');o.innerHTML='';};
  const b=$('ov-ok');if(b){b.onclick=fechar;b.focus();}
  if(fechaSozinho)setTimeout(fechar,fechaSozinho);
}
function erro(titulo,msg){telaCheia('#D32137',`<div class="g">${esc(titulo)}</div><div class="m">${msg}</div><button class="btn" type="button" id="ov-ok">Fechar</button>`);}
// Som curto: agudo = certo, grave = errado (ninguem fica olhando a tela o tempo todo)
let ac=null;
function som(ok){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    o.frequency.value=ok?1200:220;g.gain.value=0.15;o.start();o.stop(ac.currentTime+(ok?0.12:0.45));}catch{}
}
</script>
