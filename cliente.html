<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100D14">
<title>PREP REAL</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<style>
:root{
  --page:#F6F7F9;--card:#FFFFFF;--sunken:#F4F5F7;--nav:#100D14;
  --ink:#111111;--body:#2A2733;--muted:#625D6E;--subtle:#6E687B;
  --line:#E2E0E8;--line-soft:#EDECF1;
  --orange:#FF590E;--orange-d:#E04700;
  --ok-bg:#E6F7F0;--ok-fg:#075F41;--ok:#0E9F6E;
  --warn-bg:#FFF6E5;--warn-fg:#8F6000;
  --bad-bg:#FDECEE;--bad-fg:#84131F;--bad:#D32137;
  --neu-bg:#EDECF1;--neu-fg:#5C5769;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--body);font-family:Manrope,'Segoe UI',system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.tab{font-variant-numeric:tabular-nums}
.mono{font-family:'JetBrains Mono',Menlo,Consolas,monospace}
.oculto{display:none!important}
h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)}

.top{position:sticky;top:0;z-index:30;background:var(--nav);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.top .marca{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.top .marca small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.top .marca b{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icone{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;flex:none}
.teste{background:#FFF3EC;border-bottom:2px solid var(--orange);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:#B53900}
.teste select{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font:inherit;font-size:14px;background:#fff;flex:1 1 200px;min-width:0}

main{max-width:960px;margin:0 auto;padding:12px 12px 48px;display:flex;flex-direction:column;gap:12px}
/* Navegacao: barra lateral no computador, barra fixa embaixo no celular */
.lateral{background:var(--nav);color:#fff}
.menu{display:flex}
.menu button{border:0;background:transparent;color:rgba(255,255,255,.66);font-weight:700;display:flex;align-items:center}
.menu button svg{flex:none}
.menu button:hover{color:#fff}
.menu .ct{display:none}
.marca-lat{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--orange);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.marca-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.marca-txt b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca-txt small{font-size:12px;color:rgba(255,255,255,.55);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--nav) 232px,var(--page) 232px)}
  .lateral{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 10px}
  .menu{flex-direction:column;gap:2px}
  .menu button{gap:12px;min-height:44px;padding:0 12px;border-radius:8px;font-size:15px;text-align:left}
  .menu button:hover{background:rgba(255,255,255,.06)}
  .menu button[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
  .menu button[aria-current="page"] svg{color:var(--orange)}
  .top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:12px 24px}
  .top .marca small{color:var(--muted)}
  .top .icone{color:var(--body);border-color:var(--line)}
  main{padding:20px 24px 48px}
}
@media (max-width:1023px){
  .lateral{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px -12px rgba(0,0,0,.5)}
  .marca-lat{display:none!important}
  .menu{gap:0}
  .menu button{flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:3px;min-height:58px;padding:6px 2px;font-size:11px;border-radius:8px}
  .menu button .lg{display:none}
  .menu button .ct{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.08)}
  .menu button[aria-current="page"] svg{color:var(--orange)}
  main{padding-bottom:100px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--body);font-size:15px;font-weight:800}
.btn.pri{background:var(--orange-d);border-color:transparent;color:#fff}
.btn.peq{min-height:36px;padding:0 10px;font-size:13px}
.btn:disabled{background:var(--line-soft);color:#8A8597;border-color:transparent;cursor:not-allowed}
.alerta{padding:12px 14px;border-radius:8px;font-size:14px;font-weight:600;line-height:1.45}
.alerta.bad{background:var(--bad-bg);color:var(--bad-fg)}
.alerta.warn{background:var(--warn-bg);color:var(--warn-fg)}
.alerta.ok{background:var(--ok-bg);color:var(--ok-fg)}
.vazio{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--subtle);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.lin label{flex:1 1 160px}
.card input,.card select,.card textarea,.filtros input,.filtros select{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:15px;background:#fff;color:var(--body);min-width:0}
.lin{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:28px;font-weight:800;color:var(--ink);line-height:1.15}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.warn{background:var(--warn-bg);border-color:transparent}.kpi.warn b,.kpi.warn span{color:var(--warn-fg)}
.kpi.bad{background:var(--bad-bg);border-color:transparent}.kpi.bad b,.kpi.bad span{color:var(--bad-fg)}

.secao{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.secao>header{display:flex;align-items:center;gap:12px;padding:14px}
.secao .cor{width:10px;align-self:stretch;min-height:40px;border-radius:4px;flex:none}
.secao .nome{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.secao .nome b{font-size:17px;font-weight:800;color:var(--ink)}
.secao .nome span{font-size:12px;color:var(--muted)}
.secao .cont{font-size:16px;font-weight:800;color:var(--ink);white-space:nowrap}
.secao .corpo{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.env{border-radius:10px;background:var(--sunken);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.env.bad{background:#FFF7F8;box-shadow:inset 0 0 0 2px var(--bad)}
.env.warn{background:#FFFBF2;box-shadow:inset 0 0 0 2px #F2C46B}
.env .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.env .itens{font-size:14px;font-weight:700;color:var(--ink);line-height:1.35}
.env .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.st{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok-fg)}
.st.warn{background:var(--warn-bg);color:var(--warn-fg)}
.st.bad{background:var(--bad-bg);color:var(--bad-fg)}
.st.neu{background:var(--neu-bg);color:var(--neu-fg)}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#fff}
.secoes{display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.secoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}}

.periodos{display:flex;gap:6px;overflow-x:auto}
.periodos button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--body)}
.periodos button[aria-pressed="true"]{background:#2A2733;border-color:#2A2733;color:#fff}
.filtros{display:flex;flex-wrap:wrap;gap:8px}
.filtros input[type=search]{flex:1 1 220px}
.lista{display:flex;flex-direction:column;gap:8px}
.hrow{background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hrow .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hrow .quando{margin-left:auto;font-size:13px;font-weight:800;color:var(--ink)}

.tabela{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabela table{border-collapse:collapse;width:100%}
.tabela th{background:var(--sunken);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 8px;text-align:right}
.tabela th:first-child,.tabela td:first-child{text-align:left;padding-left:12px}
.tabela td{padding:10px 8px;border-top:1px solid var(--line-soft);text-align:right;font-size:14px}
.tabela td:last-child,.tabela th:last-child{padding-right:12px}
.tabela tfoot td{background:var(--sunken);font-weight:800;color:var(--ink)}

.prod{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px}
.prod .sku{font-family:'JetBrains Mono',Menlo,monospace;font-size:12px;font-weight:600;color:var(--ink);background:var(--sunken);padding:4px 8px;border-radius:6px;flex:none}
.prod .n{flex:1 1 auto;min-width:0;font-size:14px;font-weight:700;color:var(--ink)}
.prod .q{text-align:right;line-height:1.1}.prod .q b{font-size:20px;font-weight:800;color:var(--ink)}.prod .q span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.prod input{width:90px;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:16px}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--nav)}
.login form{width:100%;max-width:360px;background:#1A1820;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px;color:#fff}
.login h1{margin:0;font-size:24px}
.login label{font-size:14px;font-weight:700;color:rgba(255,255,255,.85);display:flex;flex-direction:column;gap:6px}
.login input{height:50px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:#100D14;color:#fff;padding:0 12px;font:inherit}
.login .erro{background:rgba(211,33,55,.18);color:#FF8A98;padding:10px 12px;border-radius:8px;font-size:14px}
.login .ok{background:rgba(14,159,110,.18);color:#7FE0BC;padding:10px 12px;border-radius:8px;font-size:14px}
.login .claro{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.login .sutil{border:0;background:none;color:rgba(255,255,255,.75);font-size:14px;font-weight:700;text-decoration:underline;padding:6px}

#foto{position:fixed;inset:0;z-index:50;background:rgba(16,13,20,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;color:#fff;text-align:center}
#foto img{max-width:100%;max-height:75vh;border-radius:8px}
</style>
</head>
<body>

      <button type="button" data-v="equipe"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/></svg><span class="lg">Equipe</span><span class="ct">Equipe</span></button>
    </nav>

  <div class="conteudo">

<script>
// Nome do sistema: troque aqui e muda em todas as telas
const NOME_SISTEMA='PREP REAL';
document.querySelectorAll('.nome-sis').forEach(e=>{e.textContent=NOME_SISTEMA;});
document.querySelectorAll('.logo').forEach(e=>{e.textContent=NOME_SISTEMA.trim()[0].toUpperCase();});
document.title=NOME_SISTEMA;
firebase.initializeApp({apiKey:"AIzaSyAv4knEI4IgKH6fRpr_3BuiuijvP2Ul2ms",authDomain:"calculadora-real-ecom.firebaseapp.com",projectId:"calculadora-real-ecom",storageBucket:"calculadora-real-ecom.firebasestorage.app",messagingSenderId:"845239286688",appId:"1:845239286688:web:71018a44cabee0025842c5"});
const auth=firebase.auth();
const fns=firebase.app().functions('southamerica-east1');
let comoUid=''; // admin testando: ver como este cliente
const chamar=(fn,args={},seg=70)=>fns.httpsCallable(fn,{timeout:seg*1000})(comoUid?{...args,comoUid}:args).then(r=>r.data).catch(e=>{throw traduzErro(e,fn);});
function traduzErro(e,fn){
  const c=String(e?.code||''),m=String(e?.message||'');
  let t=m;
  if(c==='functions/internal'&&/^internal$/i.test(m.trim()))t='Esta página ainda está sendo publicada. Tente de novo em alguns minutos.';
  else if(c==='functions/not-found')t='Esta página ainda está sendo publicada. Tente de novo em alguns minutos.';
  else if(c==='functions/deadline-exceeded')t='O servidor demorou para responder. Tente de novo.';
  else if(c==='functions/unavailable')t='Sem conexão. Confira a internet e tente de novo.';
  else if(c==='functions/unauthenticated')t='Sua sessão expirou. Saia e entre de novo.';
  const x=new Error(t);x.code=c;return x;
}

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ={timeZone:'America/Sao_Paulo'};
const hora=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',...TZ});
const diaMes=d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',...TZ});
const diaISO=off=>new Date(Date.now()-off*864e5).toLocaleDateString('en-CA',TZ);
const mesAtual=()=>diaISO(0).slice(0,7);
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MODS=[
  {id:'flex',nome:'FLEX',cor:'#D32137',dica:'Sai no mesmo dia'},
  {id:'coleta',nome:'COLETA',cor:'#0E9F6E',dica:'O Mercado Livre busca entre 13h e 14h'},
  {id:'agencia',nome:'AGÊNCIA',cor:'#C98A00',dica:'Levamos à agência'},
  {id:'correios',nome:'CORREIOS',cor:'#3B5BF5',dica:'Postamos nos Correios'},
];
const modDe=id=>MODS.find(m=>m.id===id)||{id,nome:String(id||'OUTRA').toUpperCase(),cor:'#5C5769',dica:''};
const itensTxt=its=>(its||[]).map(i=>`${i.qtd}× ${esc(i.titulo)}${i.atributos?` <span style="font-weight:600;color:var(--muted)">(${esc(i.atributos)})</span>`:''}`).join('<br>');

/* ── Login ─────────────────────────────────────────────── */
function mostrar(t){['login','senha','app'].forEach(x=>$('tela-'+x).classList.toggle('oculto',x!==t));}
$('form-login').addEventListener('submit',async e=>{
  e.preventDefault();$('l-erro').classList.add('oculto');$('l-ok').classList.add('oculto');$('l-btn').disabled=true;
  try{await auth.signInWithEmailAndPassword($('l-email').value.trim(),$('l-senha').value);}
  catch(err){$('l-erro').textContent=/invalid-credential|wrong-password|user-not-found|invalid-login/.test(err.code+err.message)?'E-mail ou senha incorretos':(err.message||'Não foi possível entrar');$('l-erro').classList.remove('oculto');}
  finally{$('l-btn').disabled=false;}
});
$('l-esqueci').onclick=async()=>{
  const email=$('l-email').value.trim();$('l-erro').classList.add('oculto');$('l-ok').classList.add('oculto');
  if(!email){$('l-erro').textContent='Digite o seu e-mail acima e toque de novo em "Esqueci minha senha".';$('l-erro').classList.remove('oculto');return;}
  try{await auth.sendPasswordResetEmail(email);$('l-ok').textContent=`Enviamos um link para ${email} criar uma senha nova. Veja também o spam.`;$('l-ok').classList.remove('oculto');}
  catch(err){$('l-erro').textContent=err.message||'Não consegui enviar o e-mail';$('l-erro').classList.remove('oculto');}
};
$('b-sair').onclick=()=>auth.signOut();
$('s-sair').onclick=()=>auth.signOut();
let souAdmin=false;
auth.onAuthStateChanged(async u=>{
  if(!u){mostrar('login');return;}
  let perfil={};
  try{perfil=await chamar('mlMeuPerfil');}catch{}
  souAdmin=Boolean(perfil.admin);
  if(perfil.trocarSenha){mostrar('senha');return;}
  entrar();
});
$('form-senha').addEventListener('submit',async e=>{
  e.preventDefault();
  const a=$('s-1').value,b=$('s-2').value;$('s-erro').classList.add('oculto');
  const falha=t=>{$('s-erro').textContent=t;$('s-erro').classList.remove('oculto');};
  if(a.length<8)return falha('A senha precisa ter pelo menos 8 caracteres');
  if(a!==b)return falha('As duas senhas não são iguais');
  $('s-btn').disabled=true;
  try{await auth.currentUser.updatePassword(a);await chamar('mlSenhaTrocada');entrar();}
  catch(err){falha(err.code==='auth/requires-recent-login'?'Saia e entre de novo com a senha provisória para trocar.':(err.message||'Não foi possível trocar a senha'));}
  finally{$('s-btn').disabled=false;}
});

/* ── Modo teste do admin ───────────────────────────────── */
async function entrar(){
  mostrar('app');
  if(souAdmin){
    $('barra-teste').classList.remove('oculto');
    try{
      const lista=await chamar('clienteListarParaTeste');
      const pedido=new URLSearchParams(location.search).get('como')||'';
      comoUid=lista.some(c=>c.uid===pedido)?pedido:(lista[0]?.uid||'');
      $('como').innerHTML=lista.length?lista.map(c=>`<option value="${esc(c.uid)}" ${c.uid===comoUid?'selected':''}>${esc(c.nome)}</option>`).join(''):'<option value="">Nenhum cliente ligado ao prep</option>';
      $('como').onchange=e=>{comoUid=e.target.value;dados.resumo=null;abrir(vista);};
    }catch(e){$('conteudo').innerHTML=`<div class="alerta bad">${esc(e.message)}</div>`;return;}
    if(!comoUid){$('conteudo').innerHTML='<div class="vazio">Ligue um cliente ao prep (ML Analyzer → Mentorados) para testar esta página.</div>';return;}
  }
  abrir('envios');
}

/* ── Navegação ─────────────────────────────────────────── */
let vista='envios', timer=null;
const dados={resumo:null};
document.querySelectorAll('.menu [data-v]').forEach(b=>b.onclick=()=>abrir(b.dataset.v));
function abrir(v){
  vista=v;clearInterval(timer);
  document.querySelectorAll('.menu [data-v]').forEach(b=>b.dataset.v===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  ({envios:verEnvios,hist:verHistorico,estoque:verEstoque,fatura:verFatura,equipe:verEquipe})[v]();
}
const carregando=()=>{$('conteudo').innerHTML='<div class="vazio">Carregando…</div>';};
function falhou(e){
  $('conteudo').innerHTML=`<div class="alerta bad">${esc(e.message)}</div>`;
}
async function resumo(forcar){
  if(forcar||!dados.resumo){dados.resumo=await chamar('clienteResumo');}
  const r=dados.resumo;
  $('t-nome').textContent=r.contas.map(c=>c.nome).join(' + ')||'Meus envios';$('t-nome-lat').textContent=$('t-nome').textContent;
  return r;
}

/* ── Envios do dia ─────────────────────────────────────── */
function classeSit(e){
  if(e.problema!==null&&e.problema!==undefined)return 'bad';
  if(e.atrasado)return 'bad';
  if(e.situacao==='Finalizado')return 'ok';
  if(e.situacao==='Cancelado')return 'neu';
  if(e.aguardandoNF)return 'warn';
  return 'neu';
}
async function verEnvios(silencioso){
  if(!silencioso)carregando();
  let r;try{r=await resumo(silencioso);}catch(e){return falhou(e);}
  if(vista!=='envios')return;
  const env=r.envios.filter(e=>e.situacao!=='Cancelado');
  const fin=env.filter(e=>e.situacao==='Finalizado').length;
  const nf=env.filter(e=>e.aguardandoNF&&e.situacao!=='Finalizado');
  const prob=env.filter(e=>e.problema!==null&&e.problema!==undefined);
  const atr=env.filter(e=>e.atrasado);
  const agora=new Date().toLocaleString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',...TZ});
  let h=`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2>Hoje</h2><span style="font-size:12px;color:var(--muted)">Atualizado ${esc(agora)} · atualiza sozinho</span></div>`;
  const pend=env.filter(e=>e.pendencia);
  const PEDIR={sem_nf:'Emita a nota fiscal no Mercado Livre: a etiqueta aparece sozinha e a gente despacha.',sem_produto:'Mande o produto para o galpão: sem ele o pacote não sai.',sem_estoque:'Mande mais unidades para o galpão.',segurar:'Nos avise quando podemos enviar.',outro:'Fale com a equipe do galpão.'};
  if(pend.length)h+=`<section class="card" style="border:2px solid var(--bad);gap:8px"><h2 style="color:var(--bad-fg)">Você precisa agir · ${pend.length} ${pend.length===1?'envio parado':'envios parados'}</h2>
    <span style="font-size:13px;color:var(--muted)">Estes envios já passaram do prazo do Mercado Livre e só saem quando você resolver. O atraso conta na sua reputação.</span>
    ${pend.map(e=>`<div class="env bad"><div class="l1"><span class="st bad">${esc(e.pendencia.rotulo)}</span><span class="mono" style="font-size:12px;color:var(--muted)">Envio ${esc(e.shipmentId)}</span></div>
      <div class="itens">${itensTxt(e.itens)}</div>
      <div style="font-size:13px;font-weight:700;color:var(--ink)">${esc(PEDIR[e.pendencia.motivo]||PEDIR.outro)}</div>
      ${e.pendencia.obs?`<div class="meta">Recado da equipe: ${esc(e.pendencia.obs)}</div>`:''}</div>`).join('')}</section>`;
  if(nf.length)h+=`<div class="alerta warn"><b>${nf.length} envio${nf.length>1?'s':''} esperando a sua nota fiscal.</b> Sem a NF o Mercado Livre não libera a etiqueta e o pacote não sai. Emita no Mercado Livre e a etiqueta aparece aqui sozinha.</div>`;
  if(prob.length)h+=`<div class="alerta bad"><b>${prob.length} envio${prob.length>1?'s':''} com problema.</b> A equipe do galpão vai falar com você. Motivo: ${prob.map(p=>esc(p.problema||'não informado')).join('; ')}</div>`;
  h+=`<div class="kpis">
    <div class="kpi"><span>Envios hoje</span><b class="tab">${env.length}</b></div>
    <div class="kpi"><span>Finalizados</span><b class="tab">${fin}</b><small>${env.length?Math.round(fin/env.length*100):0}% do dia</small></div>
    <div class="kpi ${nf.length?'warn':''}"><span>Esperando a sua NF</span><b class="tab">${nf.length}</b></div>
    <div class="kpi ${atr.length?'bad':''}"><span>Atrasados</span><b class="tab">${atr.length}</b></div>
  </div>`;
  if(!env.length){h+='<div class="vazio">Nenhum envio para hoje. Assim que entrar uma venda de Flex, Coleta, Agência ou Correios, ela aparece aqui.<br><button class="btn peq" type="button" id="ir-ontem" style="margin-top:10px">Ver o que saiu ontem</button></div>';$('conteudo').innerHTML=h;$('ir-ontem').onclick=()=>{hist.periodo='ontem';abrir('hist');};agendar();return;}
  const ordem=e=>e.situacao==='Finalizado'?3:(classeSit(e)==='bad'?0:e.aguardandoNF?1:2);
  h+='<div class="secoes">'+MODS.concat(env.some(e=>!MODS.find(m=>m.id===e.modalidade))?[{id:'__outra'}]:[]).map(m=>{
    const lista=env.filter(e=>m.id==='__outra'?!MODS.find(x=>x.id===e.modalidade):e.modalidade===m.id).sort((a,b)=>ordem(a)-ordem(b)||String(a.limiteDespacho).localeCompare(String(b.limiteDespacho)));
    if(!lista.length)return '';
    const md=m.id==='__outra'?modDe(lista[0].modalidade):m;
    const f=lista.filter(e=>e.situacao==='Finalizado').length;
    return `<section class="secao"><header><span class="cor" style="background:${md.cor}"></span><span class="nome"><b>${esc(md.nome)}</b><span>${esc(md.dica)}</span></span><span class="cont tab" style="${f===lista.length?'color:var(--ok-fg)':''}">${f}/${lista.length}${f===lista.length?' ✓':''}</span></header>
      <div class="corpo">${lista.map(e=>{const c=classeSit(e);return `<div class="env ${c==='bad'?'bad':c==='warn'?'warn':''}">
        <div class="l1"><span class="st ${c}">${esc(e.atrasado&&e.situacao!=='Finalizado'?'Atrasado · ':'')}${esc(e.situacao)}</span>${r.contas.length>1?`<span style="font-size:12px;font-weight:800;color:var(--muted)">${esc(e.conta)}</span>`:''}</div>
        <div class="itens">${itensTxt(e.itens)}</div>
        <div class="meta"><span class="mono">Envio ${esc(e.shipmentId)}</span>${e.finalizadoEm?`<span>finalizado às ${hora(e.finalizadoEm)}</span>`:e.limiteDespacho?`<span>sai até ${diaMes(e.limiteDespacho)} ${hora(e.limiteDespacho)}</span>`:''}${e.temFoto?`<button class="btn peq" type="button" data-foto="${esc(e.shipmentId)}">Ver foto da caixa</button>`:''}</div>
      </div>`;}).join('')}</div></section>`;
  }).join('')+'</div>';
  $('conteudo').innerHTML=h;ligarFotos();agendar();
}
function agendar(){clearInterval(timer);timer=setInterval(()=>{if(vista==='envios'&&!document.hidden)verEnvios(true);},90000);}

/* ── Foto e comprovante ────────────────────────────────── */
function ligarFotos(){
  document.querySelectorAll('[data-foto]').forEach(b=>b.onclick=()=>verFoto(b.dataset.foto,false));
  document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>verFoto(b.dataset.comp,true));
}
async function verFoto(id,comprovante){
  const box=$('foto');box.classList.remove('oculto');
  box.innerHTML=`<div style="font-size:18px;font-weight:800">Carregando…</div>`;
  const fechar=()=>box.classList.add('oculto');
  try{
    const r=await chamar('clienteFoto',{shipmentId:id,comprovante});
    box.innerHTML=r.base64?`<div style="font-size:15px;font-weight:800">${comprovante?'Comprovante de postagem':'Foto da caixa aberta'} · envio <span class="mono">${esc(id)}</span></div><img alt="${comprovante?'Comprovante de postagem':'Foto da caixa'} do envio ${esc(id)}" src="data:image/jpeg;base64,${r.base64}"><button class="btn" type="button" id="f-x">Fechar</button>`
      :`<div style="font-size:18px;font-weight:800">${comprovante?'Sem comprovante para este envio.':'Este envio não tem foto.'}</div><button class="btn" type="button" id="f-x">Fechar</button>`;
  }catch(e){box.innerHTML=`<div style="font-size:16px">${esc(e.message)}</div><button class="btn" type="button" id="f-x">Fechar</button>`;}
  $('f-x').onclick=fechar;$('f-x').focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('foto').classList.add('oculto');});

/* ── Histórico ─────────────────────────────────────────── */
const PERIODOS=[['hoje','Hoje',0,0],['ontem','Ontem',1,1],['7d','7 dias',6,0],['30d','30 dias',29,0]];
let hist={periodo:'7d',envios:[],busca:'',mod:''};
async function verHistorico(){
  $('conteudo').innerHTML=`<div class="periodos" role="group" aria-label="Período">${PERIODOS.map(([id,n])=>`<button type="button" data-p="${id}" aria-pressed="${id===hist.periodo}">${n}</button>`).join('')}</div>
    <div class="filtros"><select id="h-mod" aria-label="Logística"><option value="">Todas as logísticas</option>${MODS.map(m=>`<option value="${m.id}" ${m.id===hist.mod?'selected':''}>${m.nome[0]+m.nome.slice(1).toLowerCase()}</option>`).join('')}</select>
    <input type="search" id="h-busca" placeholder="Buscar nº do envio ou produto" aria-label="Buscar" value="${esc(hist.busca)}"></div>
    <div id="h-res" class="lista"><div class="vazio">Carregando…</div></div>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{hist.periodo=b.dataset.p;verHistorico();});
  $('h-mod').onchange=e=>{hist.mod=e.target.value;listaHist();};
  $('h-busca').oninput=e=>{hist.busca=e.target.value;listaHist();};
  const [,,de,ate]=PERIODOS.find(p=>p[0]===hist.periodo);
  try{hist.envios=(await chamar('clienteHistorico',{de:diaISO(de),ate:diaISO(ate)})).envios||[];}
  catch(e){if($('h-res'))$('h-res').innerHTML=`<div class="alerta bad">${esc(e.message)}</div>`;return;}
  listaHist();
}
function listaHist(){
  const alvo=$('h-res');if(!alvo)return;
  const q=hist.busca.trim().toLowerCase();
  const l=hist.envios.filter(e=>(!hist.mod||e.modalidade===hist.mod)&&(!q||String(e.shipmentId).includes(q)||(e.itens||[]).some(i=>String(i.titulo).toLowerCase().includes(q))));
  if(!l.length){alvo.innerHTML='<div class="vazio">Nenhum envio finalizado neste período.</div>';return;}
  alvo.innerHTML=`<div style="font-size:13px;font-weight:800;color:var(--muted)">${l.length} envio${l.length>1?'s':''} finalizado${l.length>1?'s':''}</div>`+l.map(e=>{const m=modDe(e.modalidade);return `<div class="hrow" style="border-left-color:${m.cor}">
    <div class="l1"><span class="pill" style="background:${m.cor}">${esc(m.nome)}</span>${e.atrasado?'<span class="st bad">saiu atrasado</span>':''}<span class="quando">${e.finalizadoEm?diaMes(e.finalizadoEm)+' · '+hora(e.finalizadoEm):''}</span></div>
    <div style="font-size:14px;font-weight:700;color:var(--ink);line-height:1.35">${itensTxt(e.itens)}</div>
    <div class="l1" style="font-size:12px;color:var(--muted)"><span class="mono">Envio ${esc(e.shipmentId)}</span>
      ${e.temFoto?`<button class="btn peq" type="button" data-foto="${esc(e.shipmentId)}">Foto da caixa</button>`:'<span class="st neu">sem foto</span>'}
      ${e.comprovante?`<button class="btn peq" type="button" data-comp="${esc(e.shipmentId)}">Comprovante</button>`:''}</div>
  </div>`;}).join('');
  ligarFotos();
}

/* ── Estoque e aviso de chegada ────────────────────────── */
let est={filtro:'todos',busca:''};
function situacaoEstoque(p){
  if(p.disponivel<0)return{c:'bad',t:`Faltam ${-p.disponivel} un para as vendas já feitas`,o:0};
  if(p.disponivel===0)return{c:'bad',t:p.reservado?'Tudo já vendido':'Sem estoque',o:0};
  if(p.diasDeEstoque!==null&&p.diasDeEstoque<=10)return{c:'warn',t:`Acabando · ~${p.diasDeEstoque} dia${p.diasDeEstoque===1?'':'s'}`,o:1};
  return{c:'ok',t:p.diasDeEstoque!==null?`Dá para ~${p.diasDeEstoque} dias`:'Em estoque',o:2};
}
async function verEstoque(){
  carregando();
  let r,e;
  try{[r,e]=await Promise.all([resumo(true),chamar('clienteEstoque')]);}catch(err){return falhou(err);}
  if(vista!=='estoque')return;
  const multi=e.contas.length>1;
  const ps=e.produtos.map(p=>({...p,sit:situacaoEstoque(p)}));
  const soma=k=>ps.reduce((s,p)=>s+Math.max(0,p[k]||0),0);
  const criticos=ps.filter(p=>p.sit.c!=='ok');
  const zerados=ps.filter(p=>p.sit.c==='bad');
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2>Seu estoque no galpão</h2><button class="btn pri" type="button" id="e-avisar">Avisar que vou mandar mercadoria</button></div><div id="e-form"></div>`;
  if(zerados.length)h+=`<div class="alerta bad"><b>${zerados.length} produto${zerados.length>1?'s':''} sem unidade livre para vender.</b> Se o anúncio continuar ativo, a próxima venda fica sem produto no galpão. Mande mercadoria ou pause o anúncio.</div>`;
  h+=`<div class="kpis">
    <div class="kpi"><span>Disponível para vender</span><b class="tab">${soma('disponivel')}</b><small>unidades livres</small></div>
    <div class="kpi"><span>Já vendido, saindo</span><b class="tab">${soma('reservado')}</b><small>separadas para pedidos</small></div>
    <div class="kpi"><span>A caminho</span><b class="tab">${soma('aCaminho')}</b><small>avisadas, não chegaram</small></div>
    <div class="kpi ${criticos.length?'warn':''}"><span>Acabando ou zerados</span><b class="tab">${criticos.length}</b><small>de ${ps.length} produtos</small></div>
  </div>`;
  if(r.aReceber.length)h+=`<details class="card"><summary style="font-weight:800;cursor:pointer;min-height:28px;color:var(--ink)">A caminho do galpão (${r.aReceber.length} aviso${r.aReceber.length>1?'s':''})</summary>${r.aReceber.map(a=>`<div style="border-top:1px solid var(--line-soft);padding-top:8px;font-size:14px"><b>${a.previsto?'Previsto para '+a.previsto.split('-').reverse().join('/'):'Sem data prevista'}</b>${multi?` · ${esc(a.conta)}`:''}<div style="color:var(--muted);font-size:13px;margin-top:2px">${(a.itens||[]).map(i=>`${i.avisado}× ${esc(i.nome)} <span class="mono">${esc(i.sku)}</span>`).join(' · ')}</div></div>`).join('')}</details>`;
  if(!ps.length){h+='<div class="vazio">Nenhum produto no galpão ainda. Toque em <b>Avisar que vou mandar mercadoria</b> e escolha os produtos direto dos seus anúncios.</div>';$('conteudo').innerHTML=h;$('e-avisar').onclick=()=>formAviso(e);return;}
  h+=`<div class="filtros"><div class="periodos" role="group" aria-label="Filtro"><button type="button" data-ef="todos" aria-pressed="${est.filtro==='todos'}">Todos ${ps.length}</button><button type="button" data-ef="criticos" aria-pressed="${est.filtro==='criticos'}">Acabando ou zerados ${criticos.length}</button></div>
    <input type="search" id="e-busca" placeholder="Buscar SKU, produto ou anúncio" aria-label="Buscar produto" value="${esc(est.busca)}"></div>
    <div id="e-lista" class="lista"></div>
    <span style="font-size:12px;color:var(--muted)">Disponível para vender = unidades na prateleira menos as que já foram vendidas e ainda não saíram. Atualiza a cada venda e a cada pacote finalizado.</span>`;
  $('conteudo').innerHTML=h;
  $('e-avisar').onclick=()=>formAviso(e);
  document.querySelectorAll('[data-ef]').forEach(b=>b.onclick=()=>{est.filtro=b.dataset.ef;document.querySelectorAll('[data-ef]').forEach(x=>x.setAttribute('aria-pressed',x===b));listaEstoque(ps,multi);});
  $('e-busca').oninput=ev=>{est.busca=ev.target.value;listaEstoque(ps,multi);};
  listaEstoque(ps,multi);
}
function listaEstoque(ps,multi){
  const q=est.busca.trim().toLowerCase();
  const l=ps.filter(p=>(est.filtro!=='criticos'||p.sit.c!=='ok')&&(!q||p.sku.toLowerCase().includes(q)||String(p.nome).toLowerCase().includes(q)||p.anuncios.some(a=>String(a.titulo).toLowerCase().includes(q))))
    .sort((a,b)=>a.sit.o-b.sit.o||a.sku.localeCompare(b.sku));
  const cor={bad:'var(--bad-fg)',warn:'var(--warn-fg)',ok:'var(--ink)'};
  $('e-lista').innerHTML=l.length?l.map(p=>`<article class="card" style="gap:8px;${p.sit.c==='bad'?'box-shadow:inset 0 0 0 2px var(--bad);border-color:transparent':p.sit.c==='warn'?'box-shadow:inset 0 0 0 2px #F2C46B;border-color:transparent':''}">
    <div style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="sku mono" style="font-size:12px;font-weight:600;color:var(--ink);background:var(--sunken);padding:3px 8px;border-radius:6px">${esc(p.sku)}</span><span class="st ${p.sit.c}">${esc(p.sit.t)}</span></div>
        <b style="font-size:15px;color:var(--ink);line-height:1.3">${esc(p.nome)}</b>

      </div>

  </div>`;
  f.porConta.forEach(c=>{
    h+=`${f.porConta.length>1?`<h2>${esc(c.conta)} · ${brl(c.total)}</h2>`:''}
    <div class="tabela"><table><thead><tr><th>Serviço</th><th>Qtd</th><th>Valor un.</th><th>Total</th></tr></thead>
    <tbody>${c.linhas.length?c.linhas.map(l=>`<tr><td>${esc(l.nome)}</td><td class="tab">${l.qtd}</td><td class="tab" style="color:var(--muted)">${brl(l.unit)}</td><td class="tab" style="font-weight:800;color:var(--ink)">${brl(l.total)}</td></tr>`).join(''):'<tr><td colspan="4" style="text-align:center;color:var(--subtle)">Nada cobrado neste mês ainda.</td></tr>'}</tbody>
    <tfoot><tr><td colspan="3">Total</td><td class="tab">${brl(c.total)}</td></tr></tfoot></table></div>
    <div style="font-size:12px;color:var(--muted)">${c.pacotes} pacotes finalizados · ${c.recebidas} unidades recebidas no mês · ${c.emEstoque} unidades em estoque hoje</div>
    ${(c.full||[]).length?`<details class="card"><summary style="font-weight:800;cursor:pointer;min-height:28px;color:var(--ink)">Envios Full etiquetados no mês (${c.etiquetasFull} etiquetas)</summary>${c.full.map(x=>`<div style="border-top:1px solid var(--line-soft);padding-top:8px;font-size:14px"><b>Full ${x.dataFull.split('-').reverse().join('/')}</b>${x.inboundId?` · <span class="mono">${esc(x.inboundId)}</span>`:''} · ${x.etiquetas} etiquetas<div style="color:var(--muted);font-size:13px;margin-top:2px">${x.itens.map(i=>`${i.qtd}× ${esc(i.nome)}`).join(' · ')}</div></div>`).join('')}</details>`:''}`;
  });
  $('fat-res').innerHTML=h;
}

/* ── Equipe do cliente ─────────────────────────────────── */
const LINK_CLIENTE='https://ollmestorerj.github.io/ml-analyzer/cliente.html';
const msgPessoa=c=>`Oi${c.nome?' '+c.nome.split(' ')[0]:''}! Seu acesso para acompanhar os envios no ${NOME_SISTEMA} está pronto.\n\nLink: ${LINK_CLIENTE}\nE-mail: ${c.email}\nSenha provisória: ${c.senha}\n\nNo primeiro acesso você cria a sua senha.`;
async function verEquipe(){
  carregando();
  let r;try{r=await chamar('clienteEquipe');}catch(e){return falhou(e);}
  const pode=r.souDono||souAdmin;
  let h='';
  if(pode)h+=`<form class="card" id="eq-form" autocomplete="off"><h2>Dar acesso a alguém da sua equipe</h2>
    <span style="font-size:13px;color:var(--muted)">A pessoa vê esta mesma página (envios, histórico, estoque e fatura). Não mexe em nada no galpão.</span>
    <div class="lin"><label>Nome<input id="eq-nome" required></label><label>E-mail<input id="eq-email" type="email" required></label><button class="btn pri" type="submit" id="eq-btn">Criar acesso</button></div>
    <div id="eq-msg"></div></form>`;
  else h+='<div class="alerta warn">Só o dono da conta adiciona ou remove pessoas.</div>';
  h+=`<h2>Quem tem acesso</h2><div class="lista">${r.pessoas.length?r.pessoas.map(p=>`<div class="prod"><span class="n">${esc(p.nome||p.email)}<br><span style="font-size:12px;color:var(--muted);font-weight:600">${esc(p.email)}${p.trocarSenha?' · ainda não entrou':''}</span></span>${pode?`<button class="btn peq" type="button" data-rem="${esc(p.uid)}" data-nome="${esc(p.nome||p.email)}">Remover</button>`:''}</div>`).join(''):'<div class="vazio">Só você por enquanto.</div>'}</div>`;
  $('conteudo').innerHTML=h;
  document.querySelectorAll('[data-rem]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent=`Confirmar: remover ${b.dataset.nome}`;b.style.color='var(--bad-fg)';return;}
    b.disabled=true;try{await chamar('clienteEquipe',{remover:b.dataset.rem});verEquipe();}catch(e){b.disabled=false;b.textContent=e.message;}
  });
  if(!pode)return;
  $('eq-form').onsubmit=async e=>{
    e.preventDefault();$('eq-btn').disabled=true;
    const nome=$('eq-nome').value.trim(),email=$('eq-email').value.trim();
    try{
      const c=await chamar('clienteEquipe',{criar:{nome,email}});
      if(c.jaTinhaLogin){$('eq-msg').innerHTML=`<div class="alerta ok">${esc(email)} já tinha login e agora também vê esta página. Mande o link: ${LINK_CLIENTE}</div>`;}
      else{
        const txt=msgPessoa({...c,nome});
        $('eq-msg').innerHTML=`<div class="alerta ok" style="white-space:pre-wrap">${esc(txt)}</div><div class="lin"><button class="btn" type="button" id="eq-copiar">Copiar mensagem</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Mandar no WhatsApp</a></div>`;
        $('eq-copiar').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('eq-copiar').textContent='Copiado';}catch{$('eq-copiar').textContent='Copie o texto acima';}};
      }
      $('eq-nome').value='';$('eq-email').value='';
      const l=await chamar('clienteEquipe');
      document.querySelector('#conteudo .lista').innerHTML=l.pessoas.map(p=>`<div class="prod"><span class="n">${esc(p.nome||p.email)}<br><span style="font-size:12px;color:var(--muted);font-weight:600">${esc(p.email)}${p.trocarSenha?' · ainda não entrou':''}</span></span></div>`).join('');
    }catch(err){$('eq-msg').innerHTML=`<div class="alerta bad">${esc(err.message)}</div>`;}
    finally{$('eq-btn').disabled=false;}
  };
}
</script>
