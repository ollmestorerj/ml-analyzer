<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ════════════════════════════════════════════════════════════
   DS PRIMITIVES
   ════════════════════════════════════════════════════════════ */

/* Wordmark */
const Wordmark = ({ size = 18, dark = false }) => (
  <span style={{ fontFamily:'Anton,sans-serif', fontSize:size, letterSpacing:-0.3, userSelect:'none' }}>
    <span style={{ color: dark ? '#fff' : '#9333ea' }}>real</span>
    <span style={{ color:'#FF5200' }}>ecom</span>
  </span>
);

/* Icon (Lucide) */
const Icon = ({ name, size=18, color='currentColor', style={} }) => {
  const ref = React.useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const svg = lucide.icons[name];
      if (svg) {
        const el = document.createElement('i');
        el.setAttribute('data-lucide', name);
        ref.current.appendChild(el);
        lucide.createIcons({ nodes: [el] });
        const s = ref.current.querySelector('svg');
        if (s) { s.setAttribute('width', size); s.setAttribute('height', size); s.style.color = color; }
      }
    }
  }, [name, size, color]);
  return <span ref={ref} style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', ...style }} />;
};

/* Badge */
const Badge = ({ children, tone='default', pill=false }) => {
  const tones = {
    default: { bg:'rgba(0,0,0,.06)', color:'#4B4B4B' },
    success: { bg:'rgba(34,197,94,.12)', color:'#16a34a' },
    danger:  { bg:'rgba(239,68,68,.12)', color:'#dc2626' },
    warning: { bg:'rgba(245,158,11,.12)', color:'#d97706' },
    brand:   { bg:'rgba(255,82,0,.12)', color:'#FF5200' },
  };
  const t = tones[tone] || tones.default;
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      background:t.bg, color:t.color,
      fontSize:11, fontWeight:600, letterSpacing:'0.04em',
      padding: pill ? '3px 10px' : '2px 7px',
      borderRadius: pill ? 999 : 6,
    }}>{children}</span>
  );
};

/* Button */
const Btn = ({ children, variant='primary', size='md', onClick, disabled, full, icon, style={} }) => {
  const variants = {
    primary:   { bg:'#FF5200', color:'#fff', border:'none' },
    secondary: { bg:'transparent', color:'#0D0D0D', border:'1px solid rgba(0,0,0,.14)' },
    ghost:     { bg:'transparent', color:'#4B4B4B', border:'none' },
    danger:    { bg:'rgba(239,68,68,.1)', color:'#dc2626', border:'none' },
  };
  const sizes = { sm:{h:32,px:12,fs:12}, md:{h:40,px:16,fs:13}, lg:{h:48,px:20,fs:15} };
  const v = variants[variant]; const s = sizes[size];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6,
      height:s.h, padding:`0 ${s.px}px`, borderRadius:'var(--radius-md)',
      fontSize:s.fs, fontWeight:700, fontFamily:'var(--font-sans)',
      cursor:disabled?'not-allowed':'pointer', width:full?'100%':'auto',
      opacity:disabled?.6:1, transition:'var(--transition-control)',
      ...v, ...style,
    }}>{icon && <Icon name={icon} size={s.fs+2} />}{children}</button>
  );
};

/* StatCard */
const StatCard = ({ label, value, caption, delta, deltaDir, icon, accent='brand', style={} }) => {
  const up = deltaDir ? deltaDir==='up' : String(delta||'').startsWith('+');
  const good = deltaDir==='down-good' ? !up : up;
  const deltaColor = delta==null ? null : good ? '#16a34a' : '#dc2626';
  const accentColor = { brand:'#FF5200', accent:'#7B2ECC', success:'#16a34a', info:'#3b82f6' }[accent];
  return (
    <div style={{
      background:'var(--surface-card)', border:'1px solid var(--border-subtle)',
      borderRadius:'var(--radius-xl)', boxShadow:'var(--shadow-sm)',
      padding:'var(--layout-card-pad)', display:'flex', flexDirection:'column',
      gap:'var(--space-3)', minWidth:0, ...style
    }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:8 }}>
        <span style={{ fontSize:'var(--text-xs)', fontWeight:600, color:'var(--text-muted)', letterSpacing:'var(--tracking-wide)' }}>
          {label}
        </span>
        {icon && (
          <span style={{ width:28, height:28, borderRadius:'var(--radius-sm)', background:'var(--surface-sunken)', display:'inline-flex', alignItems:'center', justifyContent:'center' }}>
            <Icon name={icon} size={14} color={accentColor} />
          </span>
        )}
      </div>
      <div style={{ display:'flex', alignItems:'baseline', gap:8, flexWrap:'wrap' }}>
        <span className="rl-tabular" style={{ fontSize:'var(--text-3xl)', fontWeight:'var(--weight-extrabold)', letterSpacing:'var(--tracking-tight)', color:'var(--text-primary)' }}>
          {value}
        </span>
        {delta != null && (
          <span style={{ fontSize:'var(--text-xs)', fontWeight:700, color:deltaColor,
            background:good?'var(--green-100)':'var(--red-100)', borderRadius:999, padding:'2px 7px' }}>
            {delta}
          </span>
        )}
      </div>
      {caption && (
        <span style={{ fontSize:'var(--text-xs)', color:'var(--text-muted)', lineHeight:1.4 }}>{caption}</span>
      )}
    </div>
  );
};

/* Skeleton */
const Skeleton = ({ w='100%', h=16, radius=6 }) => (
  <div style={{ width:w, height:h, borderRadius:radius, background:'linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%)', backgroundSize:'200% 100%', animation:'shimmer 1.5s infinite' }} />
);

/* ════════════════════════════════════════════════════════════
   PERIOD FILTER
   ════════════════════════════════════════════════════════════ */
const PERIODOS = ['hoje','ontem','7d','30d','mes'];
const PERIODO_LABELS = { hoje:'Hoje', ontem:'Ontem', '7d':'7 dias', '30d':'30 dias', mes:'Mês atual' };

const PeriodFilter = ({ value, onChange }) => (

        cursor:'pointer', transition:'var(--transition-control)',
        background: value===p ? '#FF5200' : 'transparent',
        color: value===p ? '#fff' : 'rgba(255,255,255,.6)',
        border: `1px solid ${value===p ? '#FF5200' : 'rgba(255,255,255,.14)'}`,
      }}>{PERIODO_LABELS[p]}</button>
    ))}
  </div>
);

/* ════════════════════════════════════════════════════════════
   TELA LOGIN
   ════════════════════════════════════════════════════════════ */
function TelaLogin() {
  const [email,setEmail]=useState(''); const [senha,setSenha]=useState('');
  const [loading,setLoading]=useState(false); const [err,setErr]=useState('');

  async function login() {
    if (!email||!senha) { setErr('Preencha email e senha'); return; }
    setLoading(true); setErr('');
    try { await auth.signInWithEmailAndPassword(email,senha); }
    catch(e) {
      const m={'auth/invalid-credential':'Email ou senha incorretos','auth/too-many-requests':'Muitas tentativas. Aguarde.'};
      setErr(m[e.code]||e.message);
    } finally { setLoading(false); }
  }

  return (
    <div style={{ display:'flex', height:'100vh', background:'#0D0D0D', alignItems:'center', justifyContent:'center' }}>
      <div style={{ width:360 }}>
        <div style={{ textAlign:'center', marginBottom:36 }}>
          <Wordmark size={28} dark />
          <div style={{ width:36, height:3, background:'linear-gradient(to right,#9333ea,#FF5200)', borderRadius:2, margin:'12px auto 12px' }} />
          <div style={{ fontSize:11, color:'rgba(255,255,255,.38)', letterSpacing:'0.1em', textTransform:'uppercase' }}>ML Analyzer</div>
        </div>
        <div style={{ background:'#1a1a1a', border:'1px solid rgba(255,255,255,.08)', borderRadius:'var(--radius-xl)', padding:24 }}>
          {['Email','Senha'].map((lbl,i) => (
            <div key={lbl} style={{ marginBottom:i===0?14:20 }}>
              <label style={{ fontSize:11, fontWeight:600, color:'rgba(255,255,255,.45)', display:'block', marginBottom:6, letterSpacing:'0.06em', textTransform:'uppercase' }}>{lbl}</label>
              <input
                type={i===1?'password':'email'}
                placeholder={i===0?'seu@email.com':'••••••••'}
                value={i===0?email:senha}
                onChange={e => i===0?setEmail(e.target.value):setSenha(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&login()}
                style={{ background:'rgba(255,255,255,.06)', border:'1px solid rgba(255,255,255,.1)', borderRadius:'var(--radius-md)', padding:'10px 14px', color:'#fff', width:'100%', fontSize:14, outline:'none', fontFamily:'var(--font-sans)' }}
              />
            </div>
          ))}
          {err && <div style={{ background:'rgba(239,68,68,.1)', border:'1px solid rgba(239,68,68,.25)', borderRadius:'var(--radius-md)', padding:'10px 14px', color:'#f87171', fontSize:13, marginBottom:14 }}>{err}</div>}
          <button onClick={login} disabled={loading} style={{ width:'100%', height:44, background:'#FF5200', color:'#fff', border:'none', borderRadius:'var(--radius-md)', fontSize:15, fontWeight:700, cursor:loading?'not-allowed':'pointer', opacity:loading?.7:1, fontFamily:'var(--font-sans)' }}>
            {loading ? 'Entrando...' : 'Entrar'}
          </button>
          <div style={{ textAlign:'center', marginTop:14, fontSize:11, color:'rgba(255,255,255,.28)' }}>Mesmo login da Calculadora REAL</div>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   TELA CONECTAR ML
   ════════════════════════════════════════════════════════════ */
function TelaConectarML({ user, onConectado }) {
  const [conectando,setConectando]=useState(false);
  const [err,setErr]=useState('');

  useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    const code = p.get('code');
    if (code) { window.history.replaceState({},'',window.location.pathname); conectarComCode(code); }
  }, []);

  async function conectarComCode(code) {
    setConectando(true); setErr('');
    try {
      const fn = functions.httpsCallable('mlTokenExchange');
      const r  = await fn({ code });
      if (r.data.success) onConectado();
    } catch(e) { setErr('Erro: '+(e.message||'Tente novamente')); setConectando(false); }
  }

  if (conectando) return (
    <div style={{ display:'flex', height:'100vh', background:'#0D0D0D', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:16 }}>
      <Wordmark size={24} dark />
      <div style={{ fontSize:13, color:'rgba(255,255,255,.45)' }}>Conectando sua conta do Mercado Livre...</div>
    </div>
  );

  return (
    <div style={{ display:'flex', height:'100vh', background:'#0D0D0D', alignItems:'center', justifyContent:'center' }}>
      <div style={{ width:420, textAlign:'center' }}>
        <Wordmark size={24} dark />
        <div style={{ fontSize:20, fontWeight:700, color:'#fff', margin:'20px 0 8px', fontFamily:'var(--font-sans)' }}>Conectar Mercado Livre</div>
        <div style={{ fontSize:13, color:'rgba(255,255,255,.45)', marginBottom:28 }}>
          Olá, <strong style={{ color:'#fff' }}>{user.email?.split('@')[0]}</strong>. Autorize o acesso à sua conta.
        </div>
        <div style={{ background:'#1a1a1a', border:'1px solid rgba(255,255,255,.08)', borderRadius:'var(--radius-xl)', padding:24 }}>
          <div style={{ fontSize:13, color:'rgba(255,255,255,.45)', marginBottom:20, lineHeight:1.6 }}>
            Clique abaixo — você será redirecionado ao Mercado Livre e voltará automaticamente.
          </div>
          {err && <div style={{ background:'rgba(239,68,68,.1)', border:'1px solid rgba(239,68,68,.25)', borderRadius:'var(--radius-md)', padding:'10px 14px', color:'#f87171', fontSize:13, marginBottom:14 }}>{err}</div>}
          <button
            onClick={() => { window.location.href = `https://auth.mercadolivre.com.br/authorization?response_type=code&client_id=${ML_CLIENT_ID}&redirect_uri=${encodeURIComponent(ML_REDIRECT)}`; }}
            style={{ width:'100%', height:44, background:'#FF5200', color:'#fff', border:'none', borderRadius:'var(--radius-md)', fontSize:15, fontWeight:700, cursor:'pointer', fontFamily:'var(--font-sans)' }}>
            Autorizar com Mercado Livre
          </button>
          <button onClick={() => auth.signOut()} style={{ background:'none', border:'none', color:'rgba(255,255,255,.3)', cursor:'pointer', fontSize:12, marginTop:14 }}>Sair</button>
        </div>
      </div>
    </div>
  );
}

          {/* Qtde */}
          <div className="rl-tabular" style={{ fontSize:'var(--text-sm)', fontWeight:700, color:'var(--text-primary)' }}>{p.qtde}</div>
          {/* Valor */}
          <div className="rl-tabular" style={{ fontSize:'var(--text-sm)', fontWeight:700, color:'#FF5200' }}>{BRL(p.valor)}</div>
          {/* Tarifa */}
          <div className="rl-tabular" style={{ fontSize:'var(--text-sm)', color:'var(--text-secondary)' }}>{BRL(p.tarifa)}</div>
          {/* Frete */}
          <div className="rl-tabular" style={{ fontSize:'var(--text-sm)', color:'var(--text-secondary)' }}>{BRL(p.frete)}</div>
        </div>
      )) : (
        <div style={{ padding:48, textAlign:'center' }}>
          <Icon name="package" size={32} color="rgba(0,0,0,.2)" />
          <div style={{ fontSize:'var(--text-sm)', color:'var(--text-muted)', marginTop:12 }}>Nenhum pedido no período</div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   SIDEBAR NAV
   ════════════════════════════════════════════════════════════ */
const NAV = [
  { id:'dashboard', icon:'layout-dashboard', label:'Visão geral' },
  { id:'pedidos',   icon:'shopping-cart',    label:'Pedidos' },
  { id:'anuncios',  icon:'package',          label:'Anúncios' },
];

function SidebarNav({ active, onSelect, seller, onSair }) {
  return (
    <aside style={{
      width:'var(--layout-sidebar)', minHeight:'100vh', background:'var(--surface-sidebar)',
      display:'flex', flexDirection:'column', borderRight:'1px solid var(--border-sidebar)',
      position:'fixed', top:0, left:0, zIndex:30,
    }}>
      {/* Logo */}
      <div style={{ height:'var(--layout-topbar)', display:'flex', alignItems:'center', padding:'0 20px', borderBottom:'1px solid var(--border-sidebar)' }}>
        <Wordmark size={20} dark />
      </div>

      {/* Nav items */}
      <nav style={{ flex:1, padding:'8px 8px' }}>
        {NAV.map(item => {
          const isActive = active === item.id;
          return (
            <button key={item.id} onClick={() => onSelect(item.id)} style={{
              display:'flex', alignItems:'center', gap:10, width:'100%', height:40,
              padding:'0 12px', borderRadius:'var(--radius-md)', border:'none',
              background: isActive ? 'rgba(255,82,0,.12)' : 'transparent',
              color: isActive ? '#FF5200' : 'rgba(255,255,255,.55)',
              cursor:'pointer', fontSize:'var(--text-sm)', fontWeight: isActive ? 700 : 500,
              fontFamily:'var(--font-sans)', transition:'var(--transition-control)',
              marginBottom:2,
            }}>
              <Icon name={item.icon} size={16} color={isActive ? '#FF5200' : 'rgba(255,255,255,.45)'} />
              {item.label}
            </button>
          );
        })}
      </nav>

      {/* User footer */}
      <div style={{ padding:'12px 16px', borderTop:'1px solid var(--border-sidebar)', display:'flex', alignItems:'center', gap:10 }}>
        <div style={{ width:32, height:32, borderRadius:'50%', background:'rgba(255,82,0,.2)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <Icon name="user" size={16} color="#FF5200" />
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:'var(--text-xs)', fontWeight:700, color:'#fff', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
            {seller?.nickname || '...'}
          </div>
          <button onClick={onSair} style={{ background:'none', border:'none', color:'rgba(255,255,255,.35)', cursor:'pointer', fontSize:11, padding:0 }}>Sair</button>
        </div>
      </div>
    </aside>
  );
}

/* ════════════════════════════════════════════════════════════
   TOP BAR
   ════════════════════════════════════════════════════════════ */
function TopBar({ hora, loading, onRefresh }) {
  return (
    <header style={{
      height:'var(--layout-topbar)', background:'var(--surface-page)',
      borderBottom:`1px solid ${getComputedStyle(document.documentElement).getPropertyValue('--border-sidebar')||'rgba(255,255,255,.08)'}`,
      display:'flex', alignItems:'center', justifyContent:'flex-end',
      padding:`0 var(--layout-page-gutter)`, gap:12,
      position:'sticky', top:0, zIndex:20,
    }}>
      {hora && <span style={{ fontSize:'var(--text-xs)', color:'rgba(255,255,255,.35)' }}>Atualizado às {hora}</span>}
      <button onClick={onRefresh} disabled={loading} style={{
        display:'inline-flex', alignItems:'center', gap:6,
        height:32, padding:'0 12px', borderRadius:'var(--radius-md)',
        background:'transparent', border:'1px solid rgba(255,255,255,.1)',
        color:'rgba(255,255,255,.55)', cursor:loading?'not-allowed':'pointer',
        fontSize:'var(--text-xs)', fontWeight:600, fontFamily:'var(--font-sans)',
      }}>
        <Icon name="refresh-cw" size={12} color="currentColor" />
        {loading ? 'Atualizando' : 'Atualizar'}
      </button>
    </header>
  );
}

/* ════════════════════════════════════════════════════════════
   DASHBOARD VIEW
   ════════════════════════════════════════════════════════════ */
function ViewDashboard({ dados, loading, periodo, onPeriodo }) {
  const m = dados?.metricas || {};

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:'var(--layout-grid-gap)' }}>

      {/* Hero — faturamento */}
      <section style={{
        background:'var(--neutral-1000)', borderRadius:'var(--radius-2xl)',
        padding:'22px var(--layout-card-pad-lg)',
        display:'flex', gap:'var(--space-6)', flexWrap:'wrap', alignItems:'flex-start',
        justifyContent:'space-between',
      }}>
        <div style={{ display:'flex', gap:'var(--space-9)', flexWrap:'wrap', flex:1, minWidth:220 }}>
          <div>
            <div style={{ fontSize:'var(--text-xs)', color:'rgba(255,255,255,.48)', letterSpacing:'var(--tracking-wide)', fontWeight:600 }}>FATURAMENTO</div>
            <div style={{ display:'flex', alignItems:'baseline', gap:10, marginTop:4 }}>
              {loading ? <Skeleton w={160} h={38} /> : (
                <span className="rl-tabular" style={{ fontSize:'var(--text-4xl)', fontWeight:'var(--weight-extrabold)', color:'#fff', letterSpacing:'var(--tracking-display)', fontFamily:'var(--font-sans)' }}>
                  {BRL(m.fat)}
                </span>
              )}
            </div>
            {!loading && <div style={{ fontSize:'var(--text-xs)', color:'rgba(255,255,255,.38)', marginTop:6 }}>{m.pedidosDia||0} pedidos · {m.qtd||0} unidades</div>}
          </div>
        </div>
        <PeriodFilter value={periodo} onChange={onPeriodo} />
      </section>

      {/* KPI grid */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))', gap:'var(--layout-grid-gap)' }}>
        {loading ? [...Array(5)].map((_,i) => (
          <div key={i} style={{ background:'var(--surface-card)', borderRadius:'var(--radius-xl)', padding:'var(--layout-card-pad)', boxShadow:'var(--shadow-sm)', display:'flex', flexDirection:'column', gap:12 }}>
            <Skeleton w="60%" h={11} /><Skeleton h={30} /><Skeleton w="80%" h={11} />
          </div>
        )) : [
          { label:'VENDAS', value:NUM(m.pedidosDia), caption:`${m.qtd||0} unidades no período`, icon:'shopping-cart' },
          { label:'TICKET MÉDIO', value:BRL(m.pedidosDia>0?m.fat/m.pedidosDia:0), icon:'tag', accent:'accent' },
          { label:'TARIFAS ML', value:BRL(m.tarifas), caption:m.fat>0?PCT((m.tarifas/m.fat)*100):'—', icon:'percent' },
          { label:'FRETE VENDEDOR', value:BRL(m.frete), caption:m.fat>0?PCT((m.frete/m.fat)*100):'—', icon:'truck', accent:'accent' },
          { label:'ANÚNCIOS ATIVOS', value:NUM(m.totalAds), icon:'package' },
        ].map(card => <StatCard key={card.label} {...card} />)}
      </div>

      {/* Tabela de pedidos */}
      <div>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
          <div style={{ fontSize:'var(--text-base)', fontWeight:700, color:'rgba(255,255,255,.85)' }}>Pedidos</div>
          <Badge tone="default">{dados?.pedidos?.length||0} resultados</Badge>
        </div>
        <TabelaPedidos pedidos={dados?.pedidos} loading={loading} />
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   ANUNCIOS VIEW
   ════════════════════════════════════════════════════════════ */
function ViewAnuncios({ dados, loading }) {
  const anuncios = dados?.anuncios || [];

  if (loading) return (
    <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
      {[...Array(5)].map((_,i) => (
        <div key={i} style={{ background:'var(--surface-card)', borderRadius:'var(--radius-xl)', padding:'var(--layout-card-pad)', display:'flex', gap:12, alignItems:'center', boxShadow:'var(--shadow-sm)' }}>
          <Skeleton w={56} h={56} radius={10} />
          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:8 }}><Skeleton h={14} /><Skeleton w="50%" h={11} /></div>
          <Skeleton w={80} h={28} />
        </div>
      ))}
    </div>
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
      {/* Header */}
      <div style={{ display:'grid', gridTemplateColumns:'56px 1fr 100px 80px 80px 80px', gap:8, padding:'10px 20px', borderRadius:'var(--radius-md)' }}>
        {['','Título','Preço','Estoque','Visitas','Vendas'].map((h,i) => (
          <div key={i} style={{ fontSize:'var(--text-xs)', fontWeight:700, color:'rgba(255,255,255,.38)', letterSpacing:'var(--tracking-caps)', textTransform:'uppercase' }}>{h}</div>
        ))}
      </div>

      {anuncios.map((a,i) => (
        <div key={a.id} style={{
          display:'grid', gridTemplateColumns:'56px 1fr 100px 80px 80px 80px',
          gap:8, padding:'12px 20px', alignItems:'center',
          background:'var(--surface-card)', borderRadius:'var(--radius-lg)',
          boxShadow:'var(--shadow-sm)', border:'1px solid var(--border-subtle)',
          marginBottom:4,
        }}>
          <div style={{ width:52, height:52, borderRadius:10, overflow:'hidden', background:'var(--surface-sunken)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:22 }}>
            {a.foto ? <img src={a.foto} alt="" style={{ width:'100%', height:'100%', objectFit:'cover' }} /> : '📦'}
          </div>
          <div style={{ minWidth:0 }}>
            <div style={{ fontSize:'var(--text-sm)', fontWeight:600, color:'var(--text-primary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{a.titulo}</div>
            <div style={{ marginTop:4, display:'flex', gap:6 }}>
              <Badge tone={a.status==='active'?'success':'danger'}>{a.status==='active'?'Ativo':'Inativo'}</Badge>
              {a.estoque <= 3 && <Badge tone="warning">⚠ Est: {a.estoque}</Badge>}
              {a.estoque > 3 && <span style={{ fontSize:'var(--text-xs)', color:'var(--text-muted)' }}>Est: {a.estoque}</span>}
            </div>
          </div>
          <div className="rl-tabular" style={{ fontSize:'var(--text-sm)', fontWeight:700, color:'#FF5200' }}>{BRL(a.preco)}</div>
          <div className="rl-tabular" style={{ fontSize:'var(--text-sm)', fontWeight:700, color:a.estoque<=3?'#dc2626':'var(--text-primary)' }}>{a.estoque}</div>
          <div className="rl-tabular" style={{ fontSize:'var(--text-sm)', fontWeight:700, color:a.visitas>0?'#d97706':'var(--text-muted)' }}>{NUM(a.visitas)}</div>
          <div className="rl-tabular" style={{ fontSize:'var(--text-sm)', color:'var(--text-secondary)' }}>{NUM(a.vendas)}</div>
        </div>
      ))}

      {anuncios.length === 0 && (
        <div style={{ padding:48, textAlign:'center', background:'var(--surface-card)', borderRadius:'var(--radius-xl)', boxShadow:'var(--shadow-sm)' }}>
          <Icon name="package" size={32} color="rgba(0,0,0,.2)" />
          <div style={{ fontSize:'var(--text-sm)', color:'var(--text-muted)', marginTop:12 }}>Nenhum anúncio ativo</div>
        </div>
      )}

  );
}

/* ════════════════════════════════════════════════════════════
   ANÁLISE IA VIEW
   ════════════════════════════════════════════════════════════ */
function ViewIA({ dados, periodo }) {
  const [analise,setAnalise]=useState(''); const [loading,setLoading]=useState(false);

  async function gerar() {
    if (!dados) return;
    setLoading(true); setAnalise('');
    const topAds = dados.anuncios?.slice(0,15).map(a=>({ titulo:a.titulo, preco:BRL(a.preco), visitas:a.visitas, faturado:BRL(a.fatDia||0), estoque:a.estoque, vendas_total:a.vendas }));
    try {
      const r = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-6', max_tokens:1000,
          system:`Você é especialista em Mercado Livre. Analise e entregue:\n🎯 DIAGNÓSTICO (pontos fortes e de atenção)\n🔥 TOP 3 ANÚNCIOS PARA FOCAR\n⚠️ ALERTAS (estoque, visitas)\n💡 3 AÇÕES PRÁTICAS\nSeja direto e específico.`,
          messages:[{role:'user',content:`Período: ${periodo}\nMétricas: ${JSON.stringify(dados.metricas)}\nAnúncios: ${JSON.stringify(topAds)}`}]
        })
      });
      const d = await r.json();
      setAnalise(d.content?.[0]?.text||'Erro ao gerar análise');
    } catch(e) { setAnalise('Erro: '+e.message); }
    finally { setLoading(false); }
  }

  return (
    <div>
      {!loading && !analise && (
        <div style={{ background:'var(--surface-card)', borderRadius:'var(--radius-xl)', padding:32, textAlign:'center', boxShadow:'var(--shadow-sm)', border:'1px solid var(--border-subtle)' }}>
          <Icon name="sparkles" size={28} color="#FF5200" />
          <div style={{ fontSize:'var(--text-base)', color:'var(--text-secondary)', margin:'12px 0 20px', lineHeight:1.6 }}>
            Diagnóstico completo da conta com IA especializada em Mercado Livre
          </div>
          <Btn onClick={gerar} icon="sparkles">Gerar análise do dia</Btn>
        </div>
      )}
      {loading && (
        <div style={{ background:'var(--surface-card)', borderRadius:'var(--radius-xl)', padding:48, textAlign:'center', boxShadow:'var(--shadow-sm)' }}>
          <div style={{ fontSize:'var(--text-sm)', color:'var(--text-muted)' }}>Analisando sua conta...</div>
        </div>
      )}
      {analise && (
        <div style={{ background:'var(--surface-card)', borderRadius:'var(--radius-xl)', padding:'var(--layout-card-pad)', boxShadow:'var(--shadow-sm)', border:'1px solid var(--border-subtle)' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
            <div style={{ fontSize:'var(--text-xs)', fontWeight:700, color:'var(--text-muted)', letterSpacing:'var(--tracking-caps)', textTransform:'uppercase' }}>
              Diagnóstico · {new Date().toLocaleDateString('pt-BR')}
            </div>
            <Btn variant="secondary" size="sm" onClick={gerar} icon="refresh-cw">Reanalisar</Btn>
          </div>
          <div style={{ fontSize:'var(--text-base)', color:'var(--text-secondary)', lineHeight:1.8, whiteSpace:'pre-wrap' }}>{analise}</div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   MAIN APP (LOGADO)
   ════════════════════════════════════════════════════════════ */
function AppLogado({ user }) {
  const [view,   setView]   = useState('dashboard');
  const [periodo,setPeriodo]= useState('hoje');
  const [dados,  setDados]  = useState(null);
  const [loading,setLoading]= useState(true);
  const [err,    setErr]    = useState('');

  useEffect(() => { carregarDados(periodo); }, [periodo]);
  useEffect(() => { renderLucide(); }, [view, dados, loading]);

  async function carregarDados(p) {
    setLoading(true); setErr('');
    try {
      const fn = functions.httpsCallable('mlGetDados');
      const r  = await fn({ periodo: p });
      setDados({ ...r.data, hora: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) });
    } catch(e) { setErr('Erro ao carregar: '+e.message); }
    finally { setLoading(false); }
  }

  function handleSair() { auth.signOut(); }

  return (
    <div style={{ display:'flex', minHeight:'100vh', background:'var(--surface-page)' }}>
      {/* Sidebar */}
      <SidebarNav active={view} onSelect={setView} seller={dados?.seller} onSair={handleSair} />

      {/* Main */}
      <div style={{ marginLeft:'var(--layout-sidebar)', flex:1, display:'flex', flexDirection:'column', minHeight:'100vh' }}>
        <TopBar hora={dados?.hora} loading={loading} onRefresh={() => carregarDados(periodo)} />

        <main style={{ flex:1, padding:'var(--layout-page-gutter)', maxWidth:'var(--layout-max-content)' }}>
          {err && (
            <div style={{ background:'rgba(239,68,68,.1)', border:'1px solid rgba(239,68,68,.2)', borderRadius:'var(--radius-lg)', padding:'12px 16px', color:'#f87171', fontSize:'var(--text-sm)', marginBottom:16 }}>
              {err}
            </div>
          )}

          {view === 'dashboard' && (
            <ViewDashboard dados={dados} loading={loading} periodo={periodo} onPeriodo={p => { setPeriodo(p); }} />
          )}
          {view === 'pedidos' && (
            <div>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
                <div style={{ fontSize:'var(--text-lg)', fontWeight:700, color:'rgba(255,255,255,.85)' }}>Pedidos</div>
                <PeriodFilter value={periodo} onChange={setPeriodo} />
              </div>
              <TabelaPedidos pedidos={dados?.pedidos} loading={loading} />
            </div>
          )}
          {view === 'anuncios' && (
            <div>
              <div style={{ fontSize:'var(--text-lg)', fontWeight:700, color:'rgba(255,255,255,.85)', marginBottom:16 }}>Anúncios</div>
              <ViewAnuncios dados={dados} loading={loading} />
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   APP ROOT
   ════════════════════════════════════════════════════════════ */
function App() {
  const [user,     setUser]     = useState(undefined);
  const [mlOk,     setMlOk]     = useState(null);
  const [mlLoading,setMlLoading]= useState(false);

  useEffect(() => {
    return auth.onAuthStateChanged(async u => {
      setUser(u);
      if (u) {
        setMlLoading(true);
        try {
          const snap = await db.collection('users').doc(u.uid).collection('mlTokens').doc('main').get();
          if (snap.exists) {
            const d = snap.data();
            setMlOk((d.expires_at?.toMillis?.()||0) > Date.now()+60000);
          } else { setMlOk(false); }
        } catch { setMlOk(false); }
        finally { setMlLoading(false); }
      } else { setMlOk(null); }
    });
  }, []);

  useEffect(() => { renderLucide(); });

  if (user === undefined || mlLoading) return (
    <div style={{ display:'flex', height:'100vh', background:'#0D0D0D', alignItems:'center', justifyContent:'center' }}>
      <Wordmark size={24} dark />
    </div>
  );

  if (!user) return <TelaLogin />;
  if (!mlOk) return <TelaConectarML user={user} onConectado={() => setMlOk(true)} />;
  return <AppLogado user={user} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
