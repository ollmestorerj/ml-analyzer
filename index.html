<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Analyzer — RealEcom</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0D0D0D; color: #fff; font-family: Tahoma, Geneva, sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAv4knEI4IgKH6fRpr_3BuiuijvP2Ul2ms",
      authDomain: "calculadora-real-ecom.firebaseapp.com",
      projectId: "calculadora-real-ecom",
      storageBucket: "calculadora-real-ecom.firebasestorage.app",
      messagingSenderId: "845239286688",
      appId: "1:845239286688:web:71018a44cabee0025842c5"
    };
    firebase.initializeApp(firebaseConfig);
    const auth      = firebase.auth();
    const db        = firebase.firestore();
    const functions = firebase.app().functions('southamerica-east1');

    const ML_CLIENT_ID = '3936370948601703';
    const ML_REDIRECT  = 'https://ollmestorerj.github.io/ml-analyzer/';

    const BRL = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
    const NUM = v => new Intl.NumberFormat("pt-BR").format(v||0);
    const PCT = v => `${(v||0).toFixed(1)}%`;

    // Cores RealEcom
    const C = {
      bg:     "#0D0D0D",
      bg2:    "#111111",
      bgRoxo: "#0f0920",
      orange: "#FF5200",
      purple: "#6B0AC9",
      purple2:"#9333ea",
      text:   "#ffffff",
      muted:  "rgba(255,255,255,0.58)",
      dim:    "rgba(255,255,255,0.28)",
      border: "rgba(255,255,255,0.08)",
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── LOGO ─────────────────────────────────────────────────────
    const Logo = ({size=22}) => (
      <span style={{fontFamily:"Impact,sans-serif",fontSize:size,fontWeight:900,letterSpacing:-0.5}}>
        <span style={{color:C.purple2}}>real</span><span style={{color:C.orange}}>ecom</span>
      </span>
    );

    // ── PERIOD PILLS ─────────────────────────────────────────────
    const PERIODOS = [
      { id:"hoje",    label:"Hoje" },
      { id:"ontem",   label:"Ontem" },
      { id:"7d",      label:"7 dias" },
      { id:"30d",     label:"30 dias" },
      { id:"mes",     label:"Mês Atual" },
    ];

    function PeriodPill({active, onClick, children}) {
      return (
        <button onClick={onClick} style={{
          background: active ? C.orange : "transparent",
          border: `1px solid ${active ? C.orange : C.border}`,
          borderRadius: 50, padding: "5px 14px",
          color: active ? "#fff" : C.muted,
          cursor: "pointer", fontSize: 12, fontWeight: active ? 700 : 400,
          transition: "all .15s", whiteSpace: "nowrap",
        }}>{children}</button>
      );
    }

    // ── METRIC CARD ──────────────────────────────────────────────
    function MetricCard({label, value, sub, accent=C.orange, icon}) {
      return (
        <div style={{
          background: C.bg2, borderRadius: 10,
          border: `1px solid ${C.border}`,
          borderLeft: `3px solid ${accent}`,
          padding: "16px 18px",
        }}>
          <div style={{fontSize:11,color:C.dim,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>
            {icon} {label}
          </div>
          <div style={{fontFamily:"Impact,sans-serif",fontSize:26,color:C.text,letterSpacing:-0.5}}>{value}</div>
          {sub && <div style={{fontSize:11,color:C.muted,marginTop:4}}>{sub}</div>}
        </div>
      );
    }

    // ── TAB BUTTON ───────────────────────────────────────────────
    function TabBtn({active, onClick, children}) {
      return (
        <button onClick={onClick} style={{
          background:"transparent",
          borderBottom: `2px solid ${active ? C.orange : "transparent"}`,
          border:"none", borderRadius:0,
          padding:"10px 16px", color: active ? C.orange : C.muted,
          cursor:"pointer", fontSize:13, fontWeight: active ? 700 : 400,
          transition:"all .15s",
        }}>{children}</button>
      );
    }

    // ── LOADING ──────────────────────────────────────────────────
    const Load = ({msg="Carregando..."}) => (
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:C.bg}}>
        <div style={{textAlign:"center"}}>
          <Logo size={28} />
          <div style={{color:C.muted,fontSize:13,marginTop:16}}>{msg}</div>
        </div>
      </div>
    );

    // ── ERR BOX ──────────────────────────────────────────────────
    const ErrBox = ({msg}) => msg ? (
      <div style={{background:"#1a0a0a",border:"1px solid #FF520055",borderRadius:8,padding:"12px 16px",color:"#ff8866",fontSize:13,marginBottom:16}}>
        {msg}
      </div>
    ) : null;

    // ── TELA LOGIN ───────────────────────────────────────────────
    function TelaLogin() {
      const [email,setEmail]=useState(""); const [senha,setSenha]=useState("");
      const [loading,setLoading]=useState(false); const [err,setErr]=useState("");

      async function login() {
        if(!email||!senha){setErr("Preencha email e senha");return;}
        setLoading(true);setErr("");
        try { await auth.signInWithEmailAndPassword(email,senha); }
        catch(e) {
          const m={"auth/invalid-credential":"Email ou senha incorretos","auth/too-many-requests":"Muitas tentativas. Aguarde."};
          setErr(m[e.code]||e.message);
        } finally{setLoading(false);}
      }

      return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:C.bg,padding:24}}>
          <div style={{maxWidth:380,width:"100%"}}>
            {/* Logo + barra lateral */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:36}}>
              <Logo size={32} />
              <div style={{width:40,height:3,background:`linear-gradient(to right,${C.purple2},${C.orange})`,borderRadius:2,marginTop:10}}></div>
              <div style={{fontSize:12,color:C.dim,marginTop:10,letterSpacing:2,textTransform:"uppercase"}}>ML Analyzer</div>
            </div>

            <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:12,padding:24}}>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:11,color:C.dim,display:"block",marginBottom:6,letterSpacing:1,textTransform:"uppercase"}}>Email</label>
                <input type="email" placeholder="seu@email.com" value={email} onChange={e=>setEmail(e.target.value)}
                  style={{background:"#1a1a1a",border:`1px solid ${C.border}`,borderRadius:6,padding:"10px 14px",color:C.text,width:"100%",fontSize:14,outline:"none"}} />
              </div>
              <div style={{marginBottom:20}}>
                <label style={{fontSize:11,color:C.dim,display:"block",marginBottom:6,letterSpacing:1,textTransform:"uppercase"}}>Senha</label>
                <input type="password" placeholder="••••••••" value={senha} onChange={e=>setSenha(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&login()}
                  style={{background:"#1a1a1a",border:`1px solid ${C.border}`,borderRadius:6,padding:"10px 14px",color:C.text,width:"100%",fontSize:14,outline:"none"}} />
              </div>
              <ErrBox msg={err} />
              <button onClick={login} disabled={loading} style={{
                background:C.orange,color:"#fff",border:"none",borderRadius:6,
                padding:"12px 20px",fontWeight:700,cursor:"pointer",fontSize:15,width:"100%",
                opacity:loading?.7:1,fontFamily:"Tahoma,sans-serif",
              }}>{loading?"Entrando...":"Entrar"}</button>
              <div style={{textAlign:"center",marginTop:14,fontSize:11,color:C.dim}}>
                Mesmo login da Calculadora REAL
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── TELA CONECTAR ML ─────────────────────────────────────────
    function TelaConectarML({user, onConectado}) {
      const [conectando,setConectando]=useState(false);
      const [err,setErr]=useState("");

      useEffect(()=>{
        const p=new URLSearchParams(window.location.search);
        const code=p.get("code");
        if(code){ window.history.replaceState({},"",window.location.pathname); conectarComCode(code); }
      },[]);

      async function conectarComCode(code) {
        setConectando(true);setErr("");
        try {
          const fn=functions.httpsCallable("mlTokenExchange");
          const r=await fn({code});
          if(r.data.success) onConectado();
        } catch(e){setErr("Erro: "+(e.message||"Tente novamente"));setConectando(false);}
      }

      function abrirOAuth(){
        window.location.href=`https://auth.mercadolivre.com.br/authorization?response_type=code&client_id=${ML_CLIENT_ID}&redirect_uri=${encodeURIComponent(ML_REDIRECT)}`;
      }

      if(conectando) return <Load msg="Conectando sua conta do Mercado Livre..." />;

      return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:C.bg,padding:24}}>
          <div style={{maxWidth:440,width:"100%",textAlign:"center"}}>
            <Logo size={28} />
            <div style={{fontSize:20,fontWeight:700,color:C.text,margin:"20px 0 8px",fontFamily:"Georgia,serif"}}>Conectar Mercado Livre</div>
            <div style={{fontSize:13,color:C.muted,marginBottom:28}}>
              Olá, <strong style={{color:C.text}}>{user.email?.split("@")[0]}</strong>. Autorize o acesso à sua conta.
            </div>
            <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:12,padding:24}}>
              <div style={{fontSize:13,color:C.muted,marginBottom:20,lineHeight:1.6}}>
                Clique abaixo — você será redirecionado ao Mercado Livre e voltará automaticamente.
              </div>
              <ErrBox msg={err} />
              <button onClick={abrirOAuth} style={{
                background:C.orange,color:"#fff",border:"none",borderRadius:6,
                padding:"14px 20px",fontWeight:700,cursor:"pointer",fontSize:15,width:"100%",fontFamily:"Tahoma,sans-serif",
              }}>Autorizar com Mercado Livre</button>
              <div style={{marginTop:14,textAlign:"right"}}>
                <button onClick={()=>auth.signOut()} style={{background:"transparent",border:"none",color:C.dim,cursor:"pointer",fontSize:12}}>Sair</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── DASHBOARD ────────────────────────────────────────────────
    function Dashboard({user, onSair}) {
      const [dados,      setDados]      = useState(null);
      const [loading,    setLoading]    = useState(true);
      const [err,        setErr]        = useState("");
      const [periodo,    setPeriodo]    = useState("hoje");
      const [tab,        setTab]        = useState("vendas");
      const [analise,    setAnalise]    = useState("");
      const [analisando, setAnalisando] = useState(false);

      useEffect(()=>{ carregarDados(periodo); },[periodo]);

      async function carregarDados(p) {
        setLoading(true);setErr("");
        try {
          const fn=functions.httpsCallable("mlGetDados");
          const r=await fn({periodo:p});
          setDados({...r.data, hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});
        } catch(e){setErr("Erro: "+e.message);}
        finally{setLoading(false);}
      }

      async function gerarAnalise() {
        if(!dados)return;
        setAnalisando(true);setAnalise("");setTab("ia");
        try {
          const r=await fetch("https://api.anthropic.com/v1/messages",{
            method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
              model:"claude-sonnet-4-6",max_tokens:1000,
              system:`Você é especialista em Mercado Livre. Analise os dados e entregue:
🎯 DIAGNÓSTICO (pontos fortes e de atenção)
🔥 TOP 3 ANÚNCIOS PARA FOCAR (com razão)
⚠️ ALERTAS (estoque crítico, sem visitas)
💡 3 AÇÕES PARA AMANHÃ
Seja direto e específico.`,
              messages:[{role:"user",content:`Período: ${periodo}\nMétricas: ${JSON.stringify(dados.metricas)}\nPedidos: ${JSON.stringify(dados.pedidos?.slice(0,10))}\nAnúncios: ${JSON.stringify(dados.anuncios?.slice(0,10))}`}]
            })
          });
          const d=await r.json();
          setAnalise(d.content?.[0]?.text||"Erro ao gerar análise");
        } catch(e){setAnalise("Erro: "+e.message);}
        finally{setAnalisando(false);}
      }

      const m = dados?.metricas || {};

      return (
        <div style={{minHeight:"100vh",background:C.bg}}>
          {/* HEADER */}
          <div style={{background:C.bg2,borderBottom:`1px solid ${C.border}`,padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,position:"sticky",top:0,zIndex:20}}>
            <div style={{display:"flex",alignItems:"center",gap:16}}>
              <Logo size={20} />
              <div style={{width:1,height:24,background:C.border}}></div>
              {/* Barra lateral acento estilo RealEcom */}
              <div style={{fontSize:11,color:C.dim,letterSpacing:1,textTransform:"uppercase"}}>
                {dados?.seller?.nickname || user.email?.split("@")[0]}
              </div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {loading&&<span style={{fontSize:11,color:C.dim}}>atualizando...</span>}
              <button onClick={()=>carregarDados(periodo)} disabled={loading} style={{
                background:"transparent",border:`1px solid ${C.border}`,borderRadius:6,
                padding:"5px 12px",color:C.muted,cursor:"pointer",fontSize:12,
              }}>↻</button>
              <button onClick={onSair} style={{background:"transparent",border:"none",color:C.dim,cursor:"pointer",fontSize:12}}>
                Sair
              </button>
            </div>
          </div>

          <div style={{padding:"20px 24px",maxWidth:1200,margin:"0 auto"}}>
            <ErrBox msg={err} />

            {/* FATURAMENTO HERO */}
            <div style={{background:C.bg2,borderRadius:12,border:`1px solid ${C.border}`,borderLeft:`4px solid ${C.orange}`,padding:"20px 24px",marginBottom:16}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:16}}>
                <div>
                  <div style={{fontSize:11,color:C.dim,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Faturamento</div>
                  <div style={{fontFamily:"Impact,sans-serif",fontSize:42,color:C.text,letterSpacing:-1}}>{BRL(m.fat)}</div>
                  <div style={{fontSize:13,color:C.muted,marginTop:4}}>{m.pedidosDia||0} pedidos · {m.qtd||0} unidades</div>
                </div>
                {/* Filtros de período */}
                <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"flex-start"}}>
                  {PERIODOS.map(p=>(
                    <PeriodPill key={p.id} active={periodo===p.id} onClick={()=>setPeriodo(p.id)}>
                      {p.label}
                    </PeriodPill>
                  ))}
                </div>
              </div>
              <div style={{fontSize:11,color:C.dim,marginTop:12}}>
                Última atualização: {dados?.hora||"—"} · {new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}
              </div>
            </div>

            {/* CARDS DE MÉTRICAS */}
            {dados && (
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10,marginBottom:20}}>
                <MetricCard label="Vendas" value={NUM(m.pedidosDia)} sub={`${m.qtd||0} unidades`} accent={C.orange} icon="🛍️" />
                <MetricCard label="Ticket Médio" value={BRL(m.pedidosDia>0?m.fat/m.pedidosDia:0)} accent={C.purple} icon="🏷️" />
                <MetricCard label="Tarifas ML" value={BRL(m.tarifas)} sub={PCT(m.fat>0?(m.tarifas/m.fat)*100:0)} accent={C.orange} icon="📊" />
                <MetricCard label="Frete Vendedor" value={BRL(m.frete)} sub={PCT(m.fat>0?(m.frete/m.fat)*100:0)} accent={C.purple} icon="🚚" />
                <MetricCard label="Anúncios Ativos" value={NUM(m.totalAds)} accent={C.orange} icon="📦" />
                <MetricCard label="Canceladas" value={NUM(m.canceladas||0)} accent="#555" icon="❌" />
              </div>
            )}

            {/* TABS */}
            <div style={{display:"flex",gap:0,borderBottom:`1px solid ${C.border}`,marginBottom:20}}>
              <TabBtn active={tab==="vendas"} onClick={()=>setTab("vendas")}>Pedidos</TabBtn>
              <TabBtn active={tab==="anuncios"} onClick={()=>setTab("anuncios")}>Anúncios</TabBtn>
              <TabBtn active={tab==="ia"} onClick={()=>setTab("ia")}>Análise IA</TabBtn>
            </div>

            {/* TAB: PEDIDOS */}
            {tab==="vendas" && (
              <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
                {/* Header tabela */}
                <div style={{display:"grid",gridTemplateColumns:"56px 1fr 90px 50px 100px 100px 100px",gap:8,padding:"10px 16px",borderBottom:`1px solid ${C.border}`,background:"#161616"}}>
                  {["Foto","Título","Data","Qtde","Valor","Tarifa","Frete"].map(h=>(
                    <div key={h} style={{fontSize:10,color:C.dim,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{h}</div>
                  ))}
                </div>
                {/* Linhas */}
                {dados?.pedidos?.length > 0 ? dados.pedidos.map((p,i)=>(
                  <div key={p.id||i} style={{
                    display:"grid",gridTemplateColumns:"56px 1fr 90px 50px 100px 100px 100px",
                    gap:8,padding:"12px 16px",
                    borderBottom:`1px solid ${C.border}`,
                    background:i%2===0?C.bg2:"#131313",
                    alignItems:"center",
                  }}>
                    <div style={{width:48,height:48,borderRadius:6,overflow:"hidden",background:"#1a1a1a",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
                      {p.foto ? <img src={p.foto} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} /> : "📦"}
                    </div>
                    <div>
                      <div style={{fontSize:12,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:500}}>{p.titulo}</div>
                      <div style={{fontSize:11,color:C.dim,marginTop:2}}>{p.sku||"—"}</div>
                    </div>
                    <div style={{fontSize:11,color:C.muted}}>{p.data}</div>
                    <div style={{fontSize:13,color:C.text,fontFamily:"Impact,sans-serif"}}>{p.qtde}</div>
                    <div style={{fontSize:13,color:C.orange,fontFamily:"Impact,sans-serif"}}>{BRL(p.valor)}</div>
                    <div style={{fontSize:12,color:C.muted}}>{BRL(p.tarifa)}</div>
                    <div style={{fontSize:12,color:C.muted}}>{BRL(p.frete)}</div>
                  </div>
                )) : (
                  <div style={{padding:48,textAlign:"center",color:C.dim}}>
                    {loading ? "Carregando pedidos..." : "Nenhum pedido no período"}
                  </div>
                )}
              </div>
            )}

            {/* TAB: ANÚNCIOS */}
            {tab==="anuncios" && (
              <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"56px 1fr 80px 80px 80px 80px",gap:8,padding:"10px 16px",borderBottom:`1px solid ${C.border}`,background:"#161616"}}>
                  {["Foto","Título","Preço","Estoque","Visitas","Vendas"].map(h=>(
                    <div key={h} style={{fontSize:10,color:C.dim,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{h}</div>
                  ))}
                </div>
                {dados?.anuncios?.map((a,i)=>(
                  <div key={a.id} style={{
                    display:"grid",gridTemplateColumns:"56px 1fr 80px 80px 80px 80px",
                    gap:8,padding:"12px 16px",
                    borderBottom:`1px solid ${C.border}`,
                    background:i%2===0?C.bg2:"#131313",
                    alignItems:"center",
                  }}>
                    <div style={{width:48,height:48,borderRadius:6,overflow:"hidden",background:"#1a1a1a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
                      {a.foto ? <img src={a.foto} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} /> : "📦"}
                    </div>
                    <div>
                      <div style={{fontSize:12,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.titulo}</div>
                      <div style={{fontSize:11,color:a.status==="active"?"#22c55e":"#ef4444",marginTop:2}}>{a.status==="active"?"● Ativo":"● Inativo"}</div>
                    </div>
                    <div style={{fontSize:13,color:C.orange,fontFamily:"Impact,sans-serif"}}>{BRL(a.preco)}</div>
                    <div style={{fontSize:13,color:a.estoque<=3?"#ef4444":C.text,fontFamily:"Impact,sans-serif"}}>{a.estoque}</div>
                    <div style={{fontSize:13,color:a.visitas>0?"#FFE600":C.dim,fontFamily:"Impact,sans-serif"}}>{NUM(a.visitas)}</div>
                    <div style={{fontSize:13,color:C.muted,fontFamily:"Impact,sans-serif"}}>{NUM(a.vendas)}</div>
                  </div>
                ))}
                {(!dados?.anuncios||dados.anuncios.length===0)&&(
                  <div style={{padding:48,textAlign:"center",color:C.dim}}>Sem anúncios ativos</div>
                )}
              </div>
            )}

            {/* TAB: ANÁLISE IA */}
            {tab==="ia" && (
              <div>
                {!analisando && !analise && (
                  <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:10,padding:32,textAlign:"center"}}>
                    <div style={{fontFamily:"Georgia,serif",fontSize:16,color:C.muted,marginBottom:20,lineHeight:1.6}}>
                      Diagnóstico completo da sua conta com IA especializada em Mercado Livre
                    </div>
                    <button onClick={gerarAnalise} style={{
                      background:C.orange,color:"#fff",border:"none",borderRadius:6,
                      padding:"12px 32px",fontWeight:700,cursor:"pointer",fontSize:15,fontFamily:"Tahoma,sans-serif",
                    }}>Gerar Análise do Dia</button>
                  </div>
                )}
                {analisando && (
                  <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:10,padding:48,textAlign:"center",color:C.muted}}>
                    Analisando sua conta...
                  </div>
                )}
                {analise && (
                  <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderLeft:`4px solid ${C.purple}`,borderRadius:10,padding:24}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
                      <div style={{fontSize:11,color:C.dim,letterSpacing:1,textTransform:"uppercase"}}>
                        Diagnóstico · {new Date().toLocaleDateString("pt-BR")}
                      </div>
                      <button onClick={gerarAnalise} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:6,padding:"4px 12px",color:C.muted,cursor:"pointer",fontSize:11}}>
                        Reanalisar
                      </button>
                    </div>
                    <div style={{fontFamily:"Georgia,serif",fontSize:14,color:C.muted,lineHeight:1.9,whiteSpace:"pre-wrap"}}>{analise}</div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── APP ROOT ─────────────────────────────────────────────────
    function App() {
      const [user,setUser]=useState(undefined);
      const [mlOk,setMlOk]=useState(null);
      const [mlLoading,setMlLoading]=useState(false);

      useEffect(()=>{
        return auth.onAuthStateChanged(async u=>{
          setUser(u);
          if(u){
            setMlLoading(true);
            try {
              const snap=await db.collection("users").doc(u.uid).collection("mlTokens").doc("main").get();
              if(snap.exists){
                const d=snap.data();
                setMlOk((d.expires_at?.toMillis?.()||0)>Date.now()+60000);
              } else { setMlOk(false); }
            } catch{setMlOk(false);}
            finally{setMlLoading(false);}
          } else{setMlOk(null);}
        });
      },[]);

      if(user===undefined||mlLoading) return <Load />;
      if(!user) return <TelaLogin />;
      if(!mlOk) return <TelaConectarML user={user} onConectado={()=>setMlOk(true)} />;

      return <Dashboard user={user} onSair={()=>{setMlOk(null);auth.signOut();}} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
