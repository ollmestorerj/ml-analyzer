--page:#111111;--sidebar:#0D0D0D;--card:#FFFFFF;--sunken:#F7F7F7;--hover:rgba(0,0,0,.04);

--sh-sm:0 1px 2px rgba(0,0,0,.04),0 2px 6px -2px rgba(0,0,0,.06);

--sidebar-w:248px;--topbar-h:64px;--gutter:24px;--gap:16px;--pad:20px;

<script>
const firebaseConfig={apiKey:"AIzaSyAv4knEI4IgKH6fRpr_3BuiuijvP2Ul2ms",authDomain:"calculadora-real-ecom.firebaseapp.com",projectId:"calculadora-real-ecom",storageBucket:"calculadora-real-ecom.firebasestorage.app",messagingSenderId:"845239286688",appId:"1:845239286688:web:71018a44cabee0025842c5"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),functions=firebase.app().functions('southamerica-east1');
const ML_CLIENT_ID='3936370948601703',ML_REDIRECT='https://ollmestorerj.github.io/ml-analyzer/';

<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

/* ══ DS PRIMITIVES ══════════════════════════════════════════ */
const Wordmark=({size=18,dark=true})=>(
  <span style={{fontFamily:'Anton,sans-serif',fontSize:size,letterSpacing:-.3,userSelect:'none',lineHeight:1}}>
    <span style={{color:dark?'#fff':'#9333ea'}}>real</span><span style={{color:'#FF5200'}}>ecom</span>
  </span>
);

const Icon=({name,size=18,color='currentColor'})=>{
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.lucide)return;
    ref.current.innerHTML='';
    const el=document.createElement('i');el.setAttribute('data-lucide',name);
    ref.current.appendChild(el);
    try{lucide.createIcons({nodes:[el]});}catch{}
    const s=ref.current.querySelector('svg');
    if(s){s.setAttribute('width',size);s.setAttribute('height',size);s.style.color=color;s.style.display='block';}
  },[name,size,color]);
  return <span ref={ref} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size,flexShrink:0}}/>;
};

const Badge=({children,tone='default',pill})=>{
  const t={default:{bg:'rgba(0,0,0,.06)',c:'#4B4B4B'},success:{bg:'var(--green-bg)',c:'var(--green)'},
    danger:{bg:'var(--red-bg)',c:'var(--red)'},warning:{bg:'var(--amber-bg)',c:'var(--amber)'},
    brand:{bg:'rgba(255,82,0,.12)',c:'var(--orange)'},purple:{bg:'rgba(123,46,204,.12)',c:'var(--purple)'}}[tone];
  return <span style={{display:'inline-flex',alignItems:'center',gap:4,background:t.bg,color:t.c,fontSize:11,fontWeight:700,padding:pill?'3px 10px':'2px 7px',borderRadius:pill?999:6,whiteSpace:'nowrap'}}>{children}</span>;
};

const Btn=({children,variant='primary',size='md',onClick,disabled,full,icon,style={}})=>{
  const v={primary:{background:'var(--orange)',color:'#fff',border:'none'},
    secondary:{background:'transparent',color:'var(--txt)',border:'1px solid var(--bd2)'},
    dark:{background:'transparent',color:'rgba(255,255,255,.6)',border:'1px solid rgba(255,255,255,.12)'},
    ghost:{background:'transparent',color:'var(--txt2)',border:'none'}}[variant];
  const s={sm:{h:32,px:12,fs:12},md:{h:40,px:16,fs:13},lg:{h:46,px:20,fs:15}}[size];
  return <button onClick={onClick} disabled={disabled} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,height:s.h,padding:`0 ${s.px}px`,borderRadius:'var(--r-md)',fontSize:s.fs,fontWeight:700,fontFamily:'var(--f-sans)',cursor:disabled?'not-allowed':'pointer',width:full?'100%':'auto',opacity:disabled?.55:1,transition:'var(--tr)',...v,...style}}>
    {icon&&<Icon name={icon} size={s.fs+2}/>}{children}</button>;
};

const Skel=({w='100%',h=16,r=6})=>(
  <div style={{width:w,height:h,borderRadius:r,background:'linear-gradient(90deg,#f0f0f0 25%,#e4e4e4 50%,#f0f0f0 75%)',backgroundSize:'200% 100%',animation:'shimmer 1.4s infinite'}}/>
);

const StatCard=({label,value,caption,delta,tone,icon,accent='brand'})=>{
  const ac={brand:'var(--orange)',accent:'var(--purple)',success:'var(--green)',danger:'var(--red)',amber:'var(--amber)'}[accent];
  return (
    <div style={{background:'var(--card)',border:'1px solid var(--bd)',borderRadius:'var(--r-xl)',boxShadow:'var(--sh-sm)',padding:'var(--pad)',display:'flex',flexDirection:'column',gap:10,minWidth:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
        <span style={{fontSize:11,fontWeight:700,color:'var(--txt3)',letterSpacing:'.06em'}}>{label}</span>
        {icon&&<span style={{width:28,height:28,borderRadius:'var(--r-sm)',background:'var(--sunken)',display:'inline-flex',alignItems:'center',justifyContent:'center'}}><Icon name={icon} size={14} color={ac}/></span>}
      </div>
      <div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}>
        <span className="tab" style={{fontSize:26,fontWeight:800,letterSpacing:'-.01em',color:tone==='danger'?'var(--red)':tone==='success'?'var(--green)':'var(--txt)'}}>{value}</span>
        {delta&&<span style={{fontSize:11,fontWeight:700,color:'var(--txt3)'}}>{delta}</span>}
      </div>
      {caption&&<span style={{fontSize:11,color:'var(--txt3)',lineHeight:1.4}}>{caption}</span>}
    </div>
  );
};

/* ══ FILTROS ════════════════════════════════════════════════ */
const PERIODOS=['hoje','ontem','7d','30d','mes'];
const PLABEL={hoje:'Hoje',ontem:'Ontem','7d':'7 dias','30d':'30 dias',mes:'Mês atual'};

const PeriodFilter=({value,onChange})=>(
  <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
    {PERIODOS.map(p=>(
      <button key={p} onClick={()=>onChange(p)} style={{height:30,padding:'0 13px',borderRadius:'var(--r-pill)',fontSize:11,fontWeight:700,cursor:'pointer',transition:'var(--tr)',fontFamily:'var(--f-sans)',
        background:value===p?'var(--orange)':'transparent',color:value===p?'#fff':'rgba(255,255,255,.55)',
        border:`1px solid ${value===p?'var(--orange)':'rgba(255,255,255,.14)'}`}}>{PLABEL[p]}</button>
    ))}
  </div>
);

const ContaFilter=({contas,ativas,onToggle})=>{
  if(!contas||contas.length<2)return null;
  return (
    <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
      {contas.map(c=>{
        const on=ativas.includes(c.id);
        return <button key={c.id} onClick={()=>onToggle(c.id)} style={{display:'inline-flex',alignItems:'center',gap:6,height:30,padding:'0 12px',borderRadius:'var(--r-pill)',cursor:'pointer',fontSize:11,fontWeight:700,fontFamily:'var(--f-sans)',
          background:on?'rgba(255,255,255,.1)':'transparent',border:`1px solid ${on?'var(--orange)':'rgba(255,255,255,.14)'}`,color:on?'#fff':'rgba(255,255,255,.45)',transition:'var(--tr)'}}>
          <Icon name="store" size={12}/>{c.nickname}</button>;
      })}
    </div>
  );
};

/* ══ LOGIN ══════════════════════════════════════════════════ */
function TelaLogin(){
  const [email,setEmail]=useState(''),[senha,setSenha]=useState('');
  const [loading,setLoading]=useState(false),[err,setErr]=useState('');
  async function login(){
    if(!email||!senha){setErr('Preencha email e senha');return;}
    setLoading(true);setErr('');
    try{await auth.signInWithEmailAndPassword(email,senha);}
    catch(e){setErr({'auth/invalid-credential':'Email ou senha incorretos','auth/too-many-requests':'Muitas tentativas. Aguarde.'}[e.code]||e.message);}
    finally{setLoading(false);}
  }
  return (
    <div style={{display:'flex',height:'100vh',background:'var(--sidebar)',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{width:'100%',maxWidth:360}}>
        <div style={{textAlign:'center',marginBottom:34}}>
          <Wordmark size={30}/>
          <div style={{width:36,height:3,background:'linear-gradient(90deg,#9333ea,#FF5200)',borderRadius:2,margin:'12px auto'}}/>
          <div style={{fontSize:11,color:'var(--txt-dark3)',letterSpacing:'.12em',fontWeight:700}}>ML ANALYZER</div>
        </div>
        <div style={{background:'#1a1a1a',border:'1px solid var(--bd-dark)',borderRadius:'var(--r-xl)',padding:24}}>
          {[['Email','email',email,setEmail,'seu@email.com'],['Senha','password',senha,setSenha,'••••••••']].map(([lbl,type,val,set,ph],i)=>(
            <div key={lbl} style={{marginBottom:i===0?14:20}}>
              <label style={{fontSize:10,fontWeight:700,color:'var(--txt-dark3)',display:'block',marginBottom:6,letterSpacing:'.08em'}}>{lbl.toUpperCase()}</label>
              <input type={type} placeholder={ph} value={val} onChange={e=>set(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()}
                style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:'var(--r-md)',padding:'11px 14px',color:'#fff',width:'100%',fontSize:14,fontFamily:'var(--f-sans)'}}/>
            </div>
          ))}
          {err&&<div style={{background:'var(--red-bg)',border:'1px solid rgba(239,68,68,.25)',borderRadius:'var(--r-md)',padding:'10px 14px',color:'#f87171',fontSize:13,marginBottom:14}}>{err}</div>}
          <Btn full size="lg" onClick={login} disabled={loading}>{loading?'Entrando...':'Entrar'}</Btn>
          <div style={{textAlign:'center',marginTop:14,fontSize:11,color:'var(--txt-dark3)'}}>Mesmo login da Calculadora REAL</div>
        </div>
      </div>
    </div>
  );
}

/* ══ CONECTAR ML ════════════════════════════════════════════ */

  const go=()=>{window.location.href=`https://auth.mercadolivre.com.br/authorization?response_type=code&client_id=${ML_CLIENT_ID}&redirect_uri=${encodeURIComponent(ML_REDIRECT)}`};
  return (
    <div style={{display:'flex',height:'100vh',background:'var(--sidebar)',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{width:'100%',maxWidth:420,textAlign:'center'}}>
        <Wordmark size={24}/>
        <div style={{fontSize:20,fontWeight:700,color:'#fff',margin:'20px 0 8px'}}>Conectar Mercado Livre</div>
        <div style={{fontSize:13,color:'var(--txt-dark2)',marginBottom:26}}>Olá, <strong style={{color:'#fff'}}>{user.email?.split('@')[0]}</strong>. Autorize o acesso à sua conta.</div>
        <div style={{background:'#1a1a1a',border:'1px solid var(--bd-dark)',borderRadius:'var(--r-xl)',padding:24}}>
          <div style={{fontSize:13,color:'var(--txt-dark2)',marginBottom:20,lineHeight:1.6}}>Você será redirecionado ao Mercado Livre e voltará automaticamente.</div>
          {err&&<div style={{background:'var(--red-bg)',border:'1px solid rgba(239,68,68,.25)',borderRadius:'var(--r-md)',padding:'10px 14px',color:'#f87171',fontSize:13,marginBottom:14}}>{err}</div>}
          <Btn full size="lg" onClick={go}>Autorizar com Mercado Livre</Btn>
          <button onClick={()=>auth.signOut()} style={{background:'none',border:'none',color:'var(--txt-dark3)',cursor:'pointer',fontSize:12,marginTop:14}}>Sair</button>
        </div>
      </div>

  );
}

/* ══ EXIBIÇÃO DE CUSTO (somente leitura) ════════════════════ */
function CustoDisplay({valor,onIrParaAnuncios}){
  if(!valor) return (
    <button onClick={onIrParaAnuncios} title="Cadastrar custo em Anúncios"
      style={{display:'inline-flex',alignItems:'center',gap:4,background:'transparent',border:'none',cursor:'pointer',padding:0,fontFamily:'var(--f-sans)'}}>
      <span style={{fontSize:11,color:'var(--amber)',fontWeight:700}}>definir</span>
      <Icon name="pencil" size={10} color="var(--amber)"/>
    </button>
  );
  return <span className="tab" style={{fontSize:12.5,fontWeight:600,color:'var(--txt)'}}>{BRL(valor)}</span>;
}

/* ══ TABELA DE PEDIDOS ══════════════════════════════════════ */
function TabelaPedidos({pedidos,loading,multiConta,onRefresh,onIrParaAnuncios}){
  const GRID=multiConta
    ? '48px 1fr 74px 88px 84px 42px 88px 76px 76px 72px 100px'
    : '48px 1fr 74px 88px 42px 88px 76px 76px 72px 100px';
  const HEADS=multiConta
    ? ['','Título','Conta','SKU','Data','Qtd','Valor','Tarifa','Frete','Custo','Lucro']
    : ['','Título','SKU','Data','Qtd','Valor','Tarifa','Frete','Custo','Lucro'];

  if(loading)return (
    <div style={{background:'var(--card)',borderRadius:'var(--r-xl)',border:'1px solid var(--bd)',overflow:'hidden',boxShadow:'var(--sh-sm)'}}>
      {[...Array(5)].map((_,i)=>(
        <div key={i} style={{padding:'14px 18px',borderBottom:'1px solid var(--bd)',display:'flex',gap:12,alignItems:'center'}}>
          <Skel w={44} h={44} r={8}/>
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:7}}><Skel h={13}/><Skel w="35%" h={10}/></div>
          <Skel w={70} h={24}/><Skel w={70} h={24}/>
        </div>
      ))}
    </div>
  );

  return (
    <div style={{background:'var(--card)',borderRadius:'var(--r-xl)',border:'1px solid var(--bd)',overflow:'auto',boxShadow:'var(--sh-sm)'}}>
      <div style={{minWidth:multiConta?1000:920}}>
        <div style={{display:'grid',gridTemplateColumns:GRID,gap:7,padding:'10px 18px',background:'var(--sunken)',borderBottom:'1px solid var(--bd)',position:'sticky',top:0,zIndex:2}}>
          {HEADS.map((h,i)=><div key={i} style={{fontSize:10,fontWeight:800,color:'var(--txt3)',letterSpacing:'.08em',textTransform:'uppercase'}}>{h}</div>)}
        </div>
        {pedidos?.length>0?pedidos.map((p,i)=>(
          <div key={p.id||i} style={{display:'grid',gridTemplateColumns:GRID,gap:7,padding:'11px 18px',alignItems:'center',borderBottom:'1px solid var(--bd)',background:i%2?'var(--sunken)':'var(--card)'}}>
            <div style={{width:44,height:44,borderRadius:8,overflow:'hidden',background:'var(--sunken)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>
              {p.foto?<img src={p.foto} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:'📦'}
            </div>
            <div style={{minWidth:0}}>
              <div style={{fontSize:12.5,fontWeight:600,color:'var(--txt)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={p.titulo}>{p.titulo}</div>
            </div>
            {multiConta&&<div style={{fontSize:11,color:'var(--txt2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.conta}</div>}
            <div style={{fontSize:10.5,color:'var(--txt3)',fontFamily:'var(--f-mono)',overflow:'hidden',textOverflow:'ellipsis'}}>{p.sku}</div>
            <div style={{fontSize:11,color:'var(--txt2)'}}>{p.data}</div>
            <div className="tab" style={{fontSize:12.5,fontWeight:700}}>{p.qtde}</div>
            <div className="tab" style={{fontSize:12.5,fontWeight:700,color:'var(--orange)'}}>{BRL(p.valor)}</div>
            <div className="tab" style={{fontSize:12,color:'var(--txt2)'}}>{BRL(p.tarifa)}</div>
            <div className="tab" style={{fontSize:12,color:'var(--txt2)'}}>{BRL(p.frete)}</div>
            <div><CustoDisplay valor={p.custo} onIrParaAnuncios={onIrParaAnuncios}/></div>
            <div style={{display:'flex',flexDirection:'column',gap:1}}>
              {p.temCusto?(
                <>
                  <span className="tab" style={{fontSize:12.5,fontWeight:800,color:p.lucro>=0?'var(--green)':'var(--red)'}}>{BRL(p.lucro)}</span>
                  <span className="tab" style={{fontSize:10,color:'var(--txt3)'}}>{PCT(p.margem)}</span>
                </>
              ):<Badge tone="warning">Sem custo</Badge>}
            </div>
          </div>
        )):(
          <div style={{padding:44,textAlign:'center'}}>
            <Icon name="package" size={30} color="rgba(0,0,0,.18)"/>
            <div style={{fontSize:13,color:'var(--txt3)',marginTop:10}}>Nenhum pedido no período</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══ PAINEL DE ADS ══════════════════════════════════════════ */
function PainelAds({ads,dataRef,onSalvo,periodoLabel}){
  const auto=ads?.fonte==='automatico';
  const [editing,setEditing]=useState(false);
  const [inv,setInv]=useState('');
  const [rec,setRec]=useState('');
  const [vnd,setVnd]=useState('');
  const [saving,setSaving]=useState(false);
  const [verCampanhas,setVerCampanhas]=useState(false);

  useEffect(()=>{
    setInv(ads?.investimento||'');setRec(ads?.receita||'');setVnd(ads?.vendas||'');
  },[ads]);

  async function salvar(){
    setSaving(true);
    try{
      await call('mlSalvarAds',{data:dataRef,investimento:parseFloat(inv)||0,receita:parseFloat(rec)||0,vendas:parseInt(vnd)||0});
      setEditing(false);onSalvo&&onSalvo();
    }catch(e){alert('Erro: '+e.message);}
    finally{setSaving(false);}
  }

  const cells=[
    {label:'INVESTIMENTO',value:BRL(ads?.investimento),accent:'amber'},
    {label:'RECEITA ADS',value:BRL(ads?.receita),accent:'success'},
    {label:'VENDAS',value:NUM(ads?.vendas)},
    {label:'ROAS',value:`${(ads?.roas||0).toFixed(2)}x`,accent:'accent'},
    {label:'ACOS',value:PCT(ads?.acos)},
    {label:'TACOS',value:PCT(ads?.tacos)},
  ];
  if(auto){
    cells.push({label:'CLIQUES',value:NUM(ads?.cliques)});
    cells.push({label:'IMPRESSÕES',value:NUM(ads?.impressoes)});
  }

  const semDados=!ads?.investimento&&!ads?.receita;

  return (
    <div style={{background:'var(--card)',borderRadius:'var(--r-xl)',border:'1px solid var(--bd)',boxShadow:'var(--sh-sm)',padding:'var(--pad)'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <Icon name="megaphone" size={16} color="var(--orange)"/>
          <span style={{fontSize:14,fontWeight:700}}>Publicidade</span>
          {auto
            ? <Badge tone="success">Automático</Badge>
            : <Badge tone="warning">Manual</Badge>}
          {auto&&ads?.contasSemAds>0&&(
            <span style={{fontSize:11,color:'var(--txt3)'}}>
              {ads.contasSemAds} {ads.contasSemAds===1?'conta sem Product Ads':'contas sem Product Ads'}
            </span>
          )}
        </div>
        <div style={{display:'flex',gap:6}}>
          {auto&&ads?.campanhas?.length>0&&(
            <Btn variant="secondary" size="sm" icon={verCampanhas?'chevron-up':'list'} onClick={()=>setVerCampanhas(v=>!v)}>
              {ads.campanhas.length} {ads.campanhas.length===1?'campanha':'campanhas'}
            </Btn>
          )}
          {!auto&&(!editing
            ? <Btn variant="secondary" size="sm" icon="pencil" onClick={()=>setEditing(true)}>Editar</Btn>
            : <>
                <Btn size="sm" onClick={salvar} disabled={saving}>{saving?'Salvando':'Salvar'}</Btn>
                <Btn variant="secondary" size="sm" onClick={()=>setEditing(false)}>Cancelar</Btn>
              </>)}
        </div>
      </div>

      {editing&&!auto?(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12}}>
          {[['Investimento R$',inv,setInv,'0.01'],['Receita R$',rec,setRec,'0.01'],['Vendas',vnd,setVnd,'1']].map(([lbl,v,set,step])=>(
            <div key={lbl}>
              <label style={{fontSize:10,fontWeight:700,color:'var(--txt3)',display:'block',marginBottom:5,letterSpacing:'.06em',textTransform:'uppercase'}}>{lbl}</label>
              <input type="number" step={step} value={v} onChange={e=>set(e.target.value)}
                style={{width:'100%',padding:'8px 10px',fontSize:13,border:'1px solid var(--bd2)',borderRadius:'var(--r-md)',fontFamily:'var(--f-mono)'}}/>
            </div>
          ))}
        </div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(104px,1fr))',gap:14}}>
          {cells.map(c=>(
            <div key={c.label}>
              <div style={{fontSize:10,fontWeight:700,color:'var(--txt3)',letterSpacing:'.06em',marginBottom:4}}>{c.label}</div>
              <div className="tab" style={{fontSize:18,fontWeight:800,color:c.accent==='success'?'var(--green)':c.accent==='amber'?'var(--amber)':c.accent==='accent'?'var(--purple)':'var(--txt)'}}>{c.value}</div>
            </div>
          ))}
        </div>
      )}

      {/* Lista de campanhas */}
      {auto&&verCampanhas&&ads.campanhas?.length>0&&(
        <div style={{marginTop:16,borderTop:'1px solid var(--bd)',paddingTop:14}}>
          {ads.campanhas.map(c=>{
            const roasC=c.investimento>0?c.receita/c.investimento:0;
            return (
              <div key={c.id} style={{display:'flex',alignItems:'center',gap:12,padding:'9px 0',borderBottom:'1px solid var(--bd)',flexWrap:'wrap'}}>
                <div style={{flex:'1 1 180px',minWidth:0}}>
                  <div style={{fontSize:12.5,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.nome}</div>
                  <Badge tone={c.status==='active'?'success':'default'}>{c.status==='active'?'Ativa':c.status}</Badge>
                </div>
                <div style={{textAlign:'right',minWidth:76}}>
                  <div style={{fontSize:9.5,color:'var(--txt3)',fontWeight:700}}>GASTO</div>
                  <div className="tab" style={{fontSize:13,fontWeight:700,color:'var(--amber)'}}>{BRL(c.investimento)}</div>
                </div>
                <div style={{textAlign:'right',minWidth:76}}>
                  <div style={{fontSize:9.5,color:'var(--txt3)',fontWeight:700}}>RECEITA</div>
                  <div className="tab" style={{fontSize:13,fontWeight:700,color:'var(--green)'}}>{BRL(c.receita)}</div>
                </div>
                <div style={{textAlign:'right',minWidth:52}}>
                  <div style={{fontSize:9.5,color:'var(--txt3)',fontWeight:700}}>ROAS</div>
                  <div className="tab" style={{fontSize:13,fontWeight:700,color:roasC>=3?'var(--green)':roasC>=1?'var(--txt)':'var(--red)'}}>{roasC.toFixed(2)}x</div>
                </div>
                <div style={{textAlign:'right',minWidth:44}}>
                  <div style={{fontSize:9.5,color:'var(--txt3)',fontWeight:700}}>VENDAS</div>
                  <div className="tab" style={{fontSize:13,fontWeight:700}}>{c.vendas}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Avisos */}
      {auto&&(
        <div style={{marginTop:13,padding:'9px 12px',background:'var(--sunken)',borderRadius:'var(--r-md)',fontSize:11,color:'var(--txt3)',lineHeight:1.5,display:'flex',gap:7,alignItems:'flex-start'}}>
          <Icon name="info" size={13} color="var(--txt3)"/>
          <span>Dados puxados direto do Product Ads. O Mercado Livre consolida as métricas por volta das 10h — números do dia atual podem mudar ao longo do dia.</span>
        </div>
      )}
      {!auto&&!editing&&(
        <div style={{marginTop:13,padding:'10px 12px',background:'var(--amber-bg)',borderRadius:'var(--r-md)',fontSize:11.5,color:'var(--txt2)',lineHeight:1.5,display:'flex',gap:7,alignItems:'flex-start'}}>
          <Icon name="alert-triangle" size={13} color="var(--amber)"/>
          <span>
            {semDados
              ? <>Não foi possível puxar o Product Ads automaticamente{ads?.motivo?` (${ads.motivo})`:''}. Verifique se a conta tem publicidade ativa em <strong>Mercado Livre → Meu perfil → Publicidade</strong>, ou informe os valores manualmente.</>
              : <>Valores informados manualmente para {periodoLabel?.toLowerCase()}.</>}
          </span>
        </div>
      )}
    </div>
  );
}

/* ══ VIEW: DASHBOARD ════════════════════════════════════════ */

    <div style={{display:'flex',flexDirection:'column',gap:'var(--gap)'}}>

        <div style={{display:'flex',gap:36,flexWrap:'wrap',flex:1,minWidth:220}}>
          <div>
            <div style={{fontSize:10,color:'var(--txt-dark3)',letterSpacing:'.1em',fontWeight:700}}>FATURAMENTO</div>
            {loading?<div style={{marginTop:6}}><Skel w={170} h={36}/></div>:(
              <div className="tab" style={{fontSize:38,fontWeight:800,color:'#fff',letterSpacing:'-.02em',marginTop:2,lineHeight:1.05}}>{BRL(m.fat)}</div>
            )}
            {!loading&&<div style={{fontSize:11,color:'var(--txt-dark3)',marginTop:5}}>{m.pedidosDia||0} pedidos · {m.qtd||0} unidades</div>}
          </div>
          <div>
            <div style={{fontSize:10,color:'var(--txt-dark3)',letterSpacing:'.1em',fontWeight:700}}>LUCRO</div>
            {loading?<div style={{marginTop:6}}><Skel w={130} h={30}/></div>:(
              <div style={{display:'flex',alignItems:'baseline',gap:8,marginTop:2}}>
                <span className="tab" style={{fontSize:30,fontWeight:800,color:(m.lucro||0)>=0?'#4ade80':'#f87171',letterSpacing:'-.01em',lineHeight:1.1}}>{BRL(m.lucro)}</span>
                <span className="tab" style={{fontSize:13,color:'var(--txt-dark2)',fontWeight:700}}>({PCT(m.margem)})</span>
              </div>
            )}
            {!loading&&m.semCusto>0&&(
              <div style={{fontSize:10.5,color:'#fbbf24',marginTop:5,display:'flex',alignItems:'center',gap:4}}>
                <Icon name="alert-triangle" size={11} color="#fbbf24"/>{m.semCusto} {m.semCusto===1?'venda sem custo':'vendas sem custo'}
              </div>
            )}
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:8,alignItems:'flex-end'}}>
          <ContaFilter contas={dados?.contas} ativas={contasAtivas} onToggle={toggleConta}/>
          <PeriodFilter value={periodo} onChange={setPeriodo}/>
        </div>
      </section>

      {/* KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(165px,1fr))',gap:'var(--gap)'}}>
        {loading?[...Array(4)].map((_,i)=>(
          <div key={i} style={{background:'var(--card)',borderRadius:'var(--r-xl)',padding:'var(--pad)',boxShadow:'var(--sh-sm)',display:'flex',flexDirection:'column',gap:11}}>
            <Skel w="55%" h={10}/><Skel h={26}/><Skel w="70%" h={10}/>
          </div>
        )):[
          {label:'VENDAS',value:NUM(m.pedidosDia),caption:`${m.qtd||0} unidades`,icon:'shopping-cart'},
          {label:'TICKET MÉDIO',value:BRL(m.ticketMedio),icon:'tag',accent:'accent'},
          {label:'LUCRO MÉDIO',value:BRL(m.pedidosDia>0?m.lucro/m.pedidosDia:0),icon:'trending-up',accent:'success',tone:(m.lucro||0)>=0?'success':'danger'},
          {label:'CANCELADAS',value:NUM(m.canceladas),caption:BRL(m.valorCancelado),icon:'x-circle',accent:'danger'},
        ].map(c=><StatCard key={c.label} {...c}/>)}
      </div>

      {/* COMPOSIÇÃO */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:'var(--gap)'}}>
        {loading?[...Array(4)].map((_,i)=>(
          <div key={i} style={{background:'var(--card)',borderRadius:'var(--r-xl)',padding:'var(--pad)',boxShadow:'var(--sh-sm)',display:'flex',flexDirection:'column',gap:11}}>
            <Skel w="50%" h={10}/><Skel h={24}/>

        )):[
          {label:'CUSTOS',value:BRL(m.custos),caption:m.fat>0?PCT(m.custos/m.fat*100):'—',icon:'box',accent:'amber'},
          {label:'TARIFAS ML',value:BRL(m.tarifas),caption:m.fat>0?PCT(m.tarifas/m.fat*100):'—',icon:'percent'},
          {label:'IMPOSTOS',value:BRL(m.impostos),caption:m.fat>0?PCT(m.impostos/m.fat*100):'—',icon:'landmark',accent:'accent'},
          {label:'FRETE',value:BRL(m.frete),caption:m.fat>0?PCT(m.frete/m.fat*100):'—',icon:'truck'},

      {/* ADS */}
      {!loading&&<PainelAds ads={ads} dataRef={m.from} onSalvo={onRefresh} periodoLabel={PLABEL[periodo]}/>}

      {/* PEDIDOS */}
      <div>

      </div>
    </div>
  );
}

/* ══ VIEW: ANÚNCIOS (edição em lote) ════════════════════════ */
function ViewAnuncios({dados,loading,onRefresh}){
  const [busca,setBusca]=useState('');
  const [rascunho,setRascunho]=useState({});   // {sku:{custo,imposto}}
  const [salvando,setSalvando]=useState(false);
  const [msg,setMsg]=useState('');
  const [soSemCusto,setSoSemCusto]=useState(false);
  const [impostoGlobal,setImpostoGlobal]=useState('');

  const todos=dados?.anuncios||[];
  const multiConta=(dados?.contasUsadas?.length||0)>1;

  // Reseta rascunho quando os dados recarregam
  useEffect(()=>{setRascunho({});setMsg('');},[dados]);

  const anuncios=todos.filter(a=>{
    if(soSemCusto){
      const r=rascunho[a.sku];
      const custoAtual=r?parseFloat(r.custo)||0:a.custo;
      if(custoAtual>0)return false;
    }
    if(!busca)return true;
    const q=busca.toLowerCase();
    return a.titulo.toLowerCase().includes(q)||String(a.sku).toLowerCase().includes(q);
  });

  // Valor atual de um campo: rascunho tem prioridade sobre o dado salvo
  const val=(a,campo)=>{
    const r=rascunho[a.sku];
    if(r&&r[campo]!==undefined)return r[campo];
    return a[campo]||'';
  };

  const setCampo=(sku,campo,v)=>{
    setRascunho(d=>({...d,[sku]:{...(d[sku]||{}),[campo]:v}}));
    setMsg('');
  };

  // Quantas linhas foram alteradas
  const alterados=Object.keys(rascunho).filter(sku=>{
    const a=todos.find(x=>String(x.sku)===String(sku));
    if(!a)return false;
    const r=rascunho[sku];
    const c=r.custo!==undefined?parseFloat(r.custo)||0:a.custo;
    const i=r.imposto!==undefined?parseFloat(r.imposto)||0:a.imposto;
    return c!==(a.custo||0)||i!==(a.imposto||0);
  });

  function aplicarImpostoTodos(){
    const v=parseFloat(impostoGlobal);
    if(isNaN(v)){setMsg('Digite uma porcentagem válida');return;}
    const novo={...rascunho};
    anuncios.forEach(a=>{novo[a.sku]={...(novo[a.sku]||{}),imposto:v};});
    setRascunho(novo);setMsg('');
  }

  async function salvarTudo(){
    if(alterados.length===0)return;
    setSalvando(true);setMsg('');
    try{
      const itens=alterados.map(sku=>{
        const a=todos.find(x=>String(x.sku)===String(sku));
        const r=rascunho[sku];
        return {
          sku,
          custo:   r.custo!==undefined?parseFloat(r.custo)||0:a.custo,
          imposto: r.imposto!==undefined?parseFloat(r.imposto)||0:a.imposto,
        };
      });
      await call('mlSalvarCustosLote',{itens});
      setMsg(`${itens.length} ${itens.length===1?'produto salvo':'produtos salvos'}`);
      setRascunho({});
      onRefresh();
    }catch(e){setMsg('Erro: '+e.message);}
    finally{setSalvando(false);}
  }

  const GRID=multiConta
    ? '52px 1fr 74px 84px 78px 58px 62px 96px 74px 92px'
    : '52px 1fr 84px 78px 58px 62px 96px 74px 92px';
  const HEADS=multiConta
    ? ['','Título','Conta','SKU','Preço','Est.','Visitas','Custo un.','Imp. %','Margem']
    : ['','Título','SKU','Preço','Est.','Visitas','Custo un.','Imp. %','Margem'];

  const inputStyle={width:'100%',padding:'6px 8px',fontSize:12,border:'1px solid var(--bd2)',borderRadius:'var(--r-sm)',fontFamily:'var(--f-mono)',background:'#fff'};

  if(loading)return (
    <div style={{display:'flex',flexDirection:'column',gap:6}}>
      {[...Array(6)].map((_,i)=>(
        <div key={i} style={{background:'var(--card)',borderRadius:'var(--r-lg)',padding:14,display:'flex',gap:12,alignItems:'center',boxShadow:'var(--sh-sm)'}}>
          <Skel w={48} h={48} r={9}/><div style={{flex:1,display:'flex',flexDirection:'column',gap:7}}><Skel h={13}/><Skel w="40%" h={10}/></div><Skel w={70} h={24}/>
        </div>
      ))}
    </div>
  );

  const semCustoTotal=todos.filter(a=>!a.custo).length;

  return (
    <div style={{paddingBottom:alterados.length>0?78:0}}>

      {/* Barra de ferramentas */}
      <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:14}}>
        <div style={{position:'relative',flex:'1 1 260px',maxWidth:360}}>
          <div style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>
            <Icon name="search" size={15} color="rgba(255,255,255,.35)"/>
          </div>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por título ou SKU..."
            style={{width:'100%',padding:'9px 12px 9px 36px',fontSize:13,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:'var(--r-md)',color:'#fff',fontFamily:'var(--f-sans)'}}/>
        </div>

        <button onClick={()=>setSoSemCusto(v=>!v)} style={{display:'inline-flex',alignItems:'center',gap:6,height:36,padding:'0 13px',borderRadius:'var(--r-md)',cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:'var(--f-sans)',
          background:soSemCusto?'rgba(245,158,11,.18)':'transparent',border:`1px solid ${soSemCusto?'var(--amber)':'rgba(255,255,255,.12)'}`,color:soSemCusto?'#fbbf24':'rgba(255,255,255,.55)'}}>
          <Icon name="alert-triangle" size={13}/>Sem custo ({semCustoTotal})
        </button>

        <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:'auto'}}>
          <input type="number" step="0.1" value={impostoGlobal} onChange={e=>setImpostoGlobal(e.target.value)} placeholder="Imposto %"
            style={{width:96,padding:'8px 10px',fontSize:12,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:'var(--r-md)',color:'#fff',fontFamily:'var(--f-mono)'}}/>
          <Btn variant="dark" size="sm" onClick={aplicarImpostoTodos}>Aplicar a todos</Btn>
        </div>
      </div>

      {/* Tabela */}
      <div style={{background:'var(--card)',borderRadius:'var(--r-xl)',border:'1px solid var(--bd)',overflow:'auto',boxShadow:'var(--sh-sm)'}}>
        <div style={{minWidth:multiConta?960:900}}>
          <div style={{display:'grid',gridTemplateColumns:GRID,gap:8,padding:'10px 18px',background:'var(--sunken)',borderBottom:'1px solid var(--bd)',position:'sticky',top:0,zIndex:2}}>
            {HEADS.map((h,i)=><div key={i} style={{fontSize:10,fontWeight:800,color:'var(--txt3)',letterSpacing:'.08em',textTransform:'uppercase'}}>{h}</div>)}
          </div>

          {anuncios.map((a,i)=>{
            const custoV=val(a,'custo'),impV=val(a,'imposto');
            const c=parseFloat(custoV)||0,imp=parseFloat(impV)||0;
            const editado=rascunho[a.sku]!==undefined;
            // margem estimada: preço - custo - imposto - ~13% tarifa média
            const tarifaEst=a.preco*0.13;
            const lucroEst=a.preco-c-(a.preco*imp/100)-tarifaEst;
            const margemEst=a.preco>0?(lucroEst/a.preco)*100:0;

            return (
              <div key={a.id} style={{display:'grid',gridTemplateColumns:GRID,gap:8,padding:'10px 18px',alignItems:'center',borderBottom:'1px solid var(--bd)',
                background:editado?'rgba(255,82,0,.05)':(i%2?'var(--sunken)':'var(--card)')}}>
                <div style={{width:48,height:48,borderRadius:9,overflow:'hidden',background:'var(--sunken)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:19}}>
                  {a.foto?<img src={a.foto} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:'📦'}
                </div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:12.5,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={a.titulo}>{a.titulo}</div>
                  <div style={{marginTop:3,display:'flex',gap:5,alignItems:'center'}}>
                    <Badge tone={a.status==='active'?'success':'danger'}>{a.status==='active'?'Ativo':'Inativo'}</Badge>
                    <span style={{fontSize:10.5,color:'var(--txt3)'}}>{NUM(a.vendas)} vendas</span>
                  </div>
                </div>
                {multiConta&&<div style={{fontSize:11,color:'var(--txt2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.conta}</div>}
                <div style={{fontSize:10.5,color:'var(--txt3)',fontFamily:'var(--f-mono)',overflow:'hidden',textOverflow:'ellipsis'}} title={a.sku}>{a.sku}</div>
                <div className="tab" style={{fontSize:12.5,fontWeight:700,color:'var(--orange)'}}>{BRL(a.preco)}</div>
                <div className="tab" style={{fontSize:12.5,fontWeight:700,color:a.estoque<=3?'var(--red)':'var(--txt)'}}>{a.estoque}</div>
                <div className="tab" style={{fontSize:12.5,fontWeight:700,color:a.visitas>0?'var(--amber)':'var(--txt3)'}}>{NUM(a.visitas)}</div>
                <div>
                  <input type="number" step="0.01" value={custoV} placeholder="0,00"
                    onChange={e=>setCampo(a.sku,'custo',e.target.value)} style={inputStyle}/>
                </div>
                <div>
                  <input type="number" step="0.1" value={impV} placeholder="0"
                    onChange={e=>setCampo(a.sku,'imposto',e.target.value)} style={inputStyle}/>
                </div>
                <div>
                  {c>0?(
                    <div style={{display:'flex',flexDirection:'column',gap:1}}>
                      <span className="tab" style={{fontSize:12.5,fontWeight:800,color:lucroEst>=0?'var(--green)':'var(--red)'}}>{BRL(lucroEst)}</span>
                      <span className="tab" style={{fontSize:10,color:'var(--txt3)'}}>{PCT(margemEst)}</span>
                    </div>
                  ):<span style={{fontSize:11,color:'var(--txt3)'}}>—</span>}
                </div>
              </div>
            );
          })}

          {anuncios.length===0&&(
            <div style={{padding:44,textAlign:'center'}}>
              <Icon name="package" size={30} color="rgba(0,0,0,.18)"/>
              <div style={{fontSize:13,color:'var(--txt3)',marginTop:10}}>{busca||soSemCusto?'Nenhum anúncio encontrado':'Nenhum anúncio ativo'}</div>
            </div>
          )}
        </div>
      </div>

      <div style={{fontSize:11,color:'var(--txt-dark3)',marginTop:10,lineHeight:1.5}}>
        A margem exibida é uma estimativa usando tarifa média de 13%. A margem real de cada venda aparece na tela de Pedidos.
      </div>

      {/* Barra fixa de salvar */}
      {alterados.length>0&&(
        <div style={{position:'fixed',bottom:0,left:0,right:0,background:'var(--sidebar)',borderTop:'1px solid var(--bd-dark)',padding:'14px var(--gutter)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,zIndex:50,boxShadow:'0 -4px 16px rgba(0,0,0,.3)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <Icon name="pencil" size={15} color="var(--orange)"/>
            <span style={{fontSize:13,fontWeight:700,color:'#fff'}}>
              {alterados.length} {alterados.length===1?'produto alterado':'produtos alterados'}
            </span>
            {msg&&<span style={{fontSize:12,color:msg.startsWith('Erro')?'#f87171':'#4ade80'}}>{msg}</span>}
          </div>
          <div style={{display:'flex',gap:8}}>
            <Btn variant="dark" size="md" onClick={()=>{setRascunho({});setMsg('');}}>Descartar</Btn>
            <Btn size="md" icon="check" onClick={salvarTudo} disabled={salvando}>
              {salvando?'Salvando...':'Salvar tudo'}
            </Btn>
          </div>
        </div>
      )}

      {/* Mensagem de sucesso sem alterações pendentes */}
      {alterados.length===0&&msg&&(
        <div style={{marginTop:12,padding:'10px 14px',background:msg.startsWith('Erro')?'var(--red-bg)':'var(--green-bg)',borderRadius:'var(--r-md)',fontSize:12.5,fontWeight:600,color:msg.startsWith('Erro')?'#f87171':'#4ade80',display:'inline-flex',alignItems:'center',gap:7}}>
          <Icon name={msg.startsWith('Erro')?'alert-triangle':'check-circle-2'} size={14}/>{msg}
        </div>
      )}
    </div>
  );
}

/* ══ VIEW: CONTAS ═══════════════════════════════════════════ */
function ViewContas({dados,onRefresh}){
  const [removendo,setRemovendo]=useState(null);
  const contas=dados?.contas||[];

  async function remover(id){
    if(!confirm('Remover esta conta? Os dados dela deixarão de aparecer.'))return;
    setRemovendo(id);
    try{await call('mlRemoverConta',{contaId:id});onRefresh();}
    catch(e){alert('Erro: '+e.message);}
    finally{setRemovendo(null);}
  }

  const conectar=()=>{window.location.href=`https://auth.mercadolivre.com.br/authorization?response_type=code&client_id=${ML_CLIENT_ID}&redirect_uri=${encodeURIComponent(ML_REDIRECT)}`};

  return (
    <div style={{maxWidth:640}}>
      <div style={{background:'var(--card)',borderRadius:'var(--r-xl)',border:'1px solid var(--bd)',boxShadow:'var(--sh-sm)',overflow:'hidden',marginBottom:16}}>
        <div style={{padding:'14px 20px',borderBottom:'1px solid var(--bd)',background:'var(--sunken)'}}>
          <div style={{fontSize:13,fontWeight:700}}>Contas conectadas</div>
        </div>
        {contas.map(c=>(
          <div key={c.id} style={{padding:'14px 20px',borderBottom:'1px solid var(--bd)',display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:38,height:38,borderRadius:'50%',background:'rgba(255,82,0,.1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <Icon name="store" size={17} color="var(--orange)"/>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13.5,fontWeight:700}}>{c.nickname}</div>
              <div style={{fontSize:11,color:'var(--txt3)',fontFamily:'var(--f-mono)'}}>ID {c.id}</div>
            </div>
            <Badge tone="success">Conectada</Badge>
            <button onClick={()=>remover(c.id)} disabled={removendo===c.id} style={{background:'transparent',border:'none',cursor:'pointer',padding:6,borderRadius:6,display:'flex'}}>
              <Icon name="trash-2" size={15} color="var(--red)"/>
            </button>
          </div>
        ))}
        {contas.length===0&&<div style={{padding:32,textAlign:'center',fontSize:13,color:'var(--txt3)'}}>Nenhuma conta conectada</div>}
      </div>

      {dados?.ads?.fonte==='manual'&&dados?.ads?.diagnostico?.length>0&&(
        <details style={{background:'var(--card)',borderRadius:'var(--r-xl)',border:'1px solid var(--bd)',boxShadow:'var(--sh-sm)',padding:16,marginBottom:16}}>
          <summary style={{cursor:'pointer',fontSize:12.5,fontWeight:700,display:'flex',alignItems:'center',gap:7}}>
            <Icon name="stethoscope" size={14} color="var(--amber)"/>
            Diagnóstico do Product Ads
          </summary>
          <div style={{marginTop:12,fontSize:11.5,color:'var(--txt2)',lineHeight:1.7}}>
            {dados.ads.advertiserId
              ? <>Advertiser encontrado: <strong style={{fontFamily:'var(--f-mono)'}}>{dados.ads.advertiserId}</strong></>
              : <>Nenhum advertiser encontrado — a conta provavelmente não tem Product Ads ativo.</>}
          </div>
          <div style={{marginTop:10,background:'var(--sunken)',borderRadius:'var(--r-md)',padding:'10px 12px',fontFamily:'var(--f-mono)',fontSize:11,lineHeight:1.9,color:'var(--txt2)'}}>
            {dados.ads.diagnostico.map((l,i)=><div key={i}>{l}</div>)}
          </div>
          <div style={{marginTop:10,fontSize:11,color:'var(--txt3)',lineHeight:1.6}}>
            Cada linha é uma tentativa de endpoint com o código HTTP da resposta. 200 = funcionou, 404 = rota não existe, 403 = sem permissão.
          </div>
        </details>
      )}

      <div style={{background:'var(--card)',borderRadius:'var(--r-xl)',border:'1px solid var(--bd)',boxShadow:'var(--sh-sm)',padding:20}}>
        <div style={{fontSize:13.5,fontWeight:700,marginBottom:6}}>Adicionar outra conta</div>
        <div style={{fontSize:12.5,color:'var(--txt2)',marginBottom:14,lineHeight:1.6}}>
          Conecte quantas contas do Mercado Livre quiser. Os dados são somados no dashboard e você pode filtrar por conta.
        </div>
        <div style={{background:'var(--amber-bg)',borderRadius:'var(--r-md)',padding:'11px 13px',marginBottom:16,display:'flex',gap:8,alignItems:'flex-start'}}>
          <Icon name="alert-triangle" size={14} color="var(--amber)"/>
          <div style={{fontSize:11.5,color:'var(--txt2)',lineHeight:1.6}}>
            Antes de clicar, <strong>saia da conta atual no site do Mercado Livre</strong> (ou use uma janela anônima).
            Se continuar logado na mesma conta, o ML vai reconectar ela de novo em vez da nova.
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <Btn icon="plus" onClick={conectar}>Conectar nova conta</Btn>
          <Btn variant="secondary" icon="external-link" onClick={()=>window.open('https://www.mercadolivre.com.br/jms/mlb/lgz/logout','_blank')}>
            Sair do ML primeiro
          </Btn>
        </div>
      </div>
    </div>
  );
}

/* ══ VIEW: ANÁLISE IA ═══════════════════════════════════════ */
function ViewIA({dados,periodo}){
  const [analise,setAnalise]=useState(''),[loading,setLoading]=useState(false);
  async function gerar(){
    if(!dados)return;
    setLoading(true);setAnalise('');
    const top=dados.anuncios?.slice(0,15).map(a=>({titulo:a.titulo,preco:BRL(a.preco),visitas:a.visitas,estoque:a.estoque,vendas:a.vendas,custo:a.custo}));
    const ped=dados.pedidos?.slice(0,10).map(p=>({titulo:p.titulo,valor:BRL(p.valor),lucro:BRL(p.lucro),margem:PCT(p.margem)}));
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,
          system:`Você é especialista em Mercado Livre e gestão de e-commerce. Analise os dados e entregue:\n\n🎯 DIAGNÓSTICO\nPontos fortes e de atenção do período.\n\n💰 ANÁLISE DE MARGEM\nComente a margem e onde há espaço de melhoria.\n\n🔥 TOP 3 AÇÕES\nAções concretas e priorizadas.\n\n⚠️ ALERTAS\nEstoque crítico, produtos sem custo cadastrado, margem negativa.\n\nSeja direto, use os números reais.`,
          messages:[{role:'user',content:`Período: ${PLABEL[periodo]}\nMétricas: ${JSON.stringify(dados.metricas)}\nAds: ${JSON.stringify(dados.ads)}\nTop anúncios: ${JSON.stringify(top)}\nPedidos recentes: ${JSON.stringify(ped)}`}]})});
      const d=await r.json();
      setAnalise(d.content?.[0]?.text||'Erro ao gerar análise');
    }catch(e){setAnalise('Erro: '+e.message);}
    finally{setLoading(false);}
  }
  return (
    <div style={{maxWidth:760}}>
      {!loading&&!analise&&(
        <div style={{background:'var(--card)',borderRadius:'var(--r-xl)',padding:32,textAlign:'center',boxShadow:'var(--sh-sm)',border:'1px solid var(--bd)'}}>
          <Icon name="sparkles" size={26} color="var(--orange)"/>
          <div style={{fontSize:14,color:'var(--txt2)',margin:'12px 0 20px',lineHeight:1.6}}>Diagnóstico completo da conta com IA especializada em Mercado Livre</div>
          <Btn onClick={gerar} icon="sparkles">Gerar análise</Btn>
        </div>
      )}
      {loading&&<div style={{background:'var(--card)',borderRadius:'var(--r-xl)',padding:44,textAlign:'center',boxShadow:'var(--sh-sm)',fontSize:13,color:'var(--txt3)'}}>Analisando sua conta...</div>}
      {analise&&(
        <div style={{background:'var(--card)',borderRadius:'var(--r-xl)',padding:'var(--pad)',boxShadow:'var(--sh-sm)',border:'1px solid var(--bd)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <div style={{fontSize:10,fontWeight:800,color:'var(--txt3)',letterSpacing:'.08em'}}>DIAGNÓSTICO · {new Date().toLocaleDateString('pt-BR')}</div>
            <Btn variant="secondary" size="sm" onClick={gerar} icon="refresh-cw">Reanalisar</Btn>
          </div>
          <div style={{fontSize:14,color:'var(--txt2)',lineHeight:1.8,whiteSpace:'pre-wrap'}}>{analise}</div>
        </div>
      )}
    </div>
  );
}

/* ══ SIDEBAR ════════════════════════════════════════════════ */

  {id:'dashboard',icon:'layout-dashboard',label:'Visão geral'},
  {id:'pedidos',icon:'shopping-cart',label:'Pedidos'},
  {id:'anuncios',icon:'package',label:'Anúncios'},
  {id:'ia',icon:'sparkles',label:'Análise IA'},
  {id:'contas',icon:'store',label:'Contas'},
];

    <aside className="hide-sm" style={{width:'var(--sidebar-w)',minHeight:'100vh',background:'var(--sidebar)',display:'flex',flexDirection:'column',borderRight:'1px solid var(--bd-dark)',position:'fixed',top:0,left:0,zIndex:30}}>
      <div style={{height:'var(--topbar-h)',display:'flex',alignItems:'center',padding:'0 20px',borderBottom:'1px solid var(--bd-dark)'}}>

      </div>
      <nav style={{flex:1,padding:8}}>
        {NAV.map(it=>{
          const on=active===it.id;
          return <button key={it.id} onClick={()=>onSelect(it.id)} style={{display:'flex',alignItems:'center',gap:10,width:'100%',height:40,padding:'0 12px',borderRadius:'var(--r-md)',border:'none',cursor:'pointer',fontSize:13,fontWeight:on?700:500,fontFamily:'var(--f-sans)',marginBottom:2,transition:'var(--tr)',
            background:on?'rgba(255,82,0,.12)':'transparent',color:on?'var(--orange)':'rgba(255,255,255,.55)'}}>
            <Icon name={it.icon} size={16} color={on?'var(--orange)':'rgba(255,255,255,.45)'}/>{it.label}</button>;

        <div style={{width:31,height:31,borderRadius:'50%',background:'rgba(255,82,0,.18)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <Icon name="user" size={15} color="var(--orange)"/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:11.5,fontWeight:700,color:'#fff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{seller?.nickname||'...'}</div>
          <button onClick={onSair} style={{background:'none',border:'none',color:'var(--txt-dark3)',cursor:'pointer',fontSize:10.5,padding:0}}>Sair</button>

/* ══ BOTTOM NAV (mobile) ════════════════════════════════════ */
function BottomNav({active,onSelect}){
  return (
    <nav style={{display:'none',position:'fixed',bottom:0,left:0,right:0,height:'64px',background:'var(--sidebar)',borderTop:'1px solid var(--bd-dark)',zIndex:40,justifyContent:'space-around',alignItems:'center'}}
      ref={el=>{if(el)el.style.display=window.innerWidth<=900?'flex':'none'}}>
      {NAV.map(it=>{
        const on=active===it.id;
        return <button key={it.id} onClick={()=>onSelect(it.id)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,background:'none',border:'none',cursor:'pointer',padding:'6px 10px',flex:1}}>
          <Icon name={it.icon} size={19} color={on?'var(--orange)':'rgba(255,255,255,.4)'}/>
          <span style={{fontSize:9.5,fontWeight:on?700:500,color:on?'var(--orange)':'rgba(255,255,255,.4)'}}>{it.label.split(' ')[0]}</span>
        </button>;
      })}
    </nav>
  );
}

/* ══ APP LOGADO ═════════════════════════════════════════════ */
function AppLogado({user,erroConexao}){
  const [view,setView]=useState('dashboard');
  const [periodo,setPeriodo]=useState('hoje');
  const [dados,setDados]=useState(null);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  const [contasAtivas,setContasAtivas]=useState([]);
  const [isMobile,setIsMobile]=useState(window.innerWidth<=900);

  useEffect(()=>{
    const h=()=>setIsMobile(window.innerWidth<=900);
    window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h);
  },[]);

  useEffect(()=>{carregar();},[periodo,contasAtivas]);

  async function carregar(){
    setLoading(true);setErr('');
    try{
      const r=await call('mlGetDados',{periodo,contas:contasAtivas.length?contasAtivas:null});
      setDados({...r,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
      if(contasAtivas.length===0&&r.contas?.length)setContasAtivas(r.contas.filter(c=>c.ativa).map(c=>c.id));
    }catch(e){setErr('Erro ao carregar: '+e.message);}
    finally{setLoading(false);}
  }

  const toggleConta=id=>setContasAtivas(a=>a.includes(id)?(a.length>1?a.filter(x=>x!==id):a):[...a,id]);
  const multiConta=(dados?.contasUsadas?.length||0)>1;

  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--page)'}}>
      <Sidebar active={view} onSelect={setView} seller={dados?.seller} onSair={()=>auth.signOut()}/>

      <div style={{marginLeft:isMobile?0:'var(--sidebar-w)',flex:1,display:'flex',flexDirection:'column',minHeight:'100vh',paddingBottom:isMobile?68:0}}>
        {/* TopBar */}
        <header style={{height:'var(--topbar-h)',borderBottom:'1px solid var(--bd-dark)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 var(--gutter)',gap:10,position:'sticky',top:0,zIndex:20,background:'var(--page)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            {isMobile&&<Wordmark size={17}/>}
            {!isMobile&&<span style={{fontSize:15,fontWeight:700,color:'rgba(255,255,255,.85)'}}>{NAV.find(n=>n.id===view)?.label}</span>}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {dados?.hora&&!isMobile&&<span style={{fontSize:10.5,color:'var(--txt-dark3)'}}>Atualizado {dados.hora}</span>}
            <Btn variant="dark" size="sm" icon="refresh-cw" onClick={carregar} disabled={loading}>{loading?'':'Atualizar'}</Btn>
          </div>
        </header>

        <main style={{flex:1,padding:'var(--gutter)',maxWidth:1440,width:'100%'}}>
          {(err||erroConexao)&&<div style={{background:'var(--red-bg)',border:'1px solid rgba(239,68,68,.2)',borderRadius:'var(--r-lg)',padding:'12px 16px',color:'#f87171',fontSize:13,marginBottom:16}}>{err||erroConexao}</div>}

          {view==='dashboard'&&<ViewDashboard dados={dados} loading={loading} periodo={periodo} setPeriodo={setPeriodo} contasAtivas={contasAtivas} toggleConta={toggleConta} onRefresh={carregar} onIrParaAnuncios={()=>setView('anuncios')}/>}

          {view==='pedidos'&&(
            <div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
                <Badge>{dados?.pedidos?.length||0} pedidos</Badge>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  <ContaFilter contas={dados?.contas} ativas={contasAtivas} onToggle={toggleConta}/>
                  <PeriodFilter value={periodo} onChange={setPeriodo}/>
                </div>
              </div>
              <TabelaPedidos pedidos={dados?.pedidos} loading={loading} multiConta={multiConta} onRefresh={carregar} onIrParaAnuncios={()=>setView('anuncios')}/>
            </div>
          )}

          {view==='anuncios'&&<ViewAnuncios dados={dados} loading={loading} onRefresh={carregar}/>}
          {view==='ia'&&<ViewIA dados={dados} periodo={periodo}/>}
          {view==='contas'&&<ViewContas dados={dados} onRefresh={carregar}/>}
        </main>
      </div>

      {isMobile&&<BottomNav active={view} onSelect={setView}/>}
    </div>
  );
}

/* ══ ROOT ═══════════════════════════════════════════════════ */
function App(){
  const [user,setUser]=useState(undefined);
  const [mlOk,setMlOk]=useState(null);
  const [chk,setChk]=useState(false);
  const [conectandoNova,setConectandoNova]=useState(false);
  const [erroConexao,setErroConexao]=useState('');
  const [nonce,setNonce]=useState(0);  // força recarregar dados após nova conta

  // Processa o ?code= do OAuth em qualquer situação (1ª conta ou adicional)
  useEffect(()=>{
    if(!user)return;
    const params=new URLSearchParams(window.location.search);
    const code=params.get('code');
    if(!code)return;
    window.history.replaceState({},'',window.location.pathname);
    (async()=>{
      setConectandoNova(true);setErroConexao('');
      try{
        const r=await call('mlTokenExchange',{code});
        if(r.success){setMlOk(true);setNonce(n=>n+1);}
      }catch(e){
        setErroConexao(e.message||'Não foi possível conectar a conta');
      }finally{setConectandoNova(false);}
    })();
  },[user]);

  useEffect(()=>auth.onAuthStateChanged(async u=>{
    setUser(u);
    if(u){
      setChk(true);
      try{
        const c=await call('mlListarContas');
        setMlOk((c.contas?.length||0)>0);
      }catch{
        try{
          const s=await db.collection('users').doc(u.uid).collection('mlTokens').doc('main').get();
          setMlOk(s.exists);
        }catch{setMlOk(false);}
      }finally{setChk(false);}
    }else setMlOk(null);
  }),[]);

  if(user===undefined||chk)return (
    <div style={{display:'flex',height:'100vh',background:'var(--sidebar)',alignItems:'center',justifyContent:'center'}}><Wordmark size={24}/></div>
  );

  if(!user)return <TelaLogin/>;

  // Conectando conta (primeira ou adicional)
  if(conectandoNova)return (
    <div style={{display:'flex',height:'100vh',background:'var(--sidebar)',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <Wordmark size={24}/>
      <div style={{fontSize:13,color:'var(--txt-dark2)'}}>Conectando conta do Mercado Livre...</div>
    </div>
  );

  if(!mlOk)return <TelaConectar user={user} onOk={()=>setMlOk(true)} erro={erroConexao}/>;

  return <AppLogado user={user} key={nonce} erroConexao={erroConexao}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
