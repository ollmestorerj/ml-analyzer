<style>
/* ═══════════════════════════════════════════════════════════════════
   REALECOM DESIGN SYSTEM — tokens
   Valores idênticos a tokens/*.css do design system. Não edite aqui:
   altere no design system e recopie este bloco.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* Marca — amostrado do arquivo de logo oficial */
  --orange-50:#FFF3EC;--orange-100:#FFE2D2;--orange-200:#FFC5A7;--orange-300:#FFA477;
  --orange-400:#FF7F41;--orange-500:#FF590E;--orange-600:#E04700;--orange-700:#B53900;
  --purple-50:#F3EBFB;--purple-100:#E5D3F7;--purple-200:#CBA8EF;--purple-300:#A970E3;
  --purple-400:#7B2ECC;--purple-500:#4F0188;--purple-600:#42016F;--purple-700:#340157;

  /* Neutros — cinza quente com fundo roxo discreto */
  --neutral-0:#FFFFFF;--neutral-50:#F5F4F7;--neutral-100:#EDECF1;--neutral-200:#E2E0E8;
  --neutral-300:#CBC8D4;--neutral-400:#A6A2B3;--neutral-500:#7C7789;--neutral-600:#5C5769;
  --neutral-700:#433F4E;--neutral-800:#2A2733;--neutral-900:#1A1820;--neutral-950:#111111;--neutral-1000:#0D0D0D;

  /* Semânticos */
  --green-500:#0E9F6E;--green-700:#075F41;--amber-500:#F0A500;--amber-700:#8F6000;
  --red-500:#D32137;--red-600:#AE1A2C;--red-700:#84131F;--blue-500:#3B5BF5;--blue-700:#1F33A0;

  /* Série de gráficos */
  --viz-1:#FF590E;--viz-2:#4F0188;--viz-3:#3B5BF5;--viz-4:#0E9F6E;
  --viz-5:#F0A500;--viz-6:#7B2ECC;--viz-7:#D32137;--viz-8:#A6A2B3;--viz-track:#EDECF1;

  /* Superfícies — casca escura, área de trabalho clara */
  --surface-page:#F7F6F9;--surface-card:#FFFFFF;--surface-sunken:#F5F4F7;
  --surface-nav:#0D0D0D;--surface-hover:#F5F4F7;--surface-active:#EDECF1;
  --surface-selected:#FFF3EC;--surface-overlay:rgba(13,13,13,.55);

  /* Texto */
  --text-strong:#111111;--text-body:#2A2733;--text-muted:#7C7789;--text-subtle:#A6A2B3;
  --text-brand:#E04700;--text-accent:#4F0188;--text-link:#E04700;--text-link-hover:#B53900;
  --on-dark:#FFFFFF;--on-dark-muted:rgba(255,255,255,.58);

  /* Bordas */
  --border-subtle:#EDECF1;--border-default:#E2E0E8;--border-strong:#CBC8D4;
  --border-inverse:rgba(255,255,255,.12);--border-focus:#FF590E;

  /* Ações */
  --action-primary:#FF590E;--action-primary-hover:#E04700;--action-primary-active:#B53900;
  --action-secondary:#4F0188;--action-secondary-hover:#42016F;
  --action-neutral:#FFFFFF;--action-neutral-hover:#F5F4F7;
  --action-disabled:#EDECF1;--action-disabled-text:#A6A2B3;

  /* Status: par fundo-suave + texto-forte */
  --status-success-bg:#E6F7F0;--status-success-fg:#075F41;--status-success-solid:#0E9F6E;
  --status-warning-bg:#FFF6E5;--status-warning-fg:#8F6000;--status-warning-solid:#F0A500;
  --status-danger-bg:#FDECEE;--status-danger-fg:#84131F;--status-danger-solid:#D32137;
  --status-info-bg:#ECF0FE;--status-info-fg:#1F33A0;--status-info-solid:#3B5BF5;
  --status-brand-bg:#FFF3EC;--status-brand-fg:#B53900;--status-brand-solid:#FF590E;
  --status-accent-bg:#F3EBFB;--status-accent-fg:#340157;--status-accent-solid:#4F0188;
  --status-neutral-bg:#EDECF1;--status-neutral-fg:#5C5769;--status-neutral-solid:#7C7789;

  /* Tipografia */
  --font-display:'Anton',Impact,sans-serif;
  --font-sans:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',Menlo,Consolas,monospace;
  --text-2xs:11px;--text-xs:12px;--text-sm:13px;--text-md:15px;--text-lg:17px;
  --text-xl:20px;--text-2xl:24px;--text-3xl:30px;--text-4xl:38px;
  --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;--weight-extrabold:800;
  --tracking-display:-.03em;--tracking-tight:-.02em;--tracking-normal:-.01em;--tracking-caps:.08em;

  /* Espaço e layout */
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-7:32px;--space-8:40px;--space-9:48px;
  --layout-sidebar-w:248px;--layout-topbar-h:64px;--layout-bottomnav-h:64px;
  --layout-gutter:24px;--layout-gutter-mobile:16px;--layout-max-content:1440px;
  --layout-card-pad:20px;--layout-grid-gap:16px;
  --control-h-sm:32px;--control-h-md:40px;--control-h-lg:48px;--tap-target-min:44px;

  /* Raios */
  --radius-xs:6px;--radius-sm:8px;--radius-md:10px;--radius-lg:14px;
  --radius-xl:18px;--radius-2xl:24px;--radius-pill:999px;

  /* Elevação */
  --shadow-xs:0 1px 2px rgba(17,17,17,.05);
  --shadow-sm:0 1px 2px rgba(17,17,17,.04),0 2px 6px -2px rgba(17,17,17,.06);
  --shadow-md:0 1px 2px rgba(17,17,17,.04),0 8px 20px -8px rgba(17,17,17,.10);
  --shadow-lg:0 2px 4px rgba(17,17,17,.04),0 18px 40px -14px rgba(17,17,17,.16);
  --shadow-focus:0 0 0 3px rgba(255,89,14,.22);
  --shadow-focus-dark:0 0 0 3px rgba(255,89,14,.3);

  /* Movimento */
  --duration-fast:140ms;--duration-base:200ms;--duration-slow:280ms;
  --ease-standard:cubic-bezier(.4,0,.2,1);--ease-out:cubic-bezier(.16,.8,.3,1);
  --press-scale:.97;
  --tr:background-color var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard),box-shadow var(--duration-fast) var(--ease-standard);
}
@media (prefers-reduced-motion:reduce){:root{--duration-fast:0ms;--duration-base:0ms;--duration-slow:0ms;--press-scale:1}}

/* ═══ Base ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:var(--font-sans);font-size:var(--text-md);line-height:1.47;color:var(--text-body);background:var(--surface-page);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{margin:0;color:var(--text-strong);letter-spacing:var(--tracking-tight)}
a{color:var(--text-link);text-decoration:none}
a:hover{color:var(--text-link-hover);text-decoration:underline}
button,input,select,textarea{font-family:inherit}
::selection{background:var(--orange-200);color:var(--neutral-950)}
.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--neutral-300);border-radius:var(--radius-pill);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--neutral-400);background-clip:content-box}
/* Campo claro (área de trabalho) */
.fld{width:100%;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);color:var(--text-strong);font-size:var(--text-sm);transition:var(--tr)}
.fld::placeholder{color:var(--text-subtle)}
.fld:focus{outline:none;border-color:var(--border-focus);box-shadow:var(--shadow-focus)}
/* Campo sobre superfície escura (casca) */
.fld-dark{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border-inverse);border-radius:var(--radius-md);color:var(--on-dark);font-size:var(--text-sm);transition:var(--tr)}
.fld-dark::placeholder{color:var(--on-dark-muted)}
.fld-dark:focus{outline:none;border-color:var(--border-focus);box-shadow:var(--shadow-focus-dark)}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

/* ══ DS PRIMITIVES ══════════════════════════════════════════
   Espelham components/ do design system. Logo = arquivo, nunca tipo. */

const Logo=({height=20,inverse=false})=>(
  <img src={inverse?'./assets/logo-horizontal-inverse.png':'./assets/logo-horizontal.png'}
    alt="realecom" style={{height,width:'auto',display:'block',userSelect:'none'}}/>
);

const Icon=({name,size=18,color='currentColor'})=>{
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.lucide)return;
    ref.current.innerHTML='';
    const el=document.createElement('i');el.setAttribute('data-lucide',name);
    ref.current.appendChild(el);
    try{lucide.createIcons({nodes:[el]});}catch{}
    const s=ref.current.querySelector('svg');
    if(s){s.setAttribute('width',size);s.setAttribute('height',size);s.style.color=color;s.style.display='block';}
  },[name,size,color]);
  return <span ref={ref} aria-hidden="true" style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size,flexShrink:0}}/>;
};

/* Badge — pílula de status somente leitura (par fundo-suave + texto-forte) */
const Badge=({children,tone='neutral',solid=false,dot=false})=>{
  const t={
    neutral:['--status-neutral-bg','--status-neutral-fg','--status-neutral-solid'],
    success:['--status-success-bg','--status-success-fg','--status-success-solid'],
    danger:['--status-danger-bg','--status-danger-fg','--status-danger-solid'],
    warning:['--status-warning-bg','--status-warning-fg','--status-warning-solid'],
    info:['--status-info-bg','--status-info-fg','--status-info-solid'],
    brand:['--status-brand-bg','--status-brand-fg','--status-brand-solid'],
    accent:['--status-accent-bg','--status-accent-fg','--status-accent-solid'],
  }[tone]||['--status-neutral-bg','--status-neutral-fg','--status-neutral-solid'];
  const skin=solid?{background:`var(${t[2]})`,color:'#fff'}:{background:`var(${t[0]})`,color:`var(${t[1]})`};
  return <span style={{display:'inline-flex',alignItems:'center',gap:5,height:22,padding:'0 9px',borderRadius:'var(--radius-pill)',fontSize:'var(--text-2xs)',fontWeight:'var(--weight-semibold)',whiteSpace:'nowrap',...skin}}>
    {dot&&<span style={{width:6,height:6,borderRadius:'50%',background:solid?'#fff':`var(${t[2]})`,flexShrink:0}}/>}
    {children}</span>;
};

/* Btn — primary laranja (uma por tela), secondary roxo, neutral branco, dark sobre casca */
const Btn=({children,variant='primary',size='md',onClick,disabled,full,icon,iconRight,title,style={}})=>{
  const [hv,setHv]=useState(false),[pr,setPr]=useState(false);
  const v={
    primary:{rest:{background:'var(--action-primary)',color:'#fff',border:'1px solid transparent',boxShadow:'var(--shadow-xs)'},hover:{background:'var(--action-primary-hover)'},active:{background:'var(--action-primary-active)'}},
    secondary:{rest:{background:'var(--action-secondary)',color:'#fff',border:'1px solid transparent',boxShadow:'var(--shadow-xs)'},hover:{background:'var(--action-secondary-hover)'},active:{background:'var(--action-secondary-hover)'}},
    neutral:{rest:{background:'var(--action-neutral)',color:'var(--text-body)',border:'1px solid var(--border-default)',boxShadow:'var(--shadow-xs)'},hover:{background:'var(--action-neutral-hover)',borderColor:'var(--border-strong)'},active:{background:'var(--surface-active)'}},
    ghost:{rest:{background:'transparent',color:'var(--text-body)',border:'1px solid transparent'},hover:{background:'var(--surface-hover)'},active:{background:'var(--surface-active)'}},
    dark:{rest:{background:'transparent',color:'var(--on-dark-muted)',border:'1px solid var(--border-inverse)'},hover:{background:'rgba(255,255,255,.08)',color:'#fff'},active:{background:'rgba(255,255,255,.12)'}},
    danger:{rest:{background:'var(--status-danger-solid)',color:'#fff',border:'1px solid transparent'},hover:{background:'var(--red-600)'},active:{background:'var(--red-700)'}},
  }[variant];
  const s={sm:{h:'var(--control-h-sm)',px:12,fs:'var(--text-sm)',ic:15},md:{h:'var(--control-h-md)',px:16,fs:'var(--text-sm)',ic:16},lg:{h:'var(--control-h-lg)',px:20,fs:'var(--text-md)',ic:17}}[size];
  return <button onClick={disabled?undefined:onClick} disabled={disabled} title={title}
    onMouseEnter={()=>setHv(true)} onMouseLeave={()=>{setHv(false);setPr(false);}}
    onMouseDown={()=>setPr(true)} onMouseUp={()=>setPr(false)}
    style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:7,height:s.h,padding:`0 ${s.px}px`,
      borderRadius:'var(--radius-md)',fontSize:s.fs,fontWeight:'var(--weight-semibold)',letterSpacing:'var(--tracking-normal)',
      cursor:disabled?'not-allowed':'pointer',width:full?'100%':'auto',whiteSpace:'nowrap',transition:'var(--tr)',
      ...v.rest,
      ...(hv&&!disabled?v.hover:null),
      ...(pr&&!disabled?{...v.active,transform:'scale(var(--press-scale))'}:null),
      ...(disabled?{background:variant==='dark'||variant==='ghost'?'transparent':'var(--action-disabled)',color:'var(--action-disabled-text)',borderColor:variant==='dark'?'var(--border-inverse)':'transparent',boxShadow:'none'}:null),
      ...style}}>
    {icon&&<Icon name={icon} size={s.ic}/>}{children}{iconRight&&<Icon name={iconRight} size={s.ic}/>}</button>;
};

const IconBtn=({icon,label,onClick,disabled,tone='ghost',size=36})=>{
  const [hv,setHv]=useState(false);
  const skin=tone==='danger'?{color:'var(--status-danger-solid)'}:{color:'var(--text-muted)'};
  return <button onClick={disabled?undefined:onClick} aria-label={label} title={label} disabled={disabled}
    onMouseEnter={()=>setHv(true)} onMouseLeave={()=>setHv(false)}
    style={{width:size,height:size,display:'inline-flex',alignItems:'center',justifyContent:'center',border:'1px solid transparent',
      borderRadius:'var(--radius-md)',cursor:disabled?'not-allowed':'pointer',transition:'var(--tr)',
      background:hv&&!disabled?'var(--surface-hover)':'transparent',...skin,
      ...(disabled?{color:'var(--action-disabled-text)'}:null)}}>
    <Icon name={icon} size={17}/></button>;
};

const Skel=({w='100%',h=16,r='var(--radius-sm)'})=>(
  <div style={{width:w,height:h,borderRadius:r,background:'linear-gradient(90deg,var(--neutral-100) 25%,var(--neutral-50) 50%,var(--neutral-100) 75%)',backgroundSize:'200% 100%',animation:'shimmer 1.4s ease infinite'}}/>
);

/* Card — branco, raio 18px, hairline, sombra rasa */
const Card=({title,subtitle,action,icon,children,pad=true,style={}})=>(
  <section style={{background:'var(--surface-card)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-xl)',
    boxShadow:'var(--shadow-sm)',display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden',...style}}>
    {(title||action)&&(
      <header style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap',
        padding:pad?'var(--layout-card-pad) var(--layout-card-pad) 0':'var(--layout-card-pad)'}}>
        <div style={{display:'flex',alignItems:'center',gap:9,minWidth:0}}>
          {icon&&<Icon name={icon} size={17} color="var(--action-primary)"/>}
          <div style={{minWidth:0}}>
            {title&&<h3 style={{fontSize:'var(--text-md)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)'}}>{title}</h3>}
            {subtitle&&<p style={{fontSize:'var(--text-xs)',color:'var(--text-muted)',marginTop:2,fontWeight:'var(--weight-medium)'}}>{subtitle}</p>}
          </div>
        </div>
        {action}
      </header>
    )}
    <div style={{padding:pad?'var(--layout-card-pad)':0,paddingTop:(title||action)&&pad?'var(--space-4)':undefined,minWidth:0}}>{children}</div>
  </section>
);

const Overline=({children,onDark})=>(
  <span style={{fontSize:'var(--text-2xs)',fontWeight:'var(--weight-bold)',letterSpacing:'var(--tracking-caps)',
    textTransform:'uppercase',color:onDark?'var(--on-dark-muted)':'var(--text-subtle)'}}>{children}</span>
);

const StatCard=({label,value,caption,delta,tone,icon,accent='brand'})=>{
  const ac={brand:'var(--orange-500)',accent:'var(--purple-500)',success:'var(--green-500)',danger:'var(--red-500)',amber:'var(--amber-500)',info:'var(--blue-500)'}[accent];
  return (
    <div style={{background:'var(--surface-card)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-xl)',
      boxShadow:'var(--shadow-sm)',padding:'var(--layout-card-pad)',display:'flex',flexDirection:'column',gap:'var(--space-3)',minWidth:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
        <Overline>{label}</Overline>
        {icon&&<span style={{width:28,height:28,borderRadius:'var(--radius-sm)',background:'var(--surface-sunken)',display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name={icon} size={15} color={ac}/></span>}
      </div>
      <div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}>
        <span className="tab" style={{fontSize:'var(--text-3xl)',fontWeight:'var(--weight-extrabold)',letterSpacing:'var(--tracking-tight)',lineHeight:1.05,
          color:tone==='danger'?'var(--status-danger-fg)':tone==='success'?'var(--status-success-fg)':'var(--text-strong)'}}>{value}</span>
        {delta&&<span className="tab" style={{fontSize:'var(--text-xs)',fontWeight:'var(--weight-bold)',color:'var(--text-muted)'}}>{delta}</span>}
      </div>
      {caption&&<span className="tab" style={{fontSize:'var(--text-xs)',color:'var(--text-subtle)',lineHeight:1.4}}>{caption}</span>}
    </div>
  );
};

/* Estado vazio — ícone Lucide em ladrilho, nunca emoji */
const Empty=({icon='inbox',title,description,action,compact})=>(
  <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center',
    gap:'var(--space-3)',padding:compact?'var(--space-6)':'var(--space-9) var(--space-6)'}}>
    <span style={{width:48,height:48,borderRadius:'var(--radius-lg)',background:'var(--surface-sunken)',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
      <Icon name={icon} size={22} color="var(--text-subtle)"/>
    </span>
    <div style={{display:'flex',flexDirection:'column',gap:4,maxWidth:340}}>
      <span style={{fontSize:'var(--text-md)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)'}}>{title}</span>
      {description&&<span style={{fontSize:'var(--text-sm)',color:'var(--text-muted)'}}>{description}</span>}
    </div>
    {action}
  </div>
);

/* Miniatura de produto — ladrilho com ícone quando não há foto */
const Thumb=({src,alt,size=44})=>(
  <div style={{width:size,height:size,borderRadius:'var(--radius-md)',overflow:'hidden',background:'var(--surface-sunken)',
    border:'1px solid var(--border-subtle)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
    {src?<img src={src} alt={alt||''} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
        :<Icon name="package" size={Math.round(size*.42)} color="var(--text-subtle)"/>}
  </div>
);

/* Nota inline — informação de apoio dentro de um card */
const Note=({tone='neutral',icon,children})=>{
  const t={neutral:{bg:'var(--surface-sunken)',fg:'var(--text-muted)',ic:'var(--text-subtle)'},
    warning:{bg:'var(--status-warning-bg)',fg:'var(--status-warning-fg)',ic:'var(--status-warning-solid)'},
    danger:{bg:'var(--status-danger-bg)',fg:'var(--status-danger-fg)',ic:'var(--status-danger-solid)'},
    success:{bg:'var(--status-success-bg)',fg:'var(--status-success-fg)',ic:'var(--status-success-solid)'},
    info:{bg:'var(--status-info-bg)',fg:'var(--status-info-fg)',ic:'var(--status-info-solid)'}}[tone];
  return <div style={{display:'flex',gap:9,alignItems:'flex-start',padding:'11px 13px',background:t.bg,
    borderRadius:'var(--radius-lg)',fontSize:'var(--text-sm)',color:t.fg,lineHeight:1.5}}>
    {icon&&<span style={{marginTop:1,flexShrink:0}}><Icon name={icon} size={15} color={t.ic}/></span>}
    <span style={{minWidth:0}}>{children}</span></div>;
};

/* ══ FILTROS ════════════════════════════════════════════════ */
const PERIODOS=['hoje','ontem','7d','30d','mes'];
const PLABEL={hoje:'Hoje',ontem:'Ontem','7d':'7 dias','30d':'30 dias',mes:'Mês atual'};

/* Pílulas sobre a faixa escura (casca) */
const PeriodFilter=({value,onChange})=>(
  <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
    {PERIODOS.map(p=>{
      const on=value===p;
      return <button key={p} onClick={()=>onChange(p)} aria-pressed={on}
        style={{height:32,padding:'0 13px',borderRadius:'var(--radius-pill)',fontSize:'var(--text-xs)',
          fontWeight:'var(--weight-semibold)',cursor:'pointer',transition:'var(--tr)',
          background:on?'var(--action-primary)':'transparent',color:on?'#fff':'var(--on-dark-muted)',
          border:`1px solid ${on?'var(--action-primary)':'var(--border-inverse)'}`}}>{PLABEL[p]}</button>;
    })}
  </div>
);

const ContaFilter=({contas,ativas,onToggle})=>{
  if(!contas||contas.length<2)return null;
  return (
    <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
      {contas.map(c=>{
        const on=ativas.includes(c.id);
        return <button key={c.id} onClick={()=>onToggle(c.id)} aria-pressed={on}
          style={{display:'inline-flex',alignItems:'center',gap:6,height:32,padding:'0 12px',borderRadius:'var(--radius-pill)',
            cursor:'pointer',fontSize:'var(--text-xs)',fontWeight:'var(--weight-semibold)',transition:'var(--tr)',
            background:on?'rgba(255,255,255,.1)':'transparent',
            border:`1px solid ${on?'var(--action-primary)':'var(--border-inverse)'}`,
            color:on?'#fff':'var(--on-dark-muted)'}}>
          <Icon name="store" size={13}/>{c.nickname}</button>;
      })}
    </div>
  );
};

/* ══ LOGIN ══════════════════════════════════════════════════ */
function TelaLogin(){
  const [email,setEmail]=useState(''),[senha,setSenha]=useState('');
  const [loading,setLoading]=useState(false),[err,setErr]=useState('');
  async function login(){
    if(!email||!senha){setErr('Preencha email e senha');return;}
    setLoading(true);setErr('');
    try{await auth.signInWithEmailAndPassword(email,senha);}
    catch(e){setErr({'auth/invalid-credential':'Email ou senha incorretos','auth/too-many-requests':'Muitas tentativas. Aguarde.'}[e.code]||e.message);}
    finally{setLoading(false);}
  }
  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--surface-nav)',alignItems:'center',justifyContent:'center',padding:'var(--space-5)'}}>
      <div style={{width:'100%',maxWidth:368,animation:'rise var(--duration-slow) var(--ease-out)'}}>
        <div style={{textAlign:'center',marginBottom:'var(--space-7)'}}>
          <div style={{display:'flex',justifyContent:'center'}}><Logo height={30} inverse/></div>
          <div style={{width:40,height:3,background:'var(--action-primary)',borderRadius:2,margin:'var(--space-3) auto'}}/>
          <Overline onDark>ML Analyzer</Overline>
        </div>
        <div style={{background:'#17161C',border:'1px solid var(--border-inverse)',borderRadius:'var(--radius-2xl)',padding:'var(--space-6)'}}>
          {[['E-mail','email',email,setEmail,'seu@email.com','mail'],['Senha','password',senha,setSenha,'••••••••','lock']].map(([lbl,type,val,set,ph,ic],i)=>(
            <div key={lbl} style={{marginBottom:i===0?'var(--space-4)':'var(--space-5)'}}>
              <label style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',color:'var(--on-dark-muted)',display:'block',marginBottom:6}}>{lbl}</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',display:'flex'}}>
                  <Icon name={ic} size={16} color="var(--on-dark-muted)"/>
                </span>
                <input className="fld-dark" type={type} placeholder={ph} value={val} autoComplete={type==='email'?'username':'current-password'}
                  onChange={e=>set(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()}
                  style={{height:'var(--control-h-lg)',padding:'0 14px 0 38px'}}/>
              </div>
            </div>
          ))}
          {err&&<div style={{marginBottom:'var(--space-4)'}}>
            <div style={{display:'flex',gap:9,alignItems:'flex-start',padding:'11px 13px',background:'rgba(211,33,55,.18)',
              borderRadius:'var(--radius-lg)',fontSize:'var(--text-sm)',color:'#FF8A98',lineHeight:1.5}}>
              <span style={{marginTop:1,flexShrink:0}}><Icon name="alert-octagon" size={15}/></span>{err}
            </div></div>}
          <Btn full size="lg" onClick={login} disabled={loading} icon={loading?undefined:'log-in'}>{loading?'Entrando…':'Entrar'}</Btn>
          <div style={{textAlign:'center',marginTop:'var(--space-4)',fontSize:'var(--text-xs)',color:'var(--on-dark-muted)'}}>Mesmo login da Calculadora REAL</div>
        </div>
      </div>
    </div>
  );
}

          <p style={{fontSize:'var(--text-sm)',color:'var(--on-dark-muted)',marginBottom:'var(--space-5)',lineHeight:1.6}}>
            Você será redirecionado ao Mercado Livre e voltará automaticamente.

            <Btn variant="dark" size="sm" onClick={()=>auth.signOut()}>Sair</Btn>
          </div>
        </div>
      </div>

  );
}

/* ══ EXIBIÇÃO DE CUSTO (somente leitura) ════════════════════ */

      style={{display:'inline-flex',alignItems:'center',gap:4,background:'transparent',border:'none',cursor:'pointer',padding:0}}>
      <span style={{fontSize:'var(--text-xs)',color:'var(--status-warning-fg)',fontWeight:'var(--weight-bold)'}}>definir</span>
      <Icon name="pencil" size={11} color="var(--status-warning-fg)"/>

  return <span className="tab" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',color:'var(--text-strong)'}}>{BRL(valor)}</span>;

/* ══ TABELA DE PEDIDOS ══════════════════════════════════════ */
const THead=({children,align})=>(
  <div style={{fontSize:'var(--text-2xs)',fontWeight:'var(--weight-bold)',color:'var(--text-muted)',
    letterSpacing:'var(--tracking-caps)',textTransform:'uppercase',textAlign:align||'left'}}>{children}</div>
);

function TabelaPedidos({pedidos,loading,multiConta,onRefresh,onIrParaAnuncios}){
  const GRID=multiConta
    ? '52px minmax(0,1fr) 84px 96px 92px 48px 96px 84px 84px 84px 108px'
    : '52px minmax(0,1fr) 96px 92px 48px 96px 84px 84px 84px 108px';
  const HEADS=multiConta
    ? ['','Título','Conta','SKU','Data','Qtd','Valor','Tarifa','Frete','Custo','Lucro']
    : ['','Título','SKU','Data','Qtd','Valor','Tarifa','Frete','Custo','Lucro'];

  if(loading)return (
    <Card pad={false}>
      {[...Array(5)].map((_,i)=>(
        <div key={i} style={{padding:'14px var(--layout-card-pad)',borderBottom:i<4?'1px solid var(--border-subtle)':'none',display:'flex',gap:'var(--space-3)',alignItems:'center'}}>
          <Skel w={44} h={44} r="var(--radius-md)"/>
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:7}}><Skel h={13}/><Skel w="35%" h={11}/></div>
          <Skel w={72} h={24}/><Skel w={72} h={24}/>
        </div>
      ))}
    </Card>
  );

  return (
    <Card pad={false} style={{overflow:'auto'}}>
      <div style={{minWidth:multiConta?1100:1000}}>
        <div style={{display:'grid',gridTemplateColumns:GRID,gap:8,padding:'11px var(--layout-card-pad)',
          background:'var(--surface-sunken)',borderBottom:'1px solid var(--border-default)',position:'sticky',top:0,zIndex:2}}>
          {HEADS.map((h,i)=><THead key={i} align={i>=HEADS.length-6&&h?'right':'left'}>{h}</THead>)}
        </div>
        {pedidos?.length>0?pedidos.map((p,i)=>(
          <div key={p.id||i} style={{display:'grid',gridTemplateColumns:GRID,gap:8,padding:'11px var(--layout-card-pad)',
            alignItems:'center',borderBottom:'1px solid var(--border-subtle)',transition:'background-color var(--duration-fast) var(--ease-standard)'}}
            onMouseEnter={e=>e.currentTarget.style.background='var(--surface-hover)'}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <Thumb src={p.foto} alt={p.titulo}/>
            <div className="ell" title={p.titulo} style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',color:'var(--text-strong)'}}>{p.titulo}</div>
            {multiConta&&<div className="ell" style={{fontSize:'var(--text-xs)',color:'var(--text-muted)'}}>{p.conta}</div>}
            <div className="ell mono" title={p.sku} style={{fontSize:'var(--text-2xs)',color:'var(--text-muted)'}}>{p.sku}</div>
            <div className="mono" style={{fontSize:'var(--text-2xs)',color:'var(--text-muted)'}}>{p.data}</div>
            <div className="tab" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',textAlign:'right'}}>{p.qtde}</div>
            <div className="tab" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)',textAlign:'right'}}>{BRL(p.valor)}</div>
            <div className="tab" style={{fontSize:'var(--text-xs)',color:'var(--text-muted)',textAlign:'right'}}>{BRL(p.tarifa)}</div>
            <div className="tab" style={{fontSize:'var(--text-xs)',color:'var(--status-warning-fg)',textAlign:'right'}}>{BRL(p.frete)}</div>
            <div style={{textAlign:'right'}}><CustoDisplay valor={p.custo} onIrParaAnuncios={onIrParaAnuncios}/></div>
            <div style={{display:'flex',flexDirection:'column',gap:2,alignItems:'flex-end'}}>
              {p.temCusto?(
                <>
                  <span className="tab" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-extrabold)',
                    color:p.lucro>=0?'var(--status-success-fg)':'var(--status-danger-fg)'}}>{BRL(p.lucro)}</span>
                  <span className="tab" style={{fontSize:'var(--text-2xs)',color:'var(--text-subtle)'}}>{PCT(p.margem)}</span>
                </>
              ):<Badge tone="warning" dot>Sem custo</Badge>}
            </div>
          </div>
        )):(
          <Empty icon="package-search" title="Nenhum pedido no período"
            description="Troque o período ou a conta no filtro acima."/>
        )}
      </div>
    </Card>
  );
}

/* ══ PAINEL DE ADS ══════════════════════════════════════════ */
function PainelAds({ads,dataRef,onSalvo,periodoLabel}){
  const auto=ads?.fonte==='automatico';
  const [editing,setEditing]=useState(false);
  const [inv,setInv]=useState('');
  const [rec,setRec]=useState('');
  const [vnd,setVnd]=useState('');
  const [saving,setSaving]=useState(false);
  const [verCampanhas,setVerCampanhas]=useState(false);

  useEffect(()=>{
    setInv(ads?.investimento||'');setRec(ads?.receita||'');setVnd(ads?.vendas||'');
  },[ads]);

  async function salvar(){
    setSaving(true);
    try{
      await call('mlSalvarAds',{data:dataRef,investimento:parseFloat(inv)||0,receita:parseFloat(rec)||0,vendas:parseInt(vnd)||0});
      setEditing(false);onSalvo&&onSalvo();
    }catch(e){alert('Erro: '+e.message);}
    finally{setSaving(false);}
  }

  const cells=[
    {label:'Investimento',value:BRL(ads?.investimento),accent:'amber'},
    {label:'Receita Ads',value:BRL(ads?.receita),accent:'success'},
    {label:'Vendas',value:NUM(ads?.vendas)},
    {label:'ROAS',value:`${(ads?.roas||0).toFixed(2)}x`,accent:'accent'},
    {label:'ACOS',value:PCT(ads?.acos)},
    {label:'TACOS',value:PCT(ads?.tacos)},
  ];
  if(auto){
    cells.push({label:'Cliques',value:NUM(ads?.cliques)});
    cells.push({label:'Impressões',value:NUM(ads?.impressoes)});
  }

  const semDados=!ads?.investimento&&!ads?.receita;
  const cor=a=>({success:'var(--status-success-fg)',amber:'var(--status-warning-fg)',accent:'var(--text-accent)'}[a]||'var(--text-strong)');

  return (
    <Card icon="megaphone" title="Publicidade"
      action={
        <div style={{display:'flex',gap:'var(--space-2)',alignItems:'center',flexWrap:'wrap'}}>
          {auto?<Badge tone="success" dot>Automático</Badge>:<Badge tone="warning" dot>Manual</Badge>}
          {auto&&ads?.contasSemAds>0&&(
            <span style={{fontSize:'var(--text-xs)',color:'var(--text-muted)'}}>
              {ads.contasSemAds} {ads.contasSemAds===1?'conta sem Product Ads':'contas sem Product Ads'}
            </span>
          )}
          {auto&&ads?.campanhas?.length>0&&(
            <Btn variant="neutral" size="sm" icon={verCampanhas?'chevron-up':'list'} onClick={()=>setVerCampanhas(v=>!v)}>
              {ads.campanhas.length} {ads.campanhas.length===1?'campanha':'campanhas'}
            </Btn>
          )}
          {!auto&&(!editing
            ? <Btn variant="neutral" size="sm" icon="pencil" onClick={()=>setEditing(true)}>Editar</Btn>
            : <>
                <Btn size="sm" onClick={salvar} disabled={saving}>{saving?'Salvando…':'Salvar'}</Btn>
                <Btn variant="ghost" size="sm" onClick={()=>setEditing(false)}>Cancelar</Btn>
              </>)}
        </div>
      }>

      {editing&&!auto?(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:'var(--space-4)'}}>
          {[['Investimento','R$',inv,setInv,'0.01'],['Receita','R$',rec,setRec,'0.01'],['Vendas',null,vnd,setVnd,'1']].map(([lbl,pfx,v,set,step])=>(
            <div key={lbl}>
              <label style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',color:'var(--text-body)',display:'block',marginBottom:6}}>{lbl}</label>
              <div style={{position:'relative'}}>
                {pfx&&<span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:'var(--text-sm)',color:'var(--text-muted)',pointerEvents:'none'}}>{pfx}</span>}
                <input className="fld mono" type="number" step={step} value={v} onChange={e=>set(e.target.value)}
                  style={{height:'var(--control-h-md)',padding:pfx?'0 12px 0 36px':'0 12px'}}/>
              </div>
            </div>
          ))}
        </div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:'var(--space-5)'}}>
          {cells.map(c=>(
            <div key={c.label} style={{display:'flex',flexDirection:'column',gap:4,minWidth:0}}>
              <Overline>{c.label}</Overline>
              <div className="tab" style={{fontSize:'var(--text-xl)',fontWeight:'var(--weight-extrabold)',
                letterSpacing:'var(--tracking-tight)',color:cor(c.accent)}}>{c.value}</div>
            </div>
          ))}
        </div>
      )}

      {/* Lista de campanhas */}
      {auto&&verCampanhas&&ads.campanhas?.length>0&&(
        <div style={{marginTop:'var(--space-5)',borderTop:'1px solid var(--border-subtle)',paddingTop:'var(--space-4)'}}>
          {ads.campanhas.map(c=>{
            const roasC=c.investimento>0?c.receita/c.investimento:0;
            return (
              <div key={c.id} style={{display:'flex',alignItems:'center',gap:'var(--space-3)',padding:'10px 0',
                borderBottom:'1px solid var(--border-subtle)',flexWrap:'wrap'}}>
                <div style={{flex:'1 1 200px',minWidth:0}}>
                  <div className="ell" title={c.nome} style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',color:'var(--text-strong)'}}>{c.nome}</div>
                  <div style={{marginTop:4}}><Badge tone={c.status==='active'?'success':'neutral'} dot>{c.status==='active'?'Ativa':c.status}</Badge></div>
                </div>
                {[['Gasto',BRL(c.investimento),'var(--status-warning-fg)',84],
                  ['Receita',BRL(c.receita),'var(--status-success-fg)',84],
                  ['ROAS',`${roasC.toFixed(2)}x`,roasC>=3?'var(--status-success-fg)':roasC>=1?'var(--text-strong)':'var(--status-danger-fg)',58],
                  ['Vendas',NUM(c.vendas),'var(--text-strong)',52]].map(([lbl,val,col,w])=>(
                  <div key={lbl} style={{textAlign:'right',minWidth:w}}>
                    <Overline>{lbl}</Overline>
                    <div className="tab" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-bold)',color:col,marginTop:2}}>{val}</div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {/* Avisos */}
      <div style={{marginTop:'var(--space-4)'}}>
        {auto&&(
          <Note icon="info">Dados puxados direto do Product Ads. O Mercado Livre consolida as métricas por volta das 10h — números do dia atual podem mudar ao longo do dia.</Note>
        )}
        {!auto&&!editing&&(
          <Note tone="warning" icon="alert-triangle">
            {semDados
              ? <>Não foi possível puxar o Product Ads automaticamente{ads?.motivo?` (${ads.motivo})`:''}. Verifique se a conta tem publicidade ativa em <strong>Mercado Livre → Meu perfil → Publicidade</strong>, ou informe os valores manualmente.</>
              : <>Valores informados manualmente para {periodoLabel?.toLowerCase()}.</>}
          </Note>
        )}
      </div>
    </Card>
  );
}

/* ══ VIEW: DASHBOARD ════════════════════════════════════════ */
function ViewDashboard({dados,loading,periodo,setPeriodo,contasAtivas,toggleConta,onRefresh,onIrParaAnuncios}){

    <div style={{display:'flex',flexDirection:'column',gap:'var(--layout-grid-gap)'}}>

      <section style={{background:'var(--surface-nav)',borderRadius:'var(--radius-2xl)',padding:'22px var(--space-6)',
        display:'flex',gap:'var(--space-6)',flexWrap:'wrap',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div style={{display:'flex',gap:'var(--space-9)',flexWrap:'wrap',flex:1,minWidth:240}}>
          <div>
            <Overline onDark>Faturamento</Overline>
            {loading?<div style={{marginTop:8}}><Skel w={180} h={38}/></div>:(

            )}
            {!loading&&<div className="tab" style={{fontSize:'var(--text-xs)',color:'var(--on-dark-muted)',marginTop:6}}>
              {NUM(m.pedidosDia)} pedidos · {NUM(m.qtd)} unidades</div>}
          </div>
          <div>
            <Overline onDark>Lucro</Overline>
            {loading?<div style={{marginTop:8}}><Skel w={140} h={30}/></div>:(
              <div style={{display:'flex',alignItems:'baseline',gap:8,marginTop:3}}>
                <span className="tab" style={{fontSize:'var(--text-3xl)',fontWeight:'var(--weight-extrabold)',
                  color:(m.lucro||0)>=0?'#5FD6AC':'#FF8A98',letterSpacing:'var(--tracking-tight)',lineHeight:1.1}}>{BRL(m.lucro)}</span>
                <span className="tab" style={{fontSize:'var(--text-sm)',color:'var(--on-dark-muted)',fontWeight:'var(--weight-bold)'}}>({PCT(m.margem)})</span>
              </div>
            )}
            {!loading&&m.semCusto>0&&(
              <div style={{fontSize:'var(--text-xs)',color:'#FFC95C',marginTop:6,display:'flex',alignItems:'center',gap:5}}>
                <Icon name="alert-triangle" size={12} color="#FFC95C"/>{m.semCusto} {m.semCusto===1?'venda sem custo':'vendas sem custo'}
              </div>
            )}
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:'var(--space-2)',alignItems:'flex-end'}}>
          <ContaFilter contas={dados?.contas} ativas={contasAtivas} onToggle={toggleConta}/>
          <PeriodFilter value={periodo} onChange={setPeriodo}/>
        </div>
      </section>

      {/* KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'var(--layout-grid-gap)'}}>
        {loading?[...Array(4)].map((_,i)=>(
          <div key={i} style={{background:'var(--surface-card)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-xl)',
            padding:'var(--layout-card-pad)',boxShadow:'var(--shadow-sm)',display:'flex',flexDirection:'column',gap:'var(--space-3)'}}>
            <Skel w="55%" h={11}/><Skel h={28}/><Skel w="70%" h={11}/>
          </div>
        )):[
          {label:'Vendas',value:NUM(m.pedidosDia),caption:`${NUM(m.qtd)} unidades`,icon:'shopping-cart'},
          {label:'Ticket médio',value:BRL(m.ticketMedio),caption:'por pedido',icon:'tag',accent:'accent'},
          {label:'Lucro médio',value:BRL(m.pedidosDia>0?m.lucro/m.pedidosDia:0),caption:'por pedido',icon:'circle-dollar-sign',accent:'success',tone:(m.lucro||0)>=0?'success':'danger'},
          {label:'Canceladas',value:NUM(m.canceladas),caption:`${BRL(m.valorCancelado)} não faturados`,icon:'x-circle',accent:'danger'},
        ].map(c=><StatCard key={c.label} {...c}/>)}
      </div>

      {/* COMPOSIÇÃO DO FATURAMENTO */}
      {loading?(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'var(--layout-grid-gap)'}}>
          {[...Array(4)].map((_,i)=>(
            <div key={i} style={{background:'var(--surface-card)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-xl)',
              padding:'var(--layout-card-pad)',boxShadow:'var(--shadow-sm)',display:'flex',flexDirection:'column',gap:'var(--space-3)'}}>
              <Skel w="50%" h={11}/><Skel h={24}/><Skel h={6}/>
            </div>
          ))}
        </div>
      ):(
        <Card title="Composição do faturamento" subtitle={`O que sai de ${BRL(m.fat)}`}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:'var(--space-5)'}}>
            {[
              {label:'Custos',valor:m.custos,viz:1},
              {label:'Tarifas ML',valor:m.tarifas,viz:8},
              {label:'Impostos',valor:m.impostos,viz:3},
              {label:'Frete',valor:m.frete,viz:5},
              {label:'Lucro',valor:m.lucro,viz:4},
            ].map(c=>{
              const pct=m.fat>0?(c.valor||0)/m.fat*100:0;
              return (
                <div key={c.label} style={{display:'flex',flexDirection:'column',gap:7,minWidth:0}}>
                  <span style={{fontSize:'var(--text-xs)',color:'var(--text-muted)',fontWeight:'var(--weight-medium)'}}>{c.label}</span>
                  <span className="tab" style={{fontSize:'var(--text-xl)',fontWeight:'var(--weight-bold)',
                    letterSpacing:'var(--tracking-tight)',color:`var(--viz-${c.viz})`}}>{BRL(c.valor)}</span>
                  <div style={{height:6,background:'var(--viz-track)',borderRadius:'var(--radius-pill)',overflow:'hidden'}}>
                    <div style={{width:`${Math.max(0,Math.min(100,pct))}%`,height:'100%',background:`var(--viz-${c.viz})`,
                      borderRadius:'var(--radius-pill)',transition:'width var(--duration-slow) var(--ease-out)'}}/>
                  </div>
                  <span className="tab" style={{fontSize:'var(--text-xs)',color:'var(--text-subtle)'}}>
                    {m.fat>0?`${PCT(pct)} do faturamento`:'—'}
                  </span>
                </div>
              );
            })}
          </div>
        </Card>
      )}

      {/* ADS */}
      {!loading&&<PainelAds ads={ads} dataRef={m.from} onSalvo={onRefresh} periodoLabel={PLABEL[periodo]}/>}

      {/* PEDIDOS */}
      <div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'var(--space-3)',gap:'var(--space-3)'}}>
          <h2 style={{fontSize:'var(--text-lg)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)'}}>Últimos pedidos</h2>
          <Badge>{NUM(dados?.pedidos?.length||0)} no período</Badge>
        </div>
        <TabelaPedidos pedidos={dados?.pedidos?.slice(0,15)} loading={loading} multiConta={multiConta} onRefresh={onRefresh} onIrParaAnuncios={onIrParaAnuncios}/>
      </div>
    </div>
  );
}

/* ══ VIEW: ANÚNCIOS (edição em lote) ════════════════════════ */
function ViewAnuncios({dados,loading,onRefresh}){
  const [sync,setSync]=useState({loading:false,resumo:null,erro:''});

  async function sincronizar(){
    setSync({loading:true,resumo:null,erro:''});
    try{
      const r=await call('mlSincronizarAnuncios');
      setSync({loading:false,resumo:r.resumo,erro:''});
      onRefresh();
    }catch(e){
      setSync({loading:false,resumo:null,erro:e.message||'Falha ao sincronizar'});
    }
  }

  const [busca,setBusca]=useState('');
  const [rascunho,setRascunho]=useState({});   // {sku:{custo,imposto}}
  const [salvando,setSalvando]=useState(false);
  const [msg,setMsg]=useState('');
  const [soSemCusto,setSoSemCusto]=useState(false);
  const [impostoGlobal,setImpostoGlobal]=useState('');

  const todos=dados?.anuncios||[];
  const multiConta=(dados?.contasUsadas?.length||0)>1;

  // Reseta rascunho quando os dados recarregam
  useEffect(()=>{setRascunho({});setMsg('');},[dados]);

  const anuncios=todos.filter(a=>{
    if(soSemCusto){
      const r=rascunho[a.sku];
      const custoAtual=r?parseFloat(r.custo)||0:a.custo;
      if(custoAtual>0)return false;
    }
    if(!busca)return true;
    const q=busca.toLowerCase();
    return a.titulo.toLowerCase().includes(q)||String(a.sku).toLowerCase().includes(q);
  });

  // Valor atual de um campo: rascunho tem prioridade sobre o dado salvo
  const val=(a,campo)=>{
    const r=rascunho[a.sku];
    if(r&&r[campo]!==undefined)return r[campo];
    return a[campo]||'';
  };

  const setCampo=(sku,campo,v)=>{
    setRascunho(d=>({...d,[sku]:{...(d[sku]||{}),[campo]:v}}));
    setMsg('');
  };

  // Quantas linhas foram alteradas
  const alterados=Object.keys(rascunho).filter(sku=>{
    const a=todos.find(x=>String(x.sku)===String(sku));
    if(!a)return false;
    const r=rascunho[sku];
    const c=r.custo!==undefined?parseFloat(r.custo)||0:a.custo;
    const i=r.imposto!==undefined?parseFloat(r.imposto)||0:a.imposto;
    return c!==(a.custo||0)||i!==(a.imposto||0);
  });

  function aplicarImpostoTodos(){
    const v=parseFloat(impostoGlobal);
    if(isNaN(v)){setMsg('Digite uma porcentagem válida');return;}
    const novo={...rascunho};
    anuncios.forEach(a=>{novo[a.sku]={...(novo[a.sku]||{}),imposto:v};});
    setRascunho(novo);setMsg('');
  }

  async function salvarTudo(){
    if(alterados.length===0)return;
    setSalvando(true);setMsg('');
    try{
      const itens=alterados.map(sku=>{
        const a=todos.find(x=>String(x.sku)===String(sku));
        const r=rascunho[sku];
        return {
          sku,
          custo:   r.custo!==undefined?parseFloat(r.custo)||0:a.custo,
          imposto: r.imposto!==undefined?parseFloat(r.imposto)||0:a.imposto,
        };
      });
      await call('mlSalvarCustosLote',{itens});
      setMsg(`${itens.length} ${itens.length===1?'produto salvo':'produtos salvos'}`);
      setRascunho({});
      onRefresh();
    }catch(e){setMsg('Erro: '+e.message);}
    finally{setSalvando(false);}
  }

  const GRID=multiConta
    ? '56px minmax(0,1fr) 84px 96px 88px 60px 84px 104px 84px'
    : '56px minmax(0,1fr) 96px 88px 60px 84px 104px 84px';
  const HEADS=multiConta
    ? ['','Título','Conta','SKU','Preço','Est.','Visitas','Custo un.','Imp. %']
    : ['','Título','SKU','Preço','Est.','Visitas','Custo un.','Imp. %'];

  if(loading)return (
    <div style={{display:'flex',flexDirection:'column',gap:'var(--space-2)'}}>
      {[...Array(6)].map((_,i)=>(
        <div key={i} style={{background:'var(--surface-card)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-lg)',
          padding:'var(--space-4)',display:'flex',gap:'var(--space-3)',alignItems:'center',boxShadow:'var(--shadow-sm)'}}>
          <Skel w={48} h={48} r="var(--radius-md)"/>
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:7}}><Skel h={13}/><Skel w="40%" h={11}/></div>
          <Skel w={72} h={24}/>
        </div>
      ))}
    </div>
  );

  const semCustoTotal=todos.filter(a=>!a.custo).length;

  return (
    <div style={{paddingBottom:alterados.length>0?88:0}}>

      {/* Barra de ferramentas */}
      <div style={{display:'flex',gap:'var(--space-2)',flexWrap:'wrap',alignItems:'center',marginBottom:'var(--space-4)'}}>
        <div style={{position:'relative',flex:'1 1 260px',maxWidth:380}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',display:'flex'}}>
            <Icon name="search" size={16} color="var(--text-subtle)"/>
          </span>
          <input className="fld" value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por título ou SKU"
            style={{height:'var(--control-h-md)',padding:'0 12px 0 38px'}}/>
        </div>

        <button onClick={()=>setSoSemCusto(v=>!v)} aria-pressed={soSemCusto}
          style={{display:'inline-flex',alignItems:'center',gap:7,height:'var(--control-h-md)',padding:'0 13px',
            borderRadius:'var(--radius-md)',cursor:'pointer',fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',transition:'var(--tr)',
            background:soSemCusto?'var(--status-warning-bg)':'var(--surface-card)',
            border:`1px solid ${soSemCusto?'var(--status-warning-solid)':'var(--border-default)'}`,
            color:soSemCusto?'var(--status-warning-fg)':'var(--text-body)',boxShadow:'var(--shadow-xs)'}}>
          <Icon name="alert-triangle" size={15}/>Sem custo ({NUM(semCustoTotal)})
        </button>

        <div style={{display:'flex',alignItems:'center',gap:'var(--space-2)',marginLeft:'auto'}}>
          <div style={{position:'relative',width:118}}>
            <input className="fld mono" type="number" step="0.1" value={impostoGlobal} onChange={e=>setImpostoGlobal(e.target.value)}
              placeholder="0,0" aria-label="Imposto em porcentagem" style={{height:'var(--control-h-md)',padding:'0 30px 0 12px'}}/>
            <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',fontSize:'var(--text-sm)',color:'var(--text-muted)',pointerEvents:'none'}}>%</span>
          </div>
          <Btn variant="neutral" size="md" onClick={aplicarImpostoTodos}>Aplicar a todos</Btn>
          <Btn variant="secondary" size="md" icon="refresh-cw" onClick={sincronizar} disabled={sync.loading}>
            {sync.loading?'Sincronizando…':'Buscar novos'}
          </Btn>
        </div>
      </div>

      {/* Resultado da sincronizacao */}
      {sync.erro&&(
        <div style={{marginBottom:'var(--layout-grid-gap)'}}>
          <Note tone="danger" icon="alert-octagon">{sync.erro}</Note>
        </div>
      )}
      {sync.resumo&&(
        <div style={{marginBottom:'var(--layout-grid-gap)'}}>
          <Note tone="success" icon="check-circle-2">
            {sync.resumo.map((r,i)=>(
              <span key={i}>
                {i>0&&' · '}
                <strong>{r.conta}</strong>{r.erro
                  ? `: ${r.erro}`
                  : `: ${r.total} anúncios (${r.ativos} ativos, ${r.pausados} pausados)${r.semCusto>0?` — ${r.semCusto} sem custo`:''}`}
              </span>
            ))}
          </Note>
        </div>
      )}

      {/* Tabela */}
      <Card pad={false} style={{overflow:'auto'}}>
        <div style={{minWidth:multiConta?1080:1000}}>
          <div style={{display:'grid',gridTemplateColumns:GRID,gap:8,padding:'11px var(--layout-card-pad)',
            background:'var(--surface-sunken)',borderBottom:'1px solid var(--border-default)',position:'sticky',top:0,zIndex:2}}>
            {HEADS.map((h,i)=><THead key={i} align={i>=HEADS.length-6&&h?'right':'left'}>{h}</THead>)}
          </div>

          {anuncios.map((a,i)=>{
            const custoV=val(a,'custo'),impV=val(a,'imposto');
            const c=parseFloat(custoV)||0,imp=parseFloat(impV)||0;
            const editado=rascunho[a.sku]!==undefined;

            return (
              <div key={a.id} style={{display:'grid',gridTemplateColumns:GRID,gap:8,padding:'10px var(--layout-card-pad)',
                alignItems:'center',borderBottom:'1px solid var(--border-subtle)',
                background:editado?'var(--surface-selected)':'transparent',
                transition:'background-color var(--duration-fast) var(--ease-standard)'}}>
                <Thumb src={a.foto} alt={a.titulo} size={48}/>
                <div style={{minWidth:0}}>
                  <div className="ell" title={a.titulo} style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',color:'var(--text-strong)'}}>{a.titulo}</div>
                  <div style={{marginTop:5,display:'flex',gap:6,alignItems:'center'}}>
                    <Badge tone={a.status==='active'?'success':'neutral'} dot>{a.status==='active'?'Ativo':'Inativo'}</Badge>
                    <span className="tab" style={{fontSize:'var(--text-xs)',color:'var(--text-subtle)'}}>{NUM(a.vendas)} vendas</span>
                  </div>
                </div>
                {multiConta&&<div className="ell" style={{fontSize:'var(--text-xs)',color:'var(--text-muted)'}}>{a.conta}</div>}
                <div className="ell mono" title={a.sku} style={{fontSize:'var(--text-2xs)',color:'var(--text-muted)'}}>{a.sku}</div>
                <div className="tab" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)',textAlign:'right'}}>{BRL(a.preco)}</div>
                <div className="tab" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',textAlign:'right',
                  color:a.estoque<=3?'var(--status-danger-fg)':'var(--text-body)'}}>{NUM(a.estoque)}</div>
                <div className="tab" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-medium)',textAlign:'right',
                  color:a.visitas>0?'var(--text-body)':'var(--text-subtle)'}}>{NUM(a.visitas)}</div>
                <div style={{position:'relative'}}>
                  <span style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',fontSize:'var(--text-2xs)',color:'var(--text-muted)',pointerEvents:'none'}}>R$</span>
                  <input className="fld mono" type="number" step="0.01" value={custoV} placeholder="0,00"
                    aria-label={`Custo unitário de ${a.titulo}`}
                    onChange={e=>setCampo(a.sku,'custo',e.target.value)}
                    style={{height:'var(--control-h-sm)',padding:'0 8px 0 28px',fontSize:'var(--text-xs)',textAlign:'right'}}/>
                </div>
                <div>
                  <input className="fld mono" type="number" step="0.1" value={impV} placeholder="0"
                    aria-label={`Imposto de ${a.titulo}`}
                    onChange={e=>setCampo(a.sku,'imposto',e.target.value)}
                    style={{height:'var(--control-h-sm)',padding:'0 8px',fontSize:'var(--text-xs)',textAlign:'right'}}/>
                </div>
              </div>
            );
          })}

          {anuncios.length===0&&(
            <Empty icon="package-search"
              title={busca||soSemCusto?'Nenhum anúncio encontrado':'Nenhum anúncio ativo'}
              description={busca||soSemCusto?'Ajuste a busca ou desligue o filtro de custo.':undefined}
              action={(busca||soSemCusto)&&<Btn variant="neutral" size="sm" onClick={()=>{setBusca('');setSoSemCusto(false);}}>Limpar filtros</Btn>}/>
          )}
        </div>
      </Card>

      {/* Mensagem de sucesso sem alterações pendentes */}
      {alterados.length===0&&msg&&(
        <div style={{marginTop:'var(--space-3)',display:'inline-flex'}}>
          <Note tone={msg.startsWith('Erro')?'danger':'success'} icon={msg.startsWith('Erro')?'alert-octagon':'check-circle-2'}>{msg}</Note>
        </div>
      )}

      <p style={{fontSize:'var(--text-xs)',color:'var(--on-dark-muted)',marginTop:'var(--space-3)',lineHeight:1.6}}>
        O Mercado Livre consolida as visitas em até 48 horas — os números de hoje costumam aparecer baixos ou zerados.
        Use "Buscar novos" depois de criar anúncios para trazê-los ao sistema.
      </p>

      {/* Barra fixa de salvar */}
      {alterados.length>0&&(
        <div style={{position:'fixed',bottom:0,left:0,right:0,background:'var(--surface-nav)',borderTop:'1px solid var(--border-inverse)',
          padding:'var(--space-3) var(--layout-gutter)',display:'flex',alignItems:'center',justifyContent:'space-between',
          gap:'var(--space-3)',flexWrap:'wrap',zIndex:50,boxShadow:'var(--shadow-lg)',
          paddingBottom:'calc(var(--space-3) + env(safe-area-inset-bottom))'}}>
          <div style={{display:'flex',alignItems:'center',gap:'var(--space-3)',flexWrap:'wrap'}}>
            <Icon name="pencil" size={16} color="var(--action-primary)"/>
            <span style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-bold)',color:'#fff'}}>
              {alterados.length} {alterados.length===1?'produto alterado':'produtos alterados'}
            </span>
            {msg&&<span style={{fontSize:'var(--text-sm)',color:msg.startsWith('Erro')?'#FF8A98':'#5FD6AC'}}>{msg}</span>}
          </div>
          <div style={{display:'flex',gap:'var(--space-2)'}}>
            <Btn variant="dark" size="md" onClick={()=>{setRascunho({});setMsg('');}}>Descartar</Btn>
            <Btn size="md" icon="check" onClick={salvarTudo} disabled={salvando}>{salvando?'Salvando…':'Salvar tudo'}</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══ VIEW: CONTAS ═══════════════════════════════════════════ */
function ViewContas({dados,onRefresh}){
  const [removendo,setRemovendo]=useState(null);
  const [diag,setDiag]=useState({loading:false,resultado:null,erro:''});
  const contas=dados?.contas||[];

  async function rodarDiagnostico(){
    setDiag({loading:true,resultado:null,erro:''});
    try{
      const r=await call('mlDiagnosticoAds');
      setDiag({loading:false,resultado:r,erro:''});
    }catch(e){
      setDiag({loading:false,resultado:null,erro:e.message||'Falha ao rodar diagnóstico'});
    }
  }

  async function remover(id){
    if(!confirm('Remover esta conta? Os dados dela deixarão de aparecer.'))return;
    setRemovendo(id);
    try{await call('mlRemoverConta',{contaId:id});onRefresh();}
    catch(e){alert('Erro: '+e.message);}
    finally{setRemovendo(null);}
  }

  const conectar=()=>{window.location.href=`https://auth.mercadolivre.com.br/authorization?response_type=code&client_id=${ML_CLIENT_ID}&redirect_uri=${encodeURIComponent(ML_REDIRECT)}`};

  return (
    <div style={{maxWidth:660,display:'flex',flexDirection:'column',gap:'var(--layout-grid-gap)'}}>
      <Card title="Contas conectadas" pad={false}>
        <div style={{borderTop:'1px solid var(--border-subtle)'}}>
          {contas.map((c,i)=>(
            <div key={c.id} style={{padding:'14px var(--layout-card-pad)',borderBottom:i<contas.length-1?'1px solid var(--border-subtle)':'none',
              display:'flex',alignItems:'center',gap:'var(--space-3)'}}>
              <span style={{width:40,height:40,borderRadius:'var(--radius-md)',background:'var(--status-brand-bg)',
                display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <Icon name="store" size={18} color="var(--status-brand-solid)"/>
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div className="ell" style={{fontSize:'var(--text-md)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)'}}>{c.nickname}</div>
                <div className="mono" style={{fontSize:'var(--text-xs)',color:'var(--text-subtle)'}}>ID {c.id}</div>
              </div>
              <Badge tone="success" dot>Conectada</Badge>
              <IconBtn icon="trash-2" label={`Remover ${c.nickname}`} tone="danger" onClick={()=>remover(c.id)} disabled={removendo===c.id}/>
            </div>
          ))}
          {contas.length===0&&<Empty icon="store" title="Nenhuma conta conectada" description="Conecte sua primeira conta do Mercado Livre para começar." compact/>}
        </div>
      </Card>

      <Card title="Adicionar outra conta">
        <p style={{fontSize:'var(--text-sm)',color:'var(--text-body)',marginBottom:'var(--space-4)',lineHeight:1.6}}>
          Conecte quantas contas do Mercado Livre quiser. Os dados são somados no dashboard e você pode filtrar por conta.
        </p>
        <div style={{marginBottom:'var(--space-4)'}}>
          <Note tone="warning" icon="alert-triangle">
            Antes de clicar, <strong>saia da conta atual no site do Mercado Livre</strong> (ou use uma janela anônima).
            Continuando logado na mesma conta, o ML reconecta ela de novo em vez da nova.
          </Note>
        </div>
        <div style={{display:'flex',gap:'var(--space-2)',flexWrap:'wrap'}}>
          <Btn icon="plus" onClick={conectar}>Conectar nova conta</Btn>
          <Btn variant="secondary" icon="external-link" onClick={()=>window.open('https://www.mercadolivre.com.br/jms/mlb/lgz/logout','_blank')}>
            Sair do ML primeiro
          </Btn>
        </div>
      </Card>

      <Card title="Diagnóstico do Product Ads">
        <p style={{fontSize:'var(--text-sm)',color:'var(--text-body)',marginBottom:'var(--space-4)',lineHeight:1.6}}>
          Roda um teste em cada rota da API de publicidade do Mercado Livre e mostra a resposta crua.
          Use quando os dados de ads não estiverem vindo automaticamente.
        </p>
        <Btn variant="secondary" icon="stethoscope" onClick={rodarDiagnostico} disabled={diag.loading}>
          {diag.loading?'Testando rotas…':'Rodar diagnóstico'}
        </Btn>

        {diag.erro&&(
          <div style={{marginTop:'var(--space-4)'}}>
            <Note tone="danger" icon="alert-octagon">{diag.erro}</Note>
          </div>
        )}

        {diag.resultado&&(
          <div style={{marginTop:'var(--space-4)'}}>
            {diag.resultado.diagnostico.map(c=>(
              <div key={c.userId} style={{marginBottom:'var(--space-5)'}}>
                <div style={{fontSize:'var(--text-md)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)',marginBottom:'var(--space-2)',
                  display:'flex',alignItems:'center',gap:'var(--space-2)'}}>
                  <Icon name="store" size={15} color="var(--status-brand-solid)"/>{c.conta}
                </div>
                {c.testes.map((t,i)=>(
                  <div key={i} style={{borderTop:'1px solid var(--border-subtle)',padding:'var(--space-3) 0'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'var(--space-2)',marginBottom:6,flexWrap:'wrap'}}>
                      <Badge tone={t.status===200?'success':t.status===404?'warning':'danger'}>{t.status}</Badge>
                      <span className="mono" style={{fontSize:'var(--text-xs)',color:'var(--text-body)',wordBreak:'break-all'}}>{t.nome}</span>
                    </div>
                    <div className="mono" style={{background:'var(--surface-sunken)',borderRadius:'var(--radius-sm)',padding:'8px 10px',
                      fontSize:11,lineHeight:1.6,color:'var(--text-subtle)',wordBreak:'break-all',maxHeight:120,overflow:'auto'}}>
                      {t.resumo}
                    </div>
                  </div>
                ))}
              </div>
            ))}
            <Note tone="info" icon="info">
              Copie esse resultado e me mande. Com os códigos e as respostas eu descubro qual rota sua conta aceita.
            </Note>
          </div>
        )}
      </Card>
    </div>
  );
}

/* ══ VIEW: ANÁLISE IA ═══════════════════════════════════════
   ATENÇÃO: a chamada abaixo vai direto do navegador para a API da Anthropic.
   Isso não funciona em produção (faltam os headers x-api-key e anthropic-version,
   e o CORS bloqueia). Mova para uma Cloud Function 'mlAnalisarIA' e troque o
   fetch por: const d = await call('mlAnalisarIA', {periodo, metricas, ads, top, ped});
   Nunca coloque a chave da API neste arquivo — ele é público. */
function ViewIA({dados,periodo}){
  const [analise,setAnalise]=useState(''),[loading,setLoading]=useState(false);
  async function gerar(){
    if(!dados)return;
    setLoading(true);setAnalise('');
    const top=dados.anuncios?.slice(0,15).map(a=>({titulo:a.titulo,preco:BRL(a.preco),visitas:a.visitas,estoque:a.estoque,vendas:a.vendas,custo:a.custo}));
    const ped=dados.pedidos?.slice(0,10).map(p=>({titulo:p.titulo,valor:BRL(p.valor),lucro:BRL(p.lucro),margem:PCT(p.margem)}));
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,
          system:`Você é especialista em Mercado Livre e gestão de e-commerce. Analise os dados e entregue:\n\nDIAGNÓSTICO\nPontos fortes e de atenção do período.\n\nANÁLISE DE MARGEM\nComente a margem e onde há espaço de melhoria.\n\nTOP 3 AÇÕES\nAções concretas e priorizadas.\n\nALERTAS\nEstoque crítico, produtos sem custo cadastrado, margem negativa.\n\nSeja direto, use os números reais. Não use emoji.`,
          messages:[{role:'user',content:`Período: ${PLABEL[periodo]}\nMétricas: ${JSON.stringify(dados.metricas)}\nAds: ${JSON.stringify(dados.ads)}\nTop anúncios: ${JSON.stringify(top)}\nPedidos recentes: ${JSON.stringify(ped)}`}]})});
      const d=await r.json();
      setAnalise(d.content?.[0]?.text||'Erro ao gerar análise');
    }catch(e){setAnalise('Erro: '+e.message);}
    finally{setLoading(false);}
  }
  return (
    <div style={{maxWidth:780}}>
      {!loading&&!analise&&(
        <Card>
          <Empty icon="sparkles" title="Diagnóstico da conta com IA"
            description="Análise das métricas do período, margem por produto e as próximas ações prioritárias."
            action={<Btn onClick={gerar} icon="sparkles">Gerar análise</Btn>}/>
        </Card>
      )}
      {loading&&(
        <Card>
          <div style={{display:'flex',flexDirection:'column',gap:'var(--space-3)',padding:'var(--space-4) 0'}}>
            <Skel w="40%" h={13}/><Skel h={13}/><Skel h={13}/><Skel w="75%" h={13}/>
            <div style={{height:'var(--space-4)'}}/>
            <Skel w="35%" h={13}/><Skel h={13}/><Skel w="60%" h={13}/>
            <div style={{fontSize:'var(--text-sm)',color:'var(--text-muted)',marginTop:'var(--space-3)'}}>Analisando sua conta…</div>
          </div>
        </Card>
      )}
      {analise&&(
        <Card>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'var(--space-3)',flexWrap:'wrap',marginBottom:'var(--space-4)'}}>
            <Overline>Diagnóstico · {new Date().toLocaleDateString('pt-BR')} · {PLABEL[periodo]}</Overline>
            <Btn variant="neutral" size="sm" onClick={gerar} icon="refresh-cw">Reanalisar</Btn>
          </div>
          <div style={{fontSize:'var(--text-md)',color:'var(--text-body)',lineHeight:1.75,whiteSpace:'pre-wrap',textWrap:'pretty'}}>{analise}</div>
        </Card>
      )}
    </div>
  );
}

/* ══ APP LOGADO ═════════════════════════════════════════════ */
function AppLogado({user,erroConexao}){
  const [view,setView]=useState('dashboard');
  const [periodo,setPeriodo]=useState('hoje');
  const [dados,setDados]=useState(null);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  const [contasAtivas,setContasAtivas]=useState([]);
  const [isMobile,setIsMobile]=useState(window.innerWidth<1024);
  const [drawer,setDrawer]=useState(false);

  useEffect(()=>{
    const mq=window.matchMedia('(max-width: 1023px)');
    const h=()=>setIsMobile(mq.matches);
    h();mq.addEventListener('change',h);
    return()=>mq.removeEventListener('change',h);
  },[]);

  useEffect(()=>{carregar();},[periodo,contasAtivas]);

  async function carregar(){
    setLoading(true);setErr('');
    try{
      const r=await call('mlGetDados',{periodo,contas:contasAtivas.length?contasAtivas:null});
      setDados({...r,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
      if(contasAtivas.length===0&&r.contas?.length)setContasAtivas(r.contas.filter(c=>c.ativa).map(c=>c.id));
    }catch(e){setErr('Erro ao carregar: '+e.message);}
    finally{setLoading(false);}
  }

  const toggleConta=id=>setContasAtivas(a=>a.includes(id)?(a.length>1?a.filter(x=>x!==id):a):[...a,id]);
  const multiConta=(dados?.contasUsadas?.length||0)>1;
  const titulo=NAV.find(n=>n.id===view)?.label;

  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--surface-page)'}}>
      {!isMobile&&<Sidebar active={view} onSelect={setView} seller={dados?.seller} onSair={()=>auth.signOut()}/>}
      {isMobile&&<Drawer open={drawer} onClose={()=>setDrawer(false)} active={view} onSelect={setView} seller={dados?.seller} onSair={()=>auth.signOut()}/>}

      <div style={{marginLeft:isMobile?0:'var(--layout-sidebar-w)',flex:1,minWidth:0,display:'flex',flexDirection:'column',
        minHeight:'100vh',paddingBottom:isMobile?'calc(var(--layout-bottomnav-h) + env(safe-area-inset-bottom))':0}}>

        {/* TopBar — clara, na área de trabalho */}
        <header style={{minHeight:'var(--layout-topbar-h)',background:'var(--surface-card)',
          borderBottom:'1px solid var(--border-subtle)',display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:isMobile?'0 var(--layout-gutter-mobile)':'0 var(--layout-gutter)',gap:'var(--space-3)',
          position:'sticky',top:0,zIndex:20}}>
          <div style={{display:'flex',alignItems:'center',gap:'var(--space-2)',minWidth:0}}>
            {isMobile&&<IconBtn icon="menu" label="Abrir menu" onClick={()=>setDrawer(true)}/>}
            <h1 className="ell" style={{fontSize:'var(--text-lg)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)'}}>{titulo}</h1>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'var(--space-2)',flexShrink:0}}>
            {dados?.hora&&!isMobile&&<span className="tab" style={{fontSize:'var(--text-xs)',color:'var(--text-subtle)'}}>Atualizado {dados.hora}</span>}
            {isMobile
              ? <IconBtn icon="refresh-cw" label="Atualizar" onClick={carregar} disabled={loading}/>
              : <Btn variant="neutral" size="sm" icon="refresh-cw" onClick={carregar} disabled={loading}>{loading?'Atualizando…':'Atualizar'}</Btn>}
          </div>
        </header>

        <main style={{flex:1,padding:isMobile?'var(--layout-gutter-mobile)':'var(--layout-gutter)',
          maxWidth:'var(--layout-max-content)',width:'100%',minWidth:0}}>
          {(err||erroConexao)&&<div style={{marginBottom:'var(--layout-grid-gap)'}}>
            <Note tone="danger" icon="alert-octagon">{err||erroConexao}</Note>
          </div>}

          {view==='dashboard'&&<ViewDashboard dados={dados} loading={loading} periodo={periodo} setPeriodo={setPeriodo} contasAtivas={contasAtivas} toggleConta={toggleConta} onRefresh={carregar} onIrParaAnuncios={()=>setView('anuncios')}/>}

          {view==='pedidos'&&(
            <div>
              <section style={{background:'var(--surface-nav)',borderRadius:'var(--radius-2xl)',padding:'var(--space-4) var(--space-5)',
                display:'flex',alignItems:'center',justifyContent:'space-between',gap:'var(--space-3)',flexWrap:'wrap',marginBottom:'var(--layout-grid-gap)'}}>
                <div style={{display:'flex',alignItems:'baseline',gap:'var(--space-2)'}}>
                  <span className="tab" style={{fontSize:'var(--text-2xl)',fontWeight:'var(--weight-extrabold)',color:'#fff',letterSpacing:'var(--tracking-tight)'}}>{NUM(dados?.pedidos?.length||0)}</span>
                  <span style={{fontSize:'var(--text-sm)',color:'var(--on-dark-muted)'}}>pedidos no período</span>
                </div>
                <div style={{display:'flex',gap:'var(--space-2)',flexWrap:'wrap',justifyContent:'flex-end'}}>
                  <ContaFilter contas={dados?.contas} ativas={contasAtivas} onToggle={toggleConta}/>
                  <PeriodFilter value={periodo} onChange={setPeriodo}/>
                </div>
              </section>
              <TabelaPedidos pedidos={dados?.pedidos} loading={loading} multiConta={multiConta} onRefresh={carregar} onIrParaAnuncios={()=>setView('anuncios')}/>
            </div>
          )}

          {view==='anuncios'&&<ViewAnuncios dados={dados} loading={loading} onRefresh={carregar}/>}
          {view==='ia'&&<ViewIA dados={dados} periodo={periodo}/>}
          {view==='contas'&&<ViewContas dados={dados} onRefresh={carregar}/>}
        </main>
      </div>

      {isMobile&&<BottomNav active={view} onSelect={setView}/>}
    </div>
  );
}

/* ══ ROOT ═══════════════════════════════════════════════════ */
function App(){
  const [user,setUser]=useState(undefined),[mlOk,setMlOk]=useState(null),[chk,setChk]=useState(false);
  const [conectandoConta,setConectandoConta]=useState(false);
  const [erroConexao,setErroConexao]=useState('');
  const [nonce,setNonce]=useState(0);

  // Troca o code do OAuth por token — exatamente uma vez por carregamento.
  // Roda tanto na 1a conexao quanto ao adicionar contas extras.
  useEffect(()=>{
    if(!user||!OAUTH_CODE||OAUTH_CONSUMIDO)return;
    OAUTH_CONSUMIDO=true;
    (async()=>{
      setConectandoConta(true);setErroConexao('');
      try{
        const r=await call('mlTokenExchange',{code:OAUTH_CODE});
        if(r.success){setMlOk(true);setNonce(n=>n+1);}
      }catch(e){
        const m=String(e.message||'');
        setErroConexao(
          /invalid_grant|already used|expired/i.test(m)
            ? 'O código de autorização expirou ou já foi usado. Clique em "Conectar nova conta" novamente.'
            : (m||'Não foi possível conectar a conta')
        );
      }finally{setConectandoConta(false);}
    })();
  },[user]);

  useEffect(()=>auth.onAuthStateChanged(async u=>{
    setUser(u);
    if(u){
      setChk(true);
      try{
        const c=await call('mlListarContas');
        setMlOk((c.contas?.length||0)>0);
      }catch{
        try{
          const s=await db.collection('users').doc(u.uid).collection('mlTokens').doc('main').get();
          setMlOk(s.exists);
        }catch{setMlOk(false);}
      }finally{setChk(false);}
    }else setMlOk(null);
  }),[]);

  if(user===undefined||chk)return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--surface-nav)',alignItems:'center',justifyContent:'center'}}>
      <Logo height={24} inverse/>
    </div>
  );
  if(!user)return <TelaLogin/>;

  if(conectandoConta)return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--surface-nav)',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'var(--space-4)'}}>
      <Logo height={24} inverse/>
      <div style={{fontSize:'var(--text-sm)',color:'var(--on-dark-muted)'}}>Conectando conta do Mercado Livre…</div>
    </div>
  );

  if(!mlOk)return <TelaConectar user={user} onOk={()=>setMlOk(true)} erro={erroConexao}/>;
  return <AppLogado user={user} key={nonce} erroConexao={erroConexao}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
