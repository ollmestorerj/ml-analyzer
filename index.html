/* ══ FILTROS ════════════════════════════════════════════════ */
const PERIODOS=['hoje','ontem','7d','30d','mes'];
const PLABEL={hoje:'Hoje',ontem:'Ontem','7d':'7 dias','30d':'30 dias',mes:'Mês atual',personalizado:'Período'};

// AAAA-MM-DD de hoje no fuso de Brasília
const hojeISO=()=>new Date(Date.now()-3*3600000).toISOString().split('T')[0];
const diasISO=n=>{const d=new Date(Date.now()-3*3600000);d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];};
const fmtData=d=>d?d.split('-').reverse().join('/'):'';
const contaDias=(a,b)=>a&&b?Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/86400000)+1:0;
/* Pílulas sobre a faixa escura (casca) */
const PeriodFilter=({value,onChange,intervalo,onIntervalo})=>{
  const [aberto,setAberto]=useState(false);
  const [de,setDe]=useState(intervalo?.from||diasISO(-6));
  const [ate,setAte]=useState(intervalo?.to||hojeISO());
  const [erro,setErro]=useState('');
  const caixa=useRef(null);

  useEffect(()=>{
    if(!aberto)return;
    const fora=e=>{if(caixa.current&&!caixa.current.contains(e.target))setAberto(false);};
    const esc=e=>{if(e.key==='Escape')setAberto(false);};
    document.addEventListener('mousedown',fora);
    document.addEventListener('keydown',esc);
    return()=>{document.removeEventListener('mousedown',fora);document.removeEventListener('keydown',esc);};
  },[aberto]);

  useEffect(()=>{
    if(intervalo?.from)setDe(intervalo.from);
    if(intervalo?.to)setAte(intervalo.to);
  },[intervalo]);

  function aplicar(){
    if(!de||!ate){setErro('Escolha as duas datas');return;}
    let a=de,b=ate;
    if(a>b){const t=a;a=b;b=t;}
    const dias=contaDias(a,b);
    if(dias>180){setErro('No máximo 180 dias por vez');return;}
    if(b>hojeISO()){setErro('A data final não pode ser no futuro');return;}
    setErro('');setAberto(false);
    onIntervalo({from:a,to:b});
  }

  // Atalhos comuns dentro do seletor
  const atalhos=[
    ['Últimos 10 dias', diasISO(-9),  hojeISO()],
    ['Últimos 15 dias', diasISO(-14), hojeISO()],
    ['Últimos 90 dias', diasISO(-89), hojeISO()],
    ['Mês passado',     (()=>{const d=new Date(Date.now()-3*3600000);d.setDate(1);d.setMonth(d.getMonth()-1);return d.toISOString().split('T')[0];})(),
                        (()=>{const d=new Date(Date.now()-3*3600000);d.setDate(0);return d.toISOString().split('T')[0];})()],
  ];

  const ativo=value==='personalizado';
  const rotuloIntervalo=ativo&&intervalo
    ? (intervalo.from===intervalo.to ? fmtData(intervalo.from) : `${fmtData(intervalo.from)} – ${fmtData(intervalo.to)}`)
    : 'Escolher período';

  const pill=(on)=>({height:32,padding:'0 13px',borderRadius:'var(--radius-pill)',fontSize:'var(--text-xs)',
    fontWeight:'var(--weight-semibold)',cursor:'pointer',transition:'var(--tr)',
    background:on?'var(--purple-500)':'var(--surface-card)',color:on?'#fff':'var(--text-body)',
    border:`1px solid ${on?'var(--purple-500)':'var(--border-default)'}`});

  return (
    <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
      {PERIODOS.map(p=>{
        const on=value===p;
        return <button key={p} onClick={()=>onChange(p)} aria-pressed={on} style={pill(on)}>{PLABEL[p]}</button>;
      })}

      {/* Intervalo personalizado */}
      <div ref={caixa} style={{position:'relative'}}>
        <button onClick={()=>setAberto(v=>!v)} aria-pressed={ativo} aria-expanded={aberto}
          style={{...pill(ativo),display:'inline-flex',alignItems:'center',gap:6}}>
          <Icon name="calendar-range" size={13}/>
          {rotuloIntervalo}
          <Icon name={aberto?'chevron-up':'chevron-down'} size={13}/>
        </button>

        {aberto&&(
          <div style={{position:'absolute',top:'calc(100% + 6px)',right:0,zIndex:40,width:296,
            background:'var(--surface-card)',border:'1px solid var(--border-default)',
            borderRadius:'var(--radius-xl)',boxShadow:'var(--shadow-lg)',padding:'var(--space-4)'}}>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'var(--space-3)',marginBottom:'var(--space-3)'}}>
              {[['De',de,setDe],['Até',ate,setAte]].map(([lbl,val,set])=>(

/* ══ PAGINAÇÃO ══════════════════════════════════════════════ */
const POR_PAGINA = 50;
// Hook: fatia uma lista em páginas e reseta ao trocar de filtro
function usePaginacao(lista, deps=[]) {
  const [pagina,setPagina] = useState(1);
  const total   = lista?.length || 0;
  const paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
  useEffect(()=>{ setPagina(1); }, deps);
  useEffect(()=>{ if(pagina>paginas) setPagina(paginas); }, [paginas,pagina]);
  const inicio = (pagina-1) * POR_PAGINA;
  const fatia  = (lista||[]).slice(inicio, inicio + POR_PAGINA);
  return { pagina, setPagina, paginas, total, fatia, inicio, fim: inicio + fatia.length };
}
function Paginacao({ pagina, setPagina, paginas, total, inicio, fim, rotulo='itens' }) {
  if (total === 0) return null;
  // Janela de páginas: 1 … 4 5 [6] 7 8 … 20
  const nums = [];
  const range = (a,b) => { for(let i=a;i<=b;i++) nums.push(i); };
  if (paginas <= 7) range(1,paginas);
  else if (pagina <= 4) { range(1,5); nums.push('…'); nums.push(paginas); }
  else if (pagina >= paginas-3) { nums.push(1); nums.push('…'); range(paginas-4,paginas); }
  else { nums.push(1); nums.push('…'); range(pagina-1,pagina+1); nums.push('…'); nums.push(paginas); }
  const btn = (conteudo, onClick, ativo, desabilitado, key) => (
    <button key={key} onClick={onClick} disabled={desabilitado}
      aria-current={ativo?'page':undefined}
      style={{minWidth:32,height:32,padding:'0 9px',borderRadius:'var(--radius-md)',
        fontSize:'var(--text-xs)',fontWeight:'var(--weight-semibold)',
        cursor:desabilitado?'default':'pointer',transition:'var(--tr)',
        background:ativo?'var(--action-primary)':'var(--surface-card)',
        color:ativo?'#fff':desabilitado?'var(--text-disabled)':'var(--text-body)',
        border:`1px solid ${ativo?'var(--action-primary)':'var(--border-default)'}`,
        boxShadow:ativo?'none':'var(--shadow-xs)',
        display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
      {conteudo}
    </button>
  );
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'var(--space-3)',
      flexWrap:'wrap',padding:'var(--space-3) var(--layout-card-pad)',
      borderTop:'1px solid var(--border-subtle)',background:'var(--surface-sunken)'}}>
      <span className="tab" style={{fontSize:'var(--text-xs)',color:'var(--text-muted)'}}>
        {inicio+1}–{fim} de {NUM(total)} {rotulo}
      </span>
      {paginas > 1 && (
        <div style={{display:'flex',gap:4,alignItems:'center',flexWrap:'wrap'}}>
          {btn(<Icon name="chevron-left" size={14}/>, ()=>setPagina(p=>Math.max(1,p-1)), false, pagina===1, 'prev')}
          {nums.map((n,i)=> n==='…'
            ? <span key={`e${i}`} style={{padding:'0 4px',color:'var(--text-disabled)',fontSize:'var(--text-xs)'}}>…</span>
            : btn(n, ()=>setPagina(n), n===pagina, false, n))}
          {btn(<Icon name="chevron-right" size={14}/>, ()=>setPagina(p=>Math.min(paginas,p+1)), false, pagina===paginas, 'next')}
        </div>
      )}
    </div>
  );
}

function TabelaPedidos({pedidos,loading,multiConta,onRefresh,onIrParaAnuncios,paginar=true,resetKey,initialFilter='todos'}){

  useEffect(()=>setFiltro(initialFilter),[initialFilter]);

  // Momento do pedido em milissegundos — usado para ordenar por data

    const t=new Date(p.dataISO||'').getTime();
    return Number.isFinite(t)?t:0;
  };
  // Desempate pelo id (o ML numera crescente, então id maior é mais novo)
  const porId=(a,b)=>String(b.id).localeCompare(String(a.id),undefined,{numeric:true});

  const filtrados=(pedidos||[]).filter(p=>filtro==='todos'||(filtro==='prejuizo'?p.temCusto&&p.lucro<0:!p.temCusto));

  if(ordem==='valor')  filtrados.sort((a,b)=>(b.valor||0)-(a.valor||0));

          {auto&&ads?.campanhas?.length>0&&(
            <Btn variant="neutral" size="sm" icon={verCampanhas?'chevron-up':'list'} onClick={()=>setVerCampanhas(v=>!v)}>
              {ads.campanhas.length} {ads.campanhas.length===1?'campanha':'campanhas'}
            </Btn>
          )}
          {!auto&&(!editing
            ? <Btn variant="neutral" size="sm" icon="pencil" onClick={()=>setEditing(true)}>Editar</Btn>
            : <>
                <Btn size="sm" onClick={salvar} disabled={saving}>{saving?'Salvando…':'Salvar'}</Btn>
                <Btn variant="ghost" size="sm" onClick={()=>setEditing(false)}>Cancelar</Btn>
              </>)}
        </div>
      }>
      {editing&&!auto?(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:'var(--space-4)'}}>
          {[['Investimento','R$',inv,setInv,'0.01'],['Receita','R$',rec,setRec,'0.01'],['Vendas',null,vnd,setVnd,'1']].map(([lbl,pfx,v,set,step])=>(
            <div key={lbl}>
              <label style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',color:'var(--text-body)',display:'block',marginBottom:6}}>{lbl}</label>
              <div style={{position:'relative'}}>
                {pfx&&<span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:'var(--text-sm)',color:'var(--text-muted)',pointerEvents:'none'}}>{pfx}</span>}
                <input className="fld mono" type="number" step={step} value={v} onChange={e=>set(e.target.value)}
                  style={{height:'var(--control-h-md)',padding:pfx?'0 12px 0 36px':'0 12px'}}/>
              </div>
            </div>
          ))}
        </div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:'var(--space-5)'}}>
          {cells.map(c=>(
            <div key={c.label} style={{display:'flex',flexDirection:'column',gap:4,minWidth:0}}>
              <Overline>{c.label}</Overline>
              <div className="tab" style={{fontSize:'var(--text-xl)',fontWeight:'var(--weight-extrabold)',
                letterSpacing:'var(--tracking-tight)',color:cor(c.accent)}}>{c.value}</div>
            </div>
          ))}
        </div>
      )}
      {/* Lista de campanhas */}
      {auto&&verCampanhas&&ads.campanhas?.length>0&&(
        <div style={{marginTop:'var(--space-5)',borderTop:'1px solid var(--border-subtle)',paddingTop:'var(--space-4)'}}>
          {ads.campanhas.map(c=>{
            const roasC=c.investimento>0?c.receita/c.investimento:0;
            return (
              <div key={c.id} style={{display:'flex',alignItems:'center',gap:'var(--space-3)',padding:'10px 0',
                borderBottom:'1px solid var(--border-subtle)',flexWrap:'wrap'}}>
                <div style={{flex:'1 1 200px',minWidth:0}}>
                  <div className="ell" title={c.nome} style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',color:'var(--text-strong)'}}>{c.nome}</div>
                  <div style={{marginTop:4}}><Badge tone={c.status==='active'?'success':'neutral'} dot>{c.status==='active'?'Ativa':c.status}</Badge></div>
                </div>
                {[['Gasto',BRL(c.investimento),'var(--status-warning-fg)',84],
                  ['Receita',BRL(c.receita),'var(--status-success-fg)',84],
                  ['ROAS',`${roasC.toFixed(2)}x`,roasC>=3?'var(--status-success-fg)':roasC>=1?'var(--text-strong)':'var(--status-danger-fg)',58],
                  ['Vendas',NUM(c.vendas),'var(--text-strong)',52]].map(([lbl,val,col,w])=>(
                  <div key={lbl} style={{textAlign:'right',minWidth:w}}>
                    <Overline>{lbl}</Overline>
                    <div className="tab" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-bold)',color:col,marginTop:2}}>{val}</div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}
      {/* Avisos */}
      <div style={{marginTop:'var(--space-4)'}}>
        {auto&&(
          <Note icon="info">Dados puxados direto do Product Ads. O Mercado Livre consolida as métricas por volta das 10h — números do dia atual podem mudar ao longo do dia.</Note>
        )}
        {!auto&&!editing&&(
          <Note tone="warning" icon="alert-triangle">
            {semDados
              ? <>Não foi possível puxar o Product Ads automaticamente{ads?.motivo?` (${ads.motivo})`:''}. Verifique se a conta tem publicidade ativa em <strong>Mercado Livre → Meu perfil → Publicidade</strong>, ou informe os valores manualmente.</>
              : <>Valores informados manualmente para {periodoLabel?.toLowerCase()}.</>}
          </Note>
        )}
      </div>
    </Card>
  );
}
/* ══ VIEW: DASHBOARD ════════════════════════════════════════ */
function ViewDashboard({dados,loading,periodo,setPeriodo,intervalo,onIntervalo,rotuloPeriodo,contasAtivas,toggleConta,onRefresh,onIrParaAnuncios,onIrParaPrejuizos}){
  const m=dados?.metricas||{},ads=dados?.ads||{};
  const multiConta=(dados?.contasUsadas?.length||0)>1;
  const negativos=(dados?.pedidos||[]).filter(p=>p.temCusto&&p.lucro<0).length;

  // Descontar o investimento em ads do lucro — so quando o usuario pede
  const [descontarAds,setDescontarAds]=useState(false);
  const invAds   = m.investimentoAds ?? ads?.investimento ?? 0;
  const temAds   = invAds > 0;
  const lucroExib  = descontarAds&&temAds ? (m.lucroComAds  ?? (m.lucro-invAds)) : m.lucro;
  const margemExib = descontarAds&&temAds
    ? (m.margemComAds ?? (m.fat>0?((m.lucro-invAds)/m.fat)*100:0))
    : m.margem;
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'var(--layout-grid-gap)'}}>
      {/* CABEÇALHO — faturamento, lucro e filtros */}
      <div className="toolbar" style={{justifyContent:'space-between',marginBottom:0}}>
        <PeriodFilter value={periodo} onChange={setPeriodo} intervalo={intervalo} onIntervalo={onIntervalo}/>
        <ContaFilter contas={dados?.contas} ativas={contasAtivas} onToggle={toggleConta}/>
      </div>
      <section className="dashboard-overview" aria-label="Resultado do período" aria-busy={loading}>
        {[
          ['Faturamento',BRL(m.fat),`${NUM(m.pedidosDia)} pedidos · ${NUM(m.qtd)} unidades`],
          ['Lucro',BRL(lucroExib),m.semCusto>0?'Parcial: existem vendas sem custo'
            :descontarAds&&temAds?`Já descontado ${BRL(invAds)} de publicidade`
            :'Após custos, tarifas, frete e impostos'],
          ['Margem',PCT(margemExib),descontarAds&&temAds?'Sobre o faturamento, com ads descontado':`Sobre o faturamento · ${rotuloPeriodo||''}`],
        ].map(([label,value,caption],i)=><div key={label}>
          <Overline>{label}</Overline>
          {loading?<div style={{margin:'12px 0'}}><Skel h={36}/></div>:<div className="metric-value" style={{color:i===0?'var(--text-strong)':lucroExib<0?'var(--status-danger-fg)':'var(--purple-500)'}}>{value}</div>}
          <div className="metric-caption">{loading?'Carregando período…':caption}</div>
        </div>)}
      </section>

      {/* Alternar desconto do investimento em publicidade */}
      {!loading&&temAds&&(
        <div className="attention" style={{borderBottom:'1px solid var(--border-default)'}}>
          <div className="attention-copy">
            <Icon name="megaphone" color={descontarAds?'var(--purple-500)':'var(--text-muted)'}/>
            <span>
              <strong>{descontarAds?'Publicidade descontada do lucro':'Publicidade fora do cálculo'}</strong><br/>
              {descontarAds
                ? <>O lucro acima já desconta {BRL(invAds)} investidos no período.</>
                : <>Você investiu {BRL(invAds)} em ads. O lucro acima não considera esse gasto.</>}
            </span>
          </div>
          <Btn variant={descontarAds?'secondary':'neutral'} size="sm"
            icon={descontarAds?'rotate-ccw':'minus-circle'}
            onClick={()=>setDescontarAds(v=>!v)}>
            {descontarAds?'Mostrar sem descontar':'Descontar publicidade'}
          </Btn>
        </div>
      )}
      {!loading&&(m.semCusto>0||negativos>0)&&<section aria-label="Pontos de atenção">
        {m.semCusto>0&&<div className="attention"><div className="attention-copy"><Icon name="triangle-alert" color="var(--status-warning-fg)"/><span><strong>{NUM(m.semCusto)} vendas sem custo</strong><br/>O resultado está incompleto.</span></div><Btn variant="neutral" size="sm" icon="pencil" onClick={onIrParaAnuncios}>Revisar custos</Btn></div>}
        {negativos>0&&<div className="attention"><div className="attention-copy"><Icon name="trending-down" color="var(--status-danger-fg)"/><span><strong>{NUM(negativos)} pedidos com prejuízo</strong><br/>Confira os custos e as tarifas dessas vendas.</span></div><Btn variant="neutral" size="sm" icon="arrow-right" onClick={onIrParaPrejuizos}>Ver pedidos</Btn></div>}
      </section>}
      {/* KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'var(--layout-grid-gap)'}}>
        {loading?[...Array(4)].map((_,i)=>(
          <div key={i} style={{background:'var(--surface-card)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-xl)',
            padding:'var(--layout-card-pad)',boxShadow:'var(--shadow-sm)',display:'flex',flexDirection:'column',gap:'var(--space-3)'}}>
            <Skel w="55%" h={11}/><Skel h={28}/><Skel w="70%" h={11}/>
          </div>
        )):[
          {label:'Vendas',value:NUM(m.pedidosDia),caption:`${NUM(m.qtd)} unidades`,icon:'shopping-cart'},
          {label:'Ticket médio',value:BRL(m.ticketMedio),caption:'por pedido',icon:'tag',accent:'accent'},
          {label:'Lucro médio',value:BRL(m.pedidosDia>0?lucroExib/m.pedidosDia:0),caption:descontarAds&&temAds?'por pedido, com ads':'por pedido',icon:'circle-dollar-sign',accent:'success',tone:(lucroExib||0)>=0?'success':'danger'},
          {label:'Canceladas',value:NUM(m.canceladas),caption:`${BRL(m.valorCancelado)} não faturados`,icon:'x-circle',accent:'danger'},
        ].map(c=><StatCard key={c.label} {...c}/>)}
      </div>
      {/* COMPOSIÇÃO DO FATURAMENTO */}
      {loading?(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'var(--layout-grid-gap)'}}>
          {[...Array(4)].map((_,i)=>(
            <div key={i} style={{background:'var(--surface-card)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-xl)',
              padding:'var(--layout-card-pad)',boxShadow:'var(--shadow-sm)',display:'flex',flexDirection:'column',gap:'var(--space-3)'}}>
              <Skel w="50%" h={11}/><Skel h={24}/><Skel h={6}/>
            </div>
          ))}
        </div>
      ):(
        <Card title="Composição do faturamento" subtitle={`O que sai de ${BRL(m.fat)}`}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:'var(--space-5)'}}>
            {[
              {label:'Custos',valor:m.custos,viz:1},
              {label:'Tarifas ML',valor:m.tarifas,viz:8},
              {label:'Impostos',valor:m.impostos,viz:3},
              {label:'Frete',valor:m.frete,viz:5},
              ...(descontarAds&&temAds?[{label:'Publicidade',valor:invAds,viz:6}]:[]),
              {label:'Lucro',valor:lucroExib,viz:4},
            ].map(c=>{
              const pct=m.fat>0?(c.valor||0)/m.fat*100:0;
              return (
                <div key={c.label} style={{display:'flex',flexDirection:'column',gap:7,minWidth:0}}>
                  <span style={{fontSize:'var(--text-xs)',color:'var(--text-muted)',fontWeight:'var(--weight-medium)'}}>{c.label}</span>
                  <span className="tab" style={{fontSize:'var(--text-xl)',fontWeight:'var(--weight-bold)',
                    letterSpacing:'var(--tracking-tight)',color:`var(--viz-${c.viz})`}}>{BRL(c.valor)}</span>
                  <div style={{height:6,background:'var(--viz-track)',borderRadius:'var(--radius-pill)',overflow:'hidden'}}>
                    <div style={{width:`${Math.max(0,Math.min(100,pct))}%`,height:'100%',background:`var(--viz-${c.viz})`,
                      borderRadius:'var(--radius-pill)',transition:'width var(--duration-slow) var(--ease-out)'}}/>
                  </div>
                  <span className="tab" style={{fontSize:'var(--text-xs)',color:'var(--text-subtle)'}}>
                    {m.fat>0?`${PCT(pct)} do faturamento`:'—'}
                  </span>
                </div>
              );
            })}
          </div>
        </Card>
      )}
      {/* ADS */}
      {!loading&&<PainelAds ads={ads} dataRef={m.from} onSalvo={onRefresh} periodoLabel={rotuloPeriodo}/>}
      {/* PEDIDOS */}
      <div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'var(--space-3)',gap:'var(--space-3)'}}>
          <h2 style={{fontSize:'var(--text-lg)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)'}}>Pedidos</h2>
          <Badge>{NUM(dados?.pedidos?.length||0)} no período</Badge>
        </div>
        <TabelaPedidos pedidos={dados?.pedidos} loading={loading} multiConta={multiConta} onRefresh={onRefresh} onIrParaAnuncios={onIrParaAnuncios} resetKey={`${periodo}-${contasAtivas.join(',')}`}/>
      </div>
    </div>
  );
}
/* ══ VIEW: ANÚNCIOS (edição em lote) ════════════════════════ */
function ViewAnuncios({dados,loading,onRefresh,onDirty,initialSemCusto=false}){
  const [sync,setSync]=useState({loading:false,resumo:null,erro:''});
  async function sincronizar(){
    setSync({loading:true,resumo:null,erro:''});
    try{
      const r=await call('mlSincronizarAnuncios');
      setSync({loading:false,resumo:r.resumo,erro:''});
      onRefresh();
    }catch(e){
      setSync({loading:false,resumo:null,erro:e.message||'Falha ao sincronizar'});
    }
  }
  const [busca,setBusca]=useState('');
  const [rascunho,setRascunho]=useState({});   // {sku:{custo,imposto}}
  const [salvando,setSalvando]=useState(false);
  const [msg,setMsg]=useState('');
  const [soSemCusto,setSoSemCusto]=useState(initialSemCusto);
  const [status,setStatus]=useState('todos');
  const [ordem,setOrdem]=useState('original');
  const [impostoGlobal,setImpostoGlobal]=useState('');
  const todos=dados?.anuncios||[];
  const multiConta=(dados?.contasUsadas?.length||0)>1;
  // Reseta rascunho quando os dados recarregam
  useEffect(()=>{setRascunho({});},[dados]);
  const anuncios=todos.filter(a=>{
    if(soSemCusto){
      if(a.custo>0)return false;
    }
    if(status!=='todos'&&(status==='active'?a.status!=='active':a.status==='active'))return false;
    if(!busca)return true;
    const q=busca.toLowerCase();
    return String(a.titulo||'').toLowerCase().includes(q)||String(a.sku).toLowerCase().includes(q);
  });
  if(ordem==='titulo')anuncios.sort((a,b)=>String(a.titulo).localeCompare(String(b.titulo),'pt-BR'));
  if(ordem==='vendas')anuncios.sort((a,b)=>(b.vendas||0)-(a.vendas||0));
  if(ordem==='estoque')anuncios.sort((a,b)=>(a.estoque||0)-(b.estoque||0));
  if(ordem==='preco')anuncios.sort((a,b)=>(b.preco||0)-(a.preco||0));
  const pg = usePaginacao(anuncios, [busca, soSemCusto,status,ordem, todos.length]);
  // Valor atual de um campo: rascunho tem prioridade sobre o dado salvo
  const val=(a,campo)=>{
    const r=rascunho[a.sku];
    if(r&&r[campo]!==undefined)return r[campo];
    return a[campo]||'';
  };
  const setCampo=(sku,campo,v)=>{
    setRascunho(d=>({...d,[sku]:{...(d[sku]||{}),[campo]:v}}));
    setMsg('');
  };
  // Quantas linhas foram alteradas
  const alterados=Object.keys(rascunho).filter(sku=>{
    const a=todos.find(x=>String(x.sku)===String(sku));
    if(!a)return false;
    const r=rascunho[sku];
    const c=r.custo!==undefined?parseFloat(r.custo)||0:a.custo;
    const i=r.imposto!==undefined?parseFloat(r.imposto)||0:a.imposto;
    return c!==(a.custo||0)||i!==(a.imposto||0);
  });
  useEffect(()=>{onDirty?.(alterados.length>0);},[alterados.length,onDirty]);
  useEffect(()=>()=>onDirty?.(false),[onDirty]);
  useEffect(()=>{
    if(!alterados.length)return;
    const warn=e=>{e.preventDefault();e.returnValue='';};
    window.addEventListener('beforeunload',warn);
    return()=>window.removeEventListener('beforeunload',warn);
  },[alterados.length]);
  function aplicarImpostoTodos(){
    const v=parseFloat(impostoGlobal);
    if(isNaN(v)||v<0||v>100){setMsg('Erro: informe um imposto entre 0 e 100%.');return;}
    const novo={...rascunho};
    anuncios.forEach(a=>{novo[a.sku]={...(novo[a.sku]||{}),imposto:v};});
    setRascunho(novo);setMsg('');
  }
  async function salvarTudo(){
    if(alterados.length===0)return;
    if(alterados.some(sku=>{
      const r=rascunho[sku];
      return (r.custo!==undefined&&r.custo!==''&&(!Number.isFinite(Number(r.custo))||Number(r.custo)<0))||
        (r.imposto!==undefined&&r.imposto!==''&&(!Number.isFinite(Number(r.imposto))||Number(r.imposto)<0||Number(r.imposto)>100));
    })){setMsg('Erro: revise os custos e impostos. Custo não pode ser negativo e imposto deve estar entre 0 e 100%.');return;}
    setSalvando(true);setMsg('');
    try{
      const itens=alterados.map(sku=>{
        const a=todos.find(x=>String(x.sku)===String(sku));
        const r=rascunho[sku];
        return {
          sku,
          custo:   r.custo!==undefined?parseFloat(r.custo)||0:a.custo,
          imposto: r.imposto!==undefined?parseFloat(r.imposto)||0:a.imposto,
        };
      });
      await call('mlSalvarCustosLote',{itens});
      setMsg(`${itens.length} ${itens.length===1?'produto salvo':'produtos salvos'}`);
      setRascunho({});
      onRefresh(true);
    }catch(e){setMsg('Erro: '+e.message);}
    finally{setSalvando(false);}
  }
  const GRID=multiConta
    ? '56px minmax(0,1fr) 84px 96px 88px 60px 84px 104px 84px'
    : '56px minmax(0,1fr) 96px 88px 60px 84px 104px 84px';
  const HEADS=multiConta
    ? ['','Título','Conta','SKU','Preço','Est.','Visitas','Custo un.','Imp. %']
    : ['','Título','SKU','Preço','Est.','Visitas','Custo un.','Imp. %'];
  if(loading)return (
    <div style={{display:'flex',flexDirection:'column',gap:'var(--space-2)'}}>
      {[...Array(6)].map((_,i)=>(
        <div key={i} style={{background:'var(--surface-card)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-lg)',
          padding:'var(--space-4)',display:'flex',gap:'var(--space-3)',alignItems:'center',boxShadow:'var(--shadow-sm)'}}>
          <Skel w={48} h={48} r="var(--radius-md)"/>
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:7}}><Skel h={13}/><Skel w="40%" h={11}/></div>
          <Skel w={72} h={24}/>
        </div>
      ))}
    </div>
  );
  const semCustoTotal=todos.filter(a=>!a.custo).length;
  return (
    <div style={{paddingBottom:alterados.length>0?150:0}}>
      {/* Barra de ferramentas */}
      <div style={{display:'flex',gap:'var(--space-2)',flexWrap:'wrap',alignItems:'center',marginBottom:'var(--space-4)'}}>
        <div style={{position:'relative',flex:'1 1 260px',maxWidth:380}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',display:'flex'}}>
            <Icon name="search" size={16} color="var(--text-subtle)"/>
          </span>
          <input aria-label="Buscar anúncios" className="fld" value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por título ou SKU"
            style={{height:'var(--control-h-md)',padding:'0 12px 0 38px'}}/>
        </div>
        <label
          style={{display:'inline-flex',alignItems:'center',gap:7,height:'var(--control-h-md)',padding:'0 13px',
            borderRadius:'var(--radius-md)',cursor:'pointer',fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',transition:'var(--tr)',
            background:soSemCusto?'var(--status-warning-bg)':'var(--surface-card)',
            border:`1px solid ${soSemCusto?'var(--status-warning-solid)':'var(--border-default)'}`,
            color:soSemCusto?'var(--status-warning-fg)':'var(--text-body)',boxShadow:'var(--shadow-xs)'}}>
          <input type="checkbox" checked={soSemCusto} onChange={e=>setSoSemCusto(e.target.checked)} style={{accentColor:'var(--purple-500)',width:16,height:16}}/>Sem custo ({NUM(semCustoTotal)})
        </label>
        <div className="toolbar-actions" style={{display:'flex',alignItems:'center',gap:'var(--space-2)',marginLeft:'auto'}}>
          <div style={{position:'relative',width:118}}>
            <input disabled={salvando} className="fld mono" type="number" min="0" max="100" step="0.1" value={impostoGlobal} onChange={e=>setImpostoGlobal(e.target.value)}
              placeholder="0,0" aria-label="Imposto em porcentagem" style={{height:'var(--control-h-md)',padding:'0 30px 0 12px'}}/>
            <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',fontSize:'var(--text-sm)',color:'var(--text-muted)',pointerEvents:'none'}}>%</span>
          </div>
          <Btn variant="neutral" size="md" disabled={salvando||!anuncios.length} onClick={aplicarImpostoTodos}>Aplicar aos {NUM(anuncios.length)}</Btn>
          <Btn variant="secondary" size="md" icon="refresh-cw" onClick={sincronizar} disabled={sync.loading||salvando||alterados.length>0} title={alterados.length?'Salve ou descarte as alterações antes de sincronizar':undefined}>
            {sync.loading?'Sincronizando…':'Buscar novos'}
          </Btn>
        </div>
      </div>
      <div className="toolbar">

// Rotulo curto para cada tipo de mudanca detectada
const TOM_MUDANCA={
  preco:'brand', titulo:'info', qtdFotos:'accent', fotos:'accent',
  video:'accent', freteGratis:'success', logistica:'info',
  tipoAnuncio:'info', status:'warning', vendas:'success', estoque:'neutral',
};

function LinhaMudanca({m}){
  const tom=TOM_MUDANCA[m.campo]||'neutral';
  let detalhe=null;

  if(m.tipo==='moeda'){
    const caiu=m.dif<0;
    detalhe=<span style={{display:'inline-flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
      <span className="tab" style={{color:'var(--text-subtle)',textDecoration:'line-through'}}>{BRL(m.de)}</span>
      <Icon name="arrow-right" size={12} color="var(--text-subtle)"/>
      <span className="tab" style={{fontWeight:'var(--weight-bold)',color:caiu?'var(--status-danger-fg)':'var(--status-success-fg)'}}>{BRL(m.para)}</span>
      <Badge tone={caiu?'danger':'success'}>{caiu?'':'+'}{PCT(m.pct)}</Badge>
    </span>;
  } else if(m.tipo==='numero'){
    detalhe=<span className="tab" style={{color:'var(--text-body)'}}>{NUM(m.de)} → <strong>{NUM(m.para)}</strong></span>;
  } else if(m.tipo==='bool'){
    detalhe=null;
  } else if(m.campo==='titulo'){
    detalhe=<span className="ell" title={m.para} style={{color:'var(--text-body)',maxWidth:340,display:'inline-block',verticalAlign:'bottom'}}>{m.para}</span>;
  } else {
    detalhe=<span style={{color:'var(--text-body)'}}>{String(m.de||'—')} → <strong>{String(m.para||'—')}</strong></span>;
  }

  return (
    <div style={{display:'flex',alignItems:'center',gap:'var(--space-2)',flexWrap:'wrap',padding:'6px 0'}}>
      <Badge tone={tom}>{m.rotulo}</Badge>
      {detalhe&&<span style={{fontSize:'var(--text-xs)'}}>{detalhe}</span>}
    </div>
  );
}

// Mini grafico de linha do historico de precos
function SparkPreco({historico}){
  const pts=(historico||[]).filter(h=>Number.isFinite(h.preco)&&h.preco>0);
  if(pts.length<2)return null;
  const vals=pts.map(p=>p.preco);
  const min=Math.min(...vals),max=Math.max(...vals);
  const span=max-min||1;
  const W=132,H=34;
  const d=pts.map((p,i)=>{
    const x=(i/(pts.length-1))*W;
    const y=H-((p.preco-min)/span)*(H-6)-3;
    return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const subiu=vals[vals.length-1]>=vals[0];
  const cor=subiu?'var(--status-success-solid)':'var(--status-danger-solid)';
  return (
    <div style={{display:'flex',flexDirection:'column',gap:3}}>
      <Overline>Preço · {pts.length}d</Overline>
      <svg width={W} height={H} style={{display:'block',overflow:'visible'}} role="img" aria-label="Variação de preço">
        <path d={d} fill="none" stroke={cor} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round"/>
      </svg>
      <span className="tab" style={{fontSize:'var(--text-2xs)',color:'var(--text-subtle)'}}>{BRL(min)} — {BRL(max)}</span>
    </div>
  );
}

function ViewConcorrentes(){
  const [lista,setLista]=useState(null);
  const [loading,setLoading]=useState(true);
  const [erro,setErro]=useState('');
  const [entrada,setEntrada]=useState('');
  const [apelido,setApelido]=useState('');
  const [adicionando,setAdicionando]=useState(false);
  const [msg,setMsg]=useState('');
  const [removendo,setRemovendo]=useState(null);
  const [termo,setTermo]=useState('');
  const [busca,setBusca]=useState({loading:false,resultado:null,erro:''});

  useEffect(()=>{carregar(true);},[]);

  async function carregar(atualizar=true){
    setLoading(true);setErro('');
    try{
      const r=await call('mlConcorrentesListar',{atualizar});
      setLista(r.concorrentes||[]);
    }catch(e){setErro(e.message||'Não foi possível carregar os concorrentes');}
    finally{setLoading(false);}
  }

  async function adicionar(){
    if(!entrada.trim()){setMsg('Erro: cole o link ou o código do anúncio');return;}
    setAdicionando(true);setMsg('');
    try{
      await call('mlConcorrenteAdd',{entrada:entrada.trim(),apelido:apelido.trim()||null});
      setEntrada('');setApelido('');
      setMsg('Anúncio adicionado ao monitoramento');
      carregar(false);
    }catch(e){setMsg('Erro: '+(e.message||'Não consegui adicionar'));}
    finally{setAdicionando(false);}
  }

  async function remover(itemId){
    if(!confirm('Parar de monitorar este anúncio? O histórico será apagado.'))return;
    setRemovendo(itemId);
    try{await call('mlConcorrenteRemover',{itemId});setLista(l=>l.filter(x=>x.itemId!==itemId));}
    catch(e){alert('Erro: '+e.message);}
    finally{setRemovendo(null);}
  }

  async function buscar(){
    if(!termo.trim()){setBusca({loading:false,resultado:null,erro:'Digite o que quer buscar'});return;}
    setBusca({loading:true,resultado:null,erro:''});
    try{
      const r=await call('mlBuscarConcorrentes',{termo:termo.trim()});
      setBusca({loading:false,resultado:r,erro:''});
    }catch(e){setBusca({loading:false,resultado:null,erro:e.message||'Falha na busca'});}
  }

  async function adicionarDaBusca(itemId){
    try{
      await call('mlConcorrenteAdd',{entrada:itemId});
      setMsg('Anúncio adicionado ao monitoramento');
      carregar(false);
    }catch(e){alert(e.message||'Não consegui adicionar');}
  }

  const comMudanca=(lista||[]).filter(c=>c.mudancas?.length).length;

  return (
    <div style={{display:'flex',flexDirection:'column',gap:'var(--layout-grid-gap)'}}>

      {/* Adicionar */}
      <Card icon="crosshair" title="Monitorar um anúncio"
        subtitle="Cole o link do anúncio do concorrente ou o código MLB">
        <div style={{display:'flex',gap:'var(--space-2)',flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{flex:'1 1 320px',minWidth:0}}>
            <label htmlFor="conc-link" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',display:'block',marginBottom:6}}>Link ou código</label>
            <input id="conc-link" className="fld" value={entrada} onChange={e=>setEntrada(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&adicionar()}
              placeholder="https://produto.mercadolivre.com.br/MLB-… ou MLB1234567890"
              style={{height:'var(--control-h-md)',padding:'0 12px'}}/>
          </div>
          <div style={{flex:'0 1 200px'}}>
            <label htmlFor="conc-apelido" style={{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semibold)',display:'block',marginBottom:6}}>Apelido (opcional)</label>
            <input id="conc-apelido" className="fld" value={apelido} onChange={e=>setApelido(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&adicionar()}
              placeholder="Concorrente 1" style={{height:'var(--control-h-md)',padding:'0 12px'}}/>
          </div>
          <Btn icon="plus" onClick={adicionar} disabled={adicionando}>{adicionando?'Adicionando…':'Monitorar'}</Btn>
        </div>
        {msg&&<div style={{marginTop:'var(--space-3)'}}>
          <Note tone={msg.startsWith('Erro')?'danger':'success'} icon={msg.startsWith('Erro')?'alert-octagon':'check-circle-2'}>{msg}</Note>
        </div>}
      </Card>

      {/* Buscar quem disputa a palavra-chave */}
      <Card icon="search" title="Quem disputa a sua palavra-chave"
        subtitle="Veja os 30 primeiros resultados e descubra quem vale monitorar">

/* ══ VIEW: CONTAS ═══════════════════════════════════════════ */
function ViewContas({dados,onRefresh}){
  const [removendo,setRemovendo]=useState(null);
  const [diag,setDiag]=useState({loading:false,resultado:null,erro:''});
  const [diagVis,setDiagVis]=useState({loading:false,resultado:null,erro:''});
  const contas=dados?.contas||[];

  async function rodarDiagVisitas(){
    setDiagVis({loading:true,resultado:null,erro:''});
    try{
      const r=await call('mlDiagnosticoVisitas');
      setDiagVis({loading:false,resultado:r,erro:''});
    }catch(e){
      setDiagVis({loading:false,resultado:null,erro:e.message||'Falha ao rodar diagnóstico'});
    }
  }
  async function rodarDiagnostico(){
    setDiag({loading:true,resultado:null,erro:''});
    try{
      const r=await call('mlDiagnosticoAds');
      setDiag({loading:false,resultado:r,erro:''});
    }catch(e){
      setDiag({loading:false,resultado:null,erro:e.message||'Falha ao rodar diagnóstico'});
    }
  }
  async function remover(id){
    if(!confirm('Remover esta conta? Os dados dela deixarão de aparecer.'))return;
    setRemovendo(id);
    try{await call('mlRemoverConta',{contaId:id});onRefresh();}
    catch(e){alert('Erro: '+e.message);}
    finally{setRemovendo(null);}
  }
  const conectar=()=>{window.location.href=`https://auth.mercadolivre.com.br/authorization?response_type=code&client_id=${ML_CLIENT_ID}&redirect_uri=${encodeURIComponent(ML_REDIRECT)}`};
  return (
    <div style={{maxWidth:660,display:'flex',flexDirection:'column',gap:'var(--layout-grid-gap)'}}>
      <Card title="Contas conectadas" pad={false}>
        <div style={{borderTop:'1px solid var(--border-subtle)'}}>
          {contas.map((c,i)=>(
            <div key={c.id} style={{padding:'14px var(--layout-card-pad)',borderBottom:i<contas.length-1?'1px solid var(--border-subtle)':'none',
              display:'flex',alignItems:'center',gap:'var(--space-3)'}}>
              <span style={{width:40,height:40,borderRadius:'var(--radius-md)',background:'var(--status-brand-bg)',
                display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <Icon name="store" size={18} color="var(--status-brand-solid)"/>
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div className="ell" style={{fontSize:'var(--text-md)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)'}}>{c.nickname}</div>
                <div className="mono" style={{fontSize:'var(--text-xs)',color:'var(--text-subtle)'}}>ID {c.id}</div>
              </div>
              <Badge tone="success" dot>Conectada</Badge>
              <IconBtn icon="trash-2" label={`Remover ${c.nickname}`} tone="danger" onClick={()=>remover(c.id)} disabled={removendo===c.id}/>
            </div>
          ))}
          {contas.length===0&&<Empty icon="store" title="Nenhuma conta conectada" description="Conecte sua primeira conta do Mercado Livre para começar." compact/>}
        </div>
      </Card>
      <Card title="Adicionar outra conta">
        <p style={{fontSize:'var(--text-sm)',color:'var(--text-body)',marginBottom:'var(--space-4)',lineHeight:1.6}}>
          Conecte quantas contas do Mercado Livre quiser. Os dados são somados no dashboard e você pode filtrar por conta.
        </p>
        <div style={{marginBottom:'var(--space-4)'}}>
          <Note tone="warning" icon="alert-triangle">
            Antes de clicar, <strong>saia da conta atual no site do Mercado Livre</strong> (ou use uma janela anônima).
            Continuando logado na mesma conta, o ML reconecta ela de novo em vez da nova.
          </Note>
        </div>
        <div style={{display:'flex',gap:'var(--space-2)',flexWrap:'wrap'}}>
          <Btn icon="plus" onClick={conectar}>Conectar nova conta</Btn>
          <Btn variant="secondary" icon="external-link" onClick={()=>window.open('https://www.mercadolivre.com.br/jms/mlb/lgz/logout','_blank')}>
            Sair do ML primeiro
          </Btn>
        </div>
      </Card>
      <Card title="Diagnóstico das visitas">
        <p style={{fontSize:'var(--text-sm)',color:'var(--text-body)',marginBottom:'var(--space-4)',lineHeight:1.6}}>
          Testa onze variações do endpoint de visitas do Mercado Livre e mostra a resposta crua de cada uma.
          Use quando a coluna de visitas estiver zerada.
        </p>
        <Btn variant="secondary" icon="stethoscope" onClick={rodarDiagVisitas} disabled={diagVis.loading}>
          {diagVis.loading?'Testando rotas…':'Diagnosticar visitas'}
        </Btn>

        {diagVis.erro&&(
          <div style={{marginTop:'var(--space-4)'}}>
            <Note tone="danger" icon="alert-octagon">{diagVis.erro}</Note>
          </div>

        {diagVis.resultado&&(

            {diagVis.resultado.diagnostico.map(c=>(
              <div key={c.userId} style={{marginBottom:'var(--space-5)'}}>

                  marginBottom:'var(--space-2)',display:'flex',alignItems:'center',gap:'var(--space-2)'}}>
                  <Icon name="store" size={15} color="var(--status-brand-solid)"/>{c.conta}
                </div>
                {c.amostra&&<p className="mono" style={{fontSize:'var(--text-2xs)',color:'var(--text-subtle)',marginBottom:'var(--space-3)'}}>

                    </div>
                    <div className="mono" style={{background:'var(--surface-sunken)',borderRadius:'var(--radius-sm)',padding:'8px 10px',
                      fontSize:11,lineHeight:1.6,color:'var(--text-subtle)',wordBreak:'break-all',maxHeight:140,overflow:'auto'}}>
                      {t.resumo}

                ))}

            <Note tone="info" icon="info">
              Me manda esse resultado. A rota que responder 200 com números é a que sua conta aceita.
            </Note>
          </div>
        )}
      </Card>

      <Card title="Diagnóstico do Product Ads">
        <p style={{fontSize:'var(--text-sm)',color:'var(--text-body)',marginBottom:'var(--space-4)',lineHeight:1.6}}>
          Roda um teste em cada rota da API de publicidade do Mercado Livre e mostra a resposta crua.
          Use quando os dados de ads não estiverem vindo automaticamente.
        </p>
        <Btn variant="secondary" icon="stethoscope" onClick={rodarDiagnostico} disabled={diag.loading}>
          {diag.loading?'Testando rotas…':'Rodar diagnóstico'}
        </Btn>
        {diag.erro&&(
          <div style={{marginTop:'var(--space-4)'}}>
            <Note tone="danger" icon="alert-octagon">{diag.erro}</Note>
          </div>
        )}
        {diag.resultado&&(
          <div style={{marginTop:'var(--space-4)'}}>
            {diag.resultado.diagnostico.map(c=>(
              <div key={c.userId} style={{marginBottom:'var(--space-5)'}}>
                <div style={{fontSize:'var(--text-md)',fontWeight:'var(--weight-bold)',color:'var(--text-strong)',marginBottom:'var(--space-2)',
                  display:'flex',alignItems:'center',gap:'var(--space-2)'}}>
                  <Icon name="store" size={15} color="var(--status-brand-solid)"/>{c.conta}
                </div>
                {c.testes.map((t,i)=>(
                  <div key={i} style={{borderTop:'1px solid var(--border-subtle)',padding:'var(--space-3) 0'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'var(--space-2)',marginBottom:6,flexWrap:'wrap'}}>
                      <Badge tone={t.status===200?'success':t.status===404?'warning':'danger'}>{t.status}</Badge>
                      <span className="mono" style={{fontSize:'var(--text-xs)',color:'var(--text-body)',wordBreak:'break-all'}}>{t.nome}</span>
                    </div>
                    <div className="mono" style={{background:'var(--surface-sunken)',borderRadius:'var(--radius-sm)',padding:'8px 10px',
                      fontSize:11,lineHeight:1.6,color:'var(--text-subtle)',wordBreak:'break-all',maxHeight:120,overflow:'auto'}}>
                      {t.resumo}
                    </div>
                  </div>
                ))}
              </div>
            ))}
            <Note tone="info" icon="info">
              Copie esse resultado e me mande. Com os códigos e as respostas eu descubro qual rota sua conta aceita.
            </Note>
          </div>
        )}
      </Card>
    </div>
  );
}
/* ══ VIEW: ANÁLISE IA ═══════════════════════════════════════
   ATENÇÃO: a chamada abaixo vai direto do navegador para a API da Anthropic.
   Isso não funciona em produção (faltam os headers x-api-key e anthropic-version,
   e o CORS bloqueia). Mova para uma Cloud Function 'mlAnalisarIA' e troque o
   fetch por: const d = await call('mlAnalisarIA', {periodo, metricas, ads, top, ped});
   Nunca coloque a chave da API neste arquivo — ele é público. */
function ViewIA({dados,periodo,rotuloPeriodo}){
  const [analise,setAnalise]=useState(''),[loading,setLoading]=useState(false);
  async function gerar(){
    if(!dados)return;
    setLoading(true);setAnalise('');
    const top=dados.anuncios?.slice(0,15).map(a=>({titulo:a.titulo,preco:BRL(a.preco),visitas:a.visitas,estoque:a.estoque,vendas:a.vendas,custo:a.custo}));
    const ped=dados.pedidos?.slice(0,10).map(p=>({titulo:p.titulo,valor:BRL(p.valor),lucro:BRL(p.lucro),margem:PCT(p.margem)}));
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,
          system:`Você é especialista em Mercado Livre e gestão de e-commerce. Analise os dados e entregue:\n\nDIAGNÓSTICO\nPontos fortes e de atenção do período.\n\nANÁLISE DE MARGEM\nComente a margem e onde há espaço de melhoria.\n\nTOP 3 AÇÕES\nAções concretas e priorizadas.\n\nALERTAS\nEstoque crítico, produtos sem custo cadastrado, margem negativa.\n\nSeja direto, use os números reais. Não use emoji.`,
          messages:[{role:'user',content:`Período: ${rotuloPeriodo||PLABEL[periodo]}\nMétricas: ${JSON.stringify(dados.metricas)}\nAds: ${JSON.stringify(dados.ads)}\nTop anúncios: ${JSON.stringify(top)}\nPedidos recentes: ${JSON.stringify(ped)}`}]})});
      const d=await r.json();
      setAnalise(d.content?.[0]?.text||'Erro ao gerar análise');
    }catch(e){setAnalise('Erro: '+e.message);}
    finally{setLoading(false);}
  }
  return (
    <div style={{maxWidth:780}}>
      {!loading&&!analise&&(
        <Card>
          <Empty icon="sparkles" title="Diagnóstico da conta com IA"
            description="Análise das métricas do período, margem por produto e as próximas ações prioritárias."
            action={<Btn onClick={gerar} icon="sparkles">Gerar análise</Btn>}/>
        </Card>
      )}
      {loading&&(
        <Card>
          <div style={{display:'flex',flexDirection:'column',gap:'var(--space-3)',padding:'var(--space-4) 0'}}>
            <Skel w="40%" h={13}/><Skel h={13}/><Skel h={13}/><Skel w="75%" h={13}/>
            <div style={{height:'var(--space-4)'}}/>
            <Skel w="35%" h={13}/><Skel h={13}/><Skel w="60%" h={13}/>
            <div style={{fontSize:'var(--text-sm)',color:'var(--text-muted)',marginTop:'var(--space-3)'}}>Analisando sua conta…</div>
          </div>
        </Card>
      )}
      {analise&&(
        <Card>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'var(--space-3)',flexWrap:'wrap',marginBottom:'var(--space-4)'}}>
            <Overline>Diagnóstico · {new Date().toLocaleDateString('pt-BR')} · {rotuloPeriodo||PLABEL[periodo]}</Overline>
            <Btn variant="neutral" size="sm" onClick={gerar} icon="refresh-cw">Reanalisar</Btn>
          </div>
          <div style={{fontSize:'var(--text-md)',color:'var(--text-body)',lineHeight:1.75,whiteSpace:'pre-wrap',textWrap:'pretty'}}>{analise}</div>
        </Card>
      )}
    </div>
  );
}

/* Drawer mobile — abre a mesma navegação em tela cheia */
function Drawer({open,onClose,active,onSelect,seller,onSair}){
  const panel=useRef(null);
  useEffect(()=>{
    if(!open)return;
    const previous=document.activeElement;
    const previousOverflow=document.body.style.overflow;
    document.body.style.overflow='hidden';
    panel.current?.querySelector('button')?.focus();
    return()=>{document.body.style.overflow=previousOverflow;previous?.focus();};
  },[open]);
  if(!open)return null;
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'var(--surface-overlay)',backdropFilter:'blur(2px)',zIndex:60,display:'flex'}}>
      <div ref={panel} role="dialog" aria-modal="true" aria-label="Navegação" onKeyDown={e=>{
        if(e.key==='Escape')onClose();
        if(e.key==='Tab'){
          const items=[...panel.current.querySelectorAll('button:not([disabled])')];
          const first=items[0],last=items[items.length-1];
          if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
          if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
        }
      }} onClick={e=>e.stopPropagation()} style={{width:'min(280px,82vw)',background:'var(--surface-nav)',
        display:'flex',flexDirection:'column',animation:'rise var(--duration-base) var(--ease-out)'}}>
        <div style={{height:'var(--layout-topbar-h)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 var(--space-4) 0 var(--space-5)'}}>
          <Logo height={20} inverse/>
          <button onClick={onClose} aria-label="Fechar menu" style={{background:'none',border:'none',cursor:'pointer',
            color:'var(--on-dark-muted)',display:'flex',padding:8}}><Icon name="x" size={18}/></button>
        </div>
        <nav style={{flex:1,padding:'var(--space-2) var(--space-3)',display:'flex',flexDirection:'column',gap:2}}>
          {NAV.map(it=><NavItem key={it.id} item={it} active={active===it.id} onSelect={id=>{onSelect(id);onClose();}}/>)}
        </nav>
        <div style={{padding:'var(--space-3)',borderTop:'1px solid var(--border-inverse)',display:'flex',alignItems:'center',gap:10}}>
          <span style={{width:32,height:32,borderRadius:'50%',background:'var(--purple-500)',color:'#fff',display:'flex',
            alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:'var(--text-xs)',fontWeight:'var(--weight-bold)'}}>
            {(seller?.nickname||'·').slice(0,2).toUpperCase()}
          </span>
          <div style={{flex:1,minWidth:0}}>
            <div className="ell" style={{fontSize:'var(--text-xs)',fontWeight:'var(--weight-bold)',color:'#fff'}}>{seller?.nickname||'—'}</div>
            <button onClick={onSair} style={{background:'none',border:'none',color:'var(--on-dark-muted)',cursor:'pointer',fontSize:'var(--text-2xs)',padding:0}}>Sair</button>
          </div>
        </div>
      </div>
    </div>
  );
}
/* ══ APP LOGADO ═════════════════════════════════════════════ */
function AppLogado({user,erroConexao}){
  const [view,setView]=useState('dashboard');
  const [periodo,setPeriodo]=useState('hoje');
  const [intervalo,setIntervalo]=useState(null);   // {from,to} quando periodo='personalizado'
  const [dados,setDados]=useState(null);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  const [contasAtivas,setContasAtivas]=useState([]);
  const [isMobile,setIsMobile]=useState(window.innerWidth<1024);
  const [drawer,setDrawer]=useState(false);
  const [dirty,setDirty]=useState(false);
  const [filtroPedidos,setFiltroPedidos]=useState('todos');
  const [filtroCustos,setFiltroCustos]=useState(false);
  const requestId=useRef(0);
  const descartarSeNecessario=()=>!dirty||window.confirm('Há alterações não salvas. Deseja descartá-las?');
  function navegar(id){
    if(id===view)return;
    if(!descartarSeNecessario())return;
    setDirty(false);setFiltroCustos(false);setFiltroPedidos('todos');setView(id);
  }
  function sair(){if(descartarSeNecessario())auth.signOut();}
  function revisarCustos(){setFiltroCustos(true);setView('anuncios');}
  function revisarPrejuizos(){setFiltroPedidos('prejuizo');setView('pedidos');}
  useEffect(()=>{
    const mq=window.matchMedia('(max-width: 1023px)');
    const h=()=>setIsMobile(mq.matches);
    h();mq.addEventListener('change',h);
    return()=>mq.removeEventListener('change',h);
  },[]);
  useEffect(()=>{carregar();},[periodo,intervalo,contasAtivas]);
  async function carregar(force=false){
    if(force!==true&&!descartarSeNecessario())return;
    const currentRequest=++requestId.current;
    setLoading(true);setErr('');
    try{
      const r=await call('mlGetDados',{periodo,intervalo:periodo==='personalizado'?intervalo:null,contas:contasAtivas.length?contasAtivas:null});
      if(currentRequest!==requestId.current)return;
      setDados({...r,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
      if(contasAtivas.length===0&&r.contas?.length)setContasAtivas(r.contas.filter(c=>c.ativa).map(c=>c.id));
    }catch(e){if(currentRequest===requestId.current)setErr('Erro ao carregar: '+e.message);}
    finally{if(currentRequest===requestId.current)setLoading(false);}
  }
  const toggleConta=id=>setContasAtivas(a=>a.includes(id)?(a.length>1?a.filter(x=>x!==id):a):[...a,id]);
  const escolherPeriodo=p=>{setIntervalo(null);setPeriodo(p);};
  const escolherIntervalo=iv=>{setIntervalo(iv);setPeriodo('personalizado');};
  // Rotulo do periodo para o cabecalho e a IA
  const rotuloPeriodo=periodo==='personalizado'&&intervalo
    ? (intervalo.from===intervalo.to ? fmtData(intervalo.from) : `${fmtData(intervalo.from)} a ${fmtData(intervalo.to)}`)
    : PLABEL[periodo];
  const multiConta=(dados?.contasUsadas?.length||0)>1;
  const titulo=NAV.find(n=>n.id===view)?.label;
  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--surface-page)'}}>
      {!isMobile&&<Sidebar active={view} onSelect={navegar} seller={dados?.seller} onSair={sair}/>}
      {isMobile&&<Drawer open={drawer} onClose={()=>setDrawer(false)} active={view} onSelect={navegar} seller={dados?.seller} onSair={sair}/>}
      <div style={{marginLeft:isMobile?0:'var(--layout-sidebar-w)',flex:1,minWidth:0,display:'flex',flexDirection:'column',
        minHeight:'100vh',paddingBottom:isMobile?'calc(var(--layout-bottomnav-h) + env(safe-area-inset-bottom))':0}}>
        {/* TopBar — clara, na área de trabalho */}
        <header className="app-topbar" style={{minHeight:'var(--layout-topbar-h)',background:'rgba(255,255,255,.84)',
          borderBottom:'1px solid rgba(226,224,232,.78)',display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:isMobile?'0 var(--layout-gutter-mobile)':'0 var(--layout-gutter)',gap:'var(--space-3)',
          position:'sticky',top:0,zIndex:20,backdropFilter:'blur(16px)',boxShadow:'0 12px 30px -30px rgba(31,24,42,.5)'}}>
          <div style={{display:'flex',alignItems:'center',gap:'var(--space-2)',minWidth:0}}>
            {isMobile&&<IconBtn icon="menu" label="Abrir menu" onClick={()=>setDrawer(true)}/>}
            <h1 className="ell" style={{fontSize:isMobile?'var(--text-lg)':'var(--text-xl)',fontWeight:'var(--weight-extrabold)',color:'var(--text-strong)',letterSpacing:'0'}}>{titulo}</h1>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'var(--space-2)',flexShrink:0}}>
            {dados?.hora&&!isMobile&&<span className="tab" style={{fontSize:'var(--text-xs)',color:'var(--text-subtle)'}}>Atualizado {dados.hora}</span>}
            {isMobile
              ? <IconBtn icon="refresh-cw" label="Atualizar" onClick={carregar} disabled={loading}/>
              : <Btn variant="neutral" size="sm" icon="refresh-cw" onClick={carregar} disabled={loading}>{loading?'Atualizando…':'Atualizar'}</Btn>}
          </div>
        </header>
        <main style={{flex:1,padding:isMobile?'var(--layout-gutter-mobile)':'var(--layout-gutter)',
          maxWidth:'var(--layout-max-content)',width:'100%',minWidth:0,animation:'rise var(--duration-slow) var(--ease-out)'}}>
          <div className="workspace-status" role="status" aria-live="polite">
            <span className={loading?'spin':undefined}><Icon name={loading?'loader-circle':err?'circle-alert':'circle-check'} size={14} color={err?'var(--status-danger-fg)':'var(--text-accent)'}/></span>
            <span>{loading?'Atualizando dados…':err?'Atualização não concluída':dados?.hora?<>Dados recebidos às <time>{dados.hora}</time></>:'Aguardando dados'}</span>
            <span style={{marginLeft:'auto'}}>{rotuloPeriodo}</span>
          </div>
          {(err||erroConexao)&&<div role="alert" style={{marginBottom:'var(--layout-grid-gap)'}}>
            <Note tone="danger" icon="alert-octagon">{err||erroConexao}{dados&&<span> Os dados exibidos são da última atualização concluída.</span>}</Note>
            {err&&<div style={{marginTop:8}}><Btn variant="neutral" icon="refresh-cw" disabled={loading} onClick={carregar}>Tentar novamente</Btn></div>}
          </div>}
          {!dados&&!loading&&err?null:<>
          {view==='dashboard'&&<ViewDashboard dados={dados} loading={loading} periodo={periodo} setPeriodo={escolherPeriodo} intervalo={intervalo} onIntervalo={escolherIntervalo} rotuloPeriodo={rotuloPeriodo} contasAtivas={contasAtivas} toggleConta={toggleConta} onRefresh={carregar} onIrParaAnuncios={revisarCustos} onIrParaPrejuizos={revisarPrejuizos}/>}
          {view==='pedidos'&&(
            <div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'var(--space-3)',
                flexWrap:'wrap',marginBottom:'var(--layout-grid-gap)'}}>
                <div style={{display:'flex',alignItems:'baseline',gap:'var(--space-2)'}}>
                  <span className="tab" style={{fontSize:'var(--text-2xl)',fontWeight:'var(--weight-extrabold)',
                    color:'var(--text-strong)',letterSpacing:'var(--tracking-tight)'}}>{NUM(dados?.pedidos?.length||0)}</span>
                  <span style={{fontSize:'var(--text-sm)',color:'var(--text-muted)'}}>pedidos no período</span>
                </div>
                <div style={{display:'flex',gap:'var(--space-2)',flexWrap:'wrap',justifyContent:'flex-end'}}>
                  <ContaFilter contas={dados?.contas} ativas={contasAtivas} onToggle={toggleConta}/>
                  <PeriodFilter value={periodo} onChange={escolherPeriodo} intervalo={intervalo} onIntervalo={escolherIntervalo}/>
                </div>
              </div>
              <TabelaPedidos pedidos={dados?.pedidos} loading={loading} multiConta={multiConta} onRefresh={carregar} onIrParaAnuncios={revisarCustos} initialFilter={filtroPedidos} resetKey={`${periodo}-${contasAtivas.join(',')}`}/>
            </div>
          )}
          {view==='anuncios'&&<ViewAnuncios dados={dados} loading={loading} onRefresh={carregar} onDirty={setDirty} initialSemCusto={filtroCustos}/>}
          {view==='concorrentes'&&<ViewConcorrentes/>}
          {view==='ia'&&<ViewIA dados={dados} periodo={periodo} rotuloPeriodo={rotuloPeriodo}/>}
          {view==='contas'&&<ViewContas dados={dados} onRefresh={carregar}/>}
          </>}
        </main>
      </div>
      {isMobile&&<BottomNav active={view} onSelect={navegar}/>}
    </div>
  );
}
/* ══ ROOT ═══════════════════════════════════════════════════ */
function App(){
  const [user,setUser]=useState(undefined),[mlOk,setMlOk]=useState(null),[chk,setChk]=useState(false);
  const [conectandoConta,setConectandoConta]=useState(false);
  const [erroConexao,setErroConexao]=useState('');
  const [nonce,setNonce]=useState(0);
  // Troca o code do OAuth por token — exatamente uma vez por carregamento.
  // Roda tanto na 1a conexao quanto ao adicionar contas extras.
  useEffect(()=>{
    if(!user||!OAUTH_CODE||OAUTH_CONSUMIDO)return;
    OAUTH_CONSUMIDO=true;
    (async()=>{
      setConectandoConta(true);setErroConexao('');
      try{
        const r=await call('mlTokenExchange',{code:OAUTH_CODE});
        if(r.success){setMlOk(true);setNonce(n=>n+1);}
      }catch(e){
        const m=String(e.message||'');
        setErroConexao(
          /invalid_grant|already used|expired/i.test(m)
            ? 'O código de autorização expirou ou já foi usado. Clique em "Conectar nova conta" novamente.'
            : (m||'Não foi possível conectar a conta')
        );
      }finally{setConectandoConta(false);}
    })();
  },[user]);
  useEffect(()=>auth.onAuthStateChanged(async u=>{
    setUser(u);
    if(u){
      setChk(true);
      try{
        const c=await call('mlListarContas');
        setMlOk((c.contas?.length||0)>0);
      }catch{
        try{
          const s=await db.collection('users').doc(u.uid).collection('mlTokens').doc('main').get();
          setMlOk(s.exists);
        }catch{setMlOk(false);}
      }finally{setChk(false);}
    }else setMlOk(null);
  }),[]);
  if(user===undefined||chk)return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--surface-nav)',alignItems:'center',justifyContent:'center'}}>
      <Logo height={24} inverse/>
    </div>
  );
  if(!user)return <TelaLogin/>;
  if(conectandoConta)return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--surface-nav)',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'var(--space-4)'}}>
      <Logo height={24} inverse/>
      <div style={{fontSize:'var(--text-sm)',color:'var(--on-dark-muted)'}}>Conectando conta do Mercado Livre…</div>
    </div>
  );
  if(!mlOk)return <TelaConectar user={user} onOk={()=>setMlOk(true)} erro={erroConexao}/>;
  return <AppLogado user={user} key={nonce} erroConexao={erroConexao}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
